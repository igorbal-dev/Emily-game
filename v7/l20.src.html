<script>
const IMG = __IMG__;  /*IMG: emily_{idle,blink,mouth1,mouth2,talk,wave,jump,surprised}_shoes emily_{crouch,laugh,walk} isabel_{idle,blink,talk,wave,jump} paul_{idle,blink,talk,wave,jump} sommer_{idle,blink,talk,wave} leon_{idle,blink,talk,wave,jump,laugh,sad,throw,sly,shy,oh}*/
const SND = __SND__;  /*SND: a_super a_toll a_prima a_juhu a_wunderbar a_nach r_like_emily a_final r_tipp_licht*/
/* фразы без записи — пока голос браузера (js/mini.js), тексты для озвучки — voice-next.md */
const SAY = {
  n20_intro: 'In der Kita. Isabel und Paul bauen mit Bausteinen. Leon ist auch da.',
  l20_bloed: 'Du bist blöd!',
  e20_nicht_bloed: 'Nein! Ich bin nicht blöd. Das ist nicht nett!',
  n20_haut: 'Au! Leon haut Emily auf den Arm!',
  e20_aua: 'Aua! Nicht hauen!',
  n19_was: 'Was macht Emily? Tipp auf ein Bild!',
  r19_was: 'Что сделает Эмили? Нажми на картинку!',
  n20_opt_heike: 'Emily sagt es Heike.',
  n20_opt_hauen: 'Emily haut zurück.',
  n20_opt_nichts: 'Emily sagt nichts.',
  e20_heike: 'Heike, Leon hat mich gehauen.',
  s20_gut: 'Gut, dass du es mir sagst. Leon, wir hauen nicht!',
  s20_stopp: 'Stopp! Ihr zwei! Hier haut keiner, nicht Leon und nicht Emily! Sagt euch Entschuldigung.',
  e20_entschuldigung: 'Entschuldigung.',
  l19_entschuldigung: 'Entschuldigung.',
  s20_hol_mich: 'Wenn dich jemand haut, hol mich. Dann helfe ich dir.',
  e20_okay: 'Okay.',
  n20_sag: 'Sag etwas! Hol Hilfe!',
  s20_fuehlst: 'Wie fühlst du dich?',
  r20_fuehlst: 'Как ты себя чувствуешь? Нажми на картинку!',
  n20_traurig: 'Traurig.',
  n20_wuetend: 'Wütend.',
  e20_traurig: 'Ich bin traurig.',
  e20_wuetend: 'Ich bin wütend.',
  s20_verstehe: 'Das verstehe ich. Ich bin für dich da.',
  l20_fluester: 'Spielt nicht mit Emily! Spielt nur mit mir!',
  n20_opt_fragen: 'Emily fragt ihre Freunde.',
  n20_opt_heike2: 'Emily holt Heike.',
  n20_opt_allein: 'Emily geht allein weg.',
  e20_spielt_ihr: 'Isabel, Paul, spielt ihr mit mir?',
  i20_klar: 'Ja, klar! Du bist meine Freundin.',
  p20_bestimmt: 'Leon bestimmt das nicht!',
  s20_alle: 'Alle dürfen mitspielen.',
  n20_frag: 'Frag deine Freunde!',
  e20_alle: 'Leon, du kannst auch mitspielen. Wir spielen alle zusammen!',
  l20_okay: 'Okay …',
  n20_turm: 'Tipp auf die Bausteine! Ihr baut zusammen einen Turm.',
  l20_spielst: 'Entschuldigung. Spielst du mit mir?',
  n20_ja: 'Ja!',
  n20_nein: 'Nein, jetzt nicht.',
  n20_was_sagst: 'Was sagst du? Tipp auf ein Bild!',
  r20_sagst: 'Что ты ответишь? Нажми на картинку!',
  e20_ja: 'Ja!',
  e20_nein: 'Nein, jetzt nicht.',
  n20_lob_ja: 'Schön! Ihr spielt zusammen.',
  n20_lob_nein: 'Das ist auch okay. Du darfst Nein sagen.',
  n20_ende: 'Super! Heute spielen alle zusammen.'
};

<script>
/* Уровень 20: садик. Леон дразнит («Nein! Ich bin nicht blöd…»), бьёт по руке («Aua! Nicht hauen!») — три карточки: сказать Heike, дать сдачи
   (засчитывается, но Heike объясняет), ничего не делать (снова). Чувства на карточках-лицах. Леон шепчет друзьям «Spielt nicht mit Emily!» —
   спросить друзей, позвать Heike или уйти одной (снова). Эмили зовёт всех играть, башня вчетвером. Леон: «Spielst du mit mir?» — «Ja» и «Nein» оба верны. */
const LEVEL = 20;
const STICKER = '<svg viewBox="0 0 100 100"><g stroke-width="3" stroke-linejoin="round"><rect x="30" y="66" width="40" height="22" rx="3" fill="#ff7a59" stroke="#d65a3b"/><rect x="34" y="44" width="32" height="22" rx="3" fill="#ffd34d" stroke="#d6a21e"/><rect x="38" y="24" width="24" height="20" rx="3" fill="#32b67a" stroke="#1f8a5a"/><rect x="42" y="8" width="16" height="16" rx="3" fill="#5aa8f0" stroke="#2f80ed"/></g><path d="M14 56 C6 50 8 42 13 43 C14 44 14 45 14 46 C14 45 14 44 15 43 C20 42 22 50 14 56 Z M86 56 C78 50 80 42 85 43 C86 44 86 45 86 46 C86 45 86 44 87 43 C92 42 94 50 86 56 Z" fill="#ff6b8a"/></svg>';

/* ---------- фон: игровой уголок садика — окно, полки с игрушками, ковёр ---------- */
const RUG = 0.64;
function drawScene(g, W, H, L){
  const fy = L.floorY, hE = L.hE; g.lineCap = 'round'; g.lineJoin = 'round';
  g.fillStyle = '#fff1c9'; g.fillRect(0, 0, W, fy);
  g.fillStyle = '#ffe2a0'; g.fillRect(0, fy - hE*0.55, W, hE*0.5);
  g.fillStyle = '#c98f55'; g.fillRect(0, fy - hE*0.06, W, H - fy + hE*0.06);
  /* окна */
  for (const wx of [0.3, 0.52]){ const x = W*wx, y = fy - hE*1.65;
    g.fillStyle = '#8fd3ff'; g.fillRect(x, y, hE*0.7, hE*0.55); g.strokeStyle = '#fff'; g.lineWidth = hE*0.04; g.strokeRect(x, y, hE*0.7, hE*0.55);
    g.beginPath(); g.moveTo(x + hE*0.35, y); g.lineTo(x + hE*0.35, y + hE*0.55); g.stroke(); }
  /* полка с игрушками справа */
  const sx = W*0.86; g.fillStyle = '#e8904a'; g.fillRect(sx - hE*0.4, fy - hE*1.1, hE*0.8, hE*0.06); g.fillRect(sx - hE*0.4, fy - hE*0.7, hE*0.8, hE*0.06);
  [['#ff7a59', -0.25], ['#32b67a', 0], ['#9b6bff', 0.25]].forEach(([c, dx]) => { g.fillStyle = c; g.fillRect(sx + hE*dx - hE*0.08, fy - hE*1.28, hE*0.16, hE*0.18); });
  g.fillStyle = '#ffd34d'; g.beginPath(); g.arc(sx, fy - hE*0.82, hE*0.1, 0, 7); g.fill();
  /* ковёр для игры */
  g.fillStyle = '#7ab8f5'; g.beginPath(); g.ellipse(W*RUG, fy + hE*0.02, hE*0.95, hE*0.13, 0, 0, 7); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = hE*0.02; g.setLineDash([hE*0.05, hE*0.04]); g.beginPath(); g.ellipse(W*RUG, fy + hE*0.02, hE*0.85, hE*0.1, 0, 0, 7); g.stroke(); g.setLineDash([]);
}

const BLOCK = c => `<svg viewBox="0 0 60 40"><rect x="3" y="3" width="54" height="34" rx="5" fill="${c}" stroke="rgba(0,0,0,.25)" stroke-width="4"/><circle cx="18" cy="20" r="5" fill="#fff" opacity=".5"/><circle cx="42" cy="20" r="5" fill="#fff" opacity=".5"/></svg>`;
const BCOL = ['#ff7a59', '#ffd34d', '#32b67a', '#5aa8f0', '#9b6bff', '#ff8fb8'];
const PILE = '<svg viewBox="0 0 100 60"><g stroke="rgba(0,0,0,.25)" stroke-width="3"><rect x="4" y="30" width="30" height="26" rx="4" fill="#ff7a59"/><rect x="36" y="34" width="30" height="22" rx="4" fill="#5aa8f0"/><rect x="68" y="30" width="28" height="26" rx="4" fill="#32b67a"/><rect x="22" y="8" width="30" height="22" rx="4" fill="#ffd34d"/><rect x="54" y="10" width="26" height="20" rx="4" fill="#9b6bff"/></g></svg>';
const FACE_SAD = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#9fd0ff" stroke="#2f80ed" stroke-width="5"/><circle cx="34" cy="42" r="6" fill="#1f3f70"/><circle cx="66" cy="42" r="6" fill="#1f3f70"/><path d="M28 30 l12 -5 M72 30 l-12 -5" stroke="#1f3f70" stroke-width="5" stroke-linecap="round"/><path d="M30 76 Q50 58 70 76" fill="none" stroke="#1f3f70" stroke-width="6" stroke-linecap="round"/><path d="M33 52 q-4 10 0 16" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
const FACE_MAD = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#ff8f7a" stroke="#d65a3b" stroke-width="5"/><circle cx="34" cy="46" r="6" fill="#5a1a10"/><circle cx="66" cy="46" r="6" fill="#5a1a10"/><path d="M24 30 l18 8 M76 30 l-18 8" stroke="#5a1a10" stroke-width="6" stroke-linecap="round"/><path d="M32 74 Q50 64 68 74" fill="none" stroke="#5a1a10" stroke-width="6" stroke-linecap="round"/><path d="M80 14 l6 -8 M88 22 l8 -4" stroke="#d65a3b" stroke-width="5" stroke-linecap="round"/></svg>';
const YES = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#32b67a" stroke="#1f8a5a" stroke-width="5"/><path d="M28 52 L44 68 L74 34" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LATER = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#9b6bff" stroke-width="6"/><path d="M50 20 V50 L68 62" fill="none" stroke="#9b6bff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="50" r="5" fill="#9b6bff"/></svg>';

let emily, leon, isabel, paul, heike, pile, blocks = [];
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'surprised', 'crouch', 'laugh', 'walk'];
const LP = ['idle', 'blink', 'talk', 'wave', 'jump', 'laugh', 'sad', 'throw', 'sly', 'shy', 'oh'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = []; blocks = [];
  pile = T.prop(PILE, {x: RUG, py: () => L.floorY + L.hE*0.06, w: 0.5, ratio: 0.6, z: 38});
  heike = T.hero('sommer', {x: 0.1, h: 1.5, poses: ['idle', 'blink', 'talk', 'wave']});
  isabel = T.hero('isabel', {x: RUG - 0.12, h: 0.92, poses: ['idle', 'blink', 'talk', 'wave', 'jump']});
  paul = T.hero('paul', {x: RUG + 0.13, h: 0.95, poses: ['idle', 'blink', 'talk', 'wave', 'jump']});
  leon = T.hero('leon', {x: 0.48, h: 1.02, poses: LP});
  emily = T.hero('emily', {x: 0.3, outfit: 'shoes', poses: EP});
}
/* кубик ложится на башню */
async function addBlock(i, from){
  const w = 0.32, h = L.hE*w*40/60, y = () => L.floorY - L.hE*0.12 - blocks.length*h*0.92;
  const lvl = blocks.length, b = T.prop(BLOCK(BCOL[i % BCOL.length]), {x: RUG, py: () => L.floorY - L.hE*0.12 - lvl*h*0.92, w, ratio: 40/60, z: 46 + lvl});
  blocks.push(b);
  const r0 = (from.el || from).getBoundingClientRect(), r1 = b.el.getBoundingClientRect();
  await b.el.animate([{transform: `translate(${r0.left + r0.width/2 - r1.left - r1.width/2}px,${r0.top + r0.height*0.4 - r1.top}px) scale(.6)`}, {transform: 'none'}], {duration: 600, easing: 'cubic-bezier(.3,.7,.4,1)'}).finished.catch(() => {});
  sfx.clink();
}
const card = (parts, clip) => ({parts, clip, bg: '#fff8e8', ground: '#e8b47a'});

async function story(){
  await play('n20_intro');
  /* 1. дразнит */
  leon.set('sly'); await leon.walkTo(0.42, 700);
  await leon.say('l20_bloed');
  emily.set('surprised'); await sleep(400);
  await T.repeat('e20_nicht_bloed');
  leon.set('idle'); await sleep(300);

  /* 2. ударил: три карточки */
  leon.set('throw'); sfx.bonk(); emily.set('surprised'); emily.hop(); await play('n20_haut'); leon.set('sly');
  await T.repeat('e20_aua');
  while (true){
    const i = await T.choose([
      card([{img: 'emily_wave_shoes', x: 30, h: 66}, {img: 'sommer_talk', x: 70, h: 86}], 'n20_opt_heike'),
      card([{img: 'emily_jump_shoes', x: 34, h: 70}, {img: 'leon_oh', x: 68, h: 70, rot: 10}, {fx: 'zap', x: 42, y: 36}], 'n20_opt_hauen'),
      card([{img: 'emily_crouch', x: 38, h: 52}, {img: 'leon_throw', x: 70, h: 70}], 'n20_opt_nichts')
    ], 'n19_was', 'r19_was');
    if (i === 0){
      /* лучший: сказать Heike */
      await emily.walkTo(0.2, 700); emily.set('wave');
      await T.repeat('e20_heike'); emily.set('idle');
      await heike.say('s20_gut');
      leon.set('shy'); await leon.say('l19_entschuldigung');
      break;
    }
    if (i === 1){
      /* дать сдачи: толкаются, Heike разнимает и объясняет */
      emily.set('jump'); await T.glide(emily, 0.36, 0, 250, 'ease-out'); sfx.bonk(); leon.set('oh');
      await sleep(300); leon.set('throw'); sfx.bonk();
      emily.el.classList.add('wobble'); leon.el.classList.add('wobble');
      const dust = setInterval(() => T.burst([L.W*0.39, L.floorY - L.hE*0.5], null, '#d9cbb8', 6), 400);
      await heike.walkTo(0.24, 700); clearInterval(dust);
      emily.el.classList.remove('wobble'); leon.el.classList.remove('wobble'); emily.set('idle'); leon.set('idle');
      await T.glide(emily, 0.3, 0, 300);
      heike.set('wave'); await heike.say('s20_stopp'); heike.set('idle');
      await T.repeat('e20_entschuldigung');
      leon.set('shy'); await leon.say('l19_entschuldigung');
      await heike.walkTo(0.22, 400);
      await heike.say('s20_hol_mich');
      await T.repeat('e20_okay');
      break;
    }
    /* ничего не делать: Леон снова замахивается */
    emily.set('crouch'); await sleep(400);
    leon.set('throw'); leon.hop(); sfx.tone(300, 200, 150, 'triangle', .2); await sleep(500); leon.set('sly');
    await play('n20_sag'); emily.set('idle');
  }
  leon.set('idle'); await T.bone(emily);

  /* 3. чувства: карточки-лица */
  await heike.walkTo(0.18, 500);
  await heike.say('s20_fuehlst');
  const f = await T.choose([card([{svg: FACE_SAD, x: 50, y: 12, w: 56, hh: 72}], 'n20_traurig'), card([{svg: FACE_MAD, x: 50, y: 12, w: 56, hh: 72}], 'n20_wuetend')], 's20_fuehlst', 'r20_fuehlst');
  await T.repeat(f ? 'e20_wuetend' : 'e20_traurig');
  await heike.say('s20_verstehe');
  T.hearts(emily); await T.bone(emily);

  /* 4. Леон настраивает друзей: три карточки */
  await emily.walkTo(0.3, 400);
  leon.set('sly'); await leon.walkTo(RUG - 0.02, 800);
  await leon.say('l20_fluester');
  isabel.set('idle'); paul.set('idle'); isabel.face(true); paul.face(true);
  isabel.el.animate([{transform: 'rotate(0)'}, {transform: 'rotate(-6deg)'}, {transform: 'rotate(0)'}], {duration: 700});
  paul.el.animate([{transform: 'rotate(0)'}, {transform: 'rotate(6deg)'}, {transform: 'rotate(0)'}], {duration: 700}); await sleep(800);
  while (true){
    const i = await T.choose([
      card([{img: 'emily_talk_shoes', x: 28, h: 68}, {img: 'isabel_wave', x: 58, h: 64}, {img: 'paul_wave', x: 80, h: 66}, {fx: 'hearts', x: 48, y: 10}], 'n20_opt_fragen'),
      card([{img: 'emily_wave_shoes', x: 30, h: 66}, {img: 'sommer_wave', x: 70, h: 86}], 'n20_opt_heike2'),
      card([{img: 'emily_crouch', x: 24, h: 52}, {fx: 'tears', x: 24, y: 46}, {img: 'isabel_idle', x: 66, h: 60}, {img: 'paul_idle', x: 84, h: 62}], 'n20_opt_allein')
    ], 'n19_was', 'r19_was');
    if (i === 2){
      /* уйти одной: грустит в углу */
      await emily.walkTo(0.04, 900); emily.set('crouch'); T.tears(emily, true); await sleep(900);
      await play('n20_frag'); T.tears(emily, false); emily.set('idle'); await emily.walkTo(0.3, 900);
      continue;
    }
    if (i === 1){ emily.set('wave'); await heike.walkTo(0.42, 900); await heike.say('s20_alle'); emily.set('idle'); await heike.walkTo(0.12, 700); }
    break;
  }
  await emily.walkTo(RUG - 0.22, 600);
  await T.repeat('e20_spielt_ihr');
  isabel.face(false); paul.face(false);
  isabel.set('jump'); await isabel.say('i20_klar'); isabel.set('idle');
  paul.set('wave'); await paul.say('p20_bestimmt'); paul.set('idle');
  leon.set('sad'); await T.bone(isabel);

  /* 5. Эмили зовёт всех, башня вчетвером */
  await leon.walkTo(RUG + 0.26, 500); leon.face(true);
  await T.repeat('e20_alle');
  leon.set('shy'); await leon.say('l20_okay'); leon.set('idle');
  await play('n20_turm');
  const kids = [emily, isabel, paul, leon];
  for (let k = 0; k < 4; k++){
    await T.tap([pile], 'n20_turm', 'r_tipp_licht');
    kids[k].set('jump'); kids[k].hop(); await addBlock(k, kids[k]); kids[k].set('idle');
  }
  kids.forEach(h => h.set('jump')); sfx.fanfare(); await praise(); kids.forEach(h => h.set('idle'));
  await T.bone(leon);

  /* 6. мир: оба ответа правильные */
  leon.set('shy'); await leon.say('l20_spielst');
  const a = await T.choose([card([{svg: YES, x: 50, y: 12, w: 56, hh: 72}], 'n20_ja'), card([{svg: LATER, x: 50, y: 12, w: 56, hh: 72}], 'n20_nein')], 'n20_was_sagst', 'r20_sagst');
  await T.repeat(a ? 'e20_nein' : 'e20_ja');
  if (a){ leon.set('idle'); await play('n20_lob_nein'); }
  else { leon.set('jump'); T.hearts(leon); await play('n20_lob_ja'); leon.set('idle'); }
  await T.bone(emily);
  heike.set('wave'); await play('n20_ende'); heike.set('idle');
}
T.start(IMG.leon_shy[0], setup);
setup();
</script>
