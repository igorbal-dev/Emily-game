/* фонарик в руке героя: div внутри героя, движется вместе с ним */
function hold(h, color, svg){
  h.el.querySelectorAll('.lant').forEach(e => e.remove()); if (!color && !svg) return null;
  const d = document.createElement('div'); d.className = 'lant';
  Object.assign(d.style, {position: 'absolute', left: '55%', top: '22%', width: '55%', height: '62%', zIndex: 2, pointerEvents: 'none', transition: 'filter .4s'});
  d.innerHTML = svg || LANT(COL[color], false); d.dataset.color = color || ''; h.el.appendChild(d); h.lant = d; return d;
}
function light(h){ const d = h.lant; if (!d) return; d.innerHTML = LANT(COL[d.dataset.color], true); d.style.filter = 'drop-shadow(0 0 10px #ffe680) drop-shadow(0 0 22px #ffb347)'; }
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = []; stars = []; wecks = [];
  T.place = 'kita';
  table = T.prop(TABLE, {x: 0.47, py: () => L.floorY - L.hE*0.02, w: 1.1, ratio: 70/200, z: 35});
  ['rot', 'gelb', 'blau', 'gruen'].forEach((c, i) => { tl[c] = T.prop(LANT_T(COL[c]), {x: 0.33 + i*0.09, py: () => L.floorY - L.hE*0.37, w: 0.2, ratio: 50/40, z: 36}); });
  moon = T.prop(MOON, {x: 0.86, y: 0.2, w: 0.42, z: 10}); moon.el.hidden = true;
  [[0.6, 0.12], [0.7, 0.28], [0.32, 0.16]].forEach(([x, y]) => { const s = T.prop(STAR, {x, y, w: 0.16, z: 10}); s.el.hidden = true; stars.push(s); });
  [0.42, 0.58].forEach(x => { const w = T.prop(WECK(), {x, py: () => L.floorY - L.hE*0.37, w: 0.3, ratio: 100/80, z: 36}); w.el.hidden = true; wecks.push(w); });
  heike = T.hero('sommer', {x: 0.1, h: 1.45, poses: ['idle', 'blink', 'talk', 'wave']});
  isabel = T.hero('isabel', {x: 0.8, h: 0.95, poses: KP});
  paul = T.hero('paul', {x: 0.68, h: 0.97, poses: KP});
  abiha = T.hero('abiha', {x: 1.2, outfit: 'out', poses: AP});
  emily = T.hero('emily', {x: 0.22, outfit: 'shoes', poses: EP});
}
/* своя мелодия шествия: тихие колокольчики (не настоящая песня) */
let tune = false;
async function chimes(){ tune = true; const notes = [523, 587, 659, 784, 659, 587, 523, 440, 523, 659, 784, 880, 784, 659]; let i = 0;
  while (tune){ sfx.tone(notes[i % notes.length], notes[i % notes.length], 380, 'sine', .07); i++; await sleep(420); } }
const count = async i => { showNum(i); await emily.say('e_' + i); };

async function story(){
  /* 1. мастерим фонарики, выбираем цвет */
  await play('n24_intro');
  heike.set('talk'); await heike.say('s24_basteln'); heike.set('idle');
  await play('n24_tipp_farbe');
  const el = await T.tap(Object.values(tl), 'n24_tipp_farbe', 'r24_tipp_farbe');
  const mine = Object.keys(tl).find(c => tl[c].el === el);
  await T.repeat('e24_' + mine);
  heike.set('wave'); await heike.say('s24_bitte'); heike.set('idle');
  tl[mine].el.hidden = true; hold(emily, mine); emily.set('jump'); emily.hop(); sfx.ding(); await sleep(500); emily.set('idle');
  await T.bone(emily);
  const rest = Object.keys(tl).filter(c => c !== mine);
  tl[rest[0]].el.hidden = true; hold(isabel, rest[0]); isabel.set('jump'); isabel.hop(); await sleep(400); isabel.set('idle');

  /* Пауль хватает фонарик Эмили: шаг 1 вежливо, шаг 2 твёрдо */
  await paul.walkTo(0.36, 900); hold(emily, null); hold(paul, mine); sfx.whoosh(); paul.set('talk');
  await paul.say('p24_schoen'); await paul.walkTo(0.55, 600); paul.face(true); paul.set('idle');
  emily.set('surprised'); await play('n24_paul'); emily.set('idle');
  await T.repeat('e24_zurueck');
  paul.set('talk'); await paul.say('p24_nein'); paul.set('idle'); paul.hop();
  await play('n24_fester');
  await T.firm('e24_meins', {who: paul, step: 2});
  paul.set('talk'); await paul.say('p24_okay'); paul.set('idle');
  await paul.walkTo(0.4, 500); hold(paul, null); hold(emily, mine); sfx.pop(); await paul.walkTo(0.6, 500); paul.face(true);
  await play('n24_geklappt'); emily.set('jump'); emily.hop(); await sleep(400); emily.set('idle');
  await T.bone(emily);

  /* фонарик Пауля порвался — посмеяться или взять с собой? */
  hold(paul, null, TORN); T.tears(paul, true);
  await paul.say('p24_kaputt');
  const cards = () => [
    {parts: [{img: 'emily_laugh', x: 30, h: 70}, {img: 'paul_idle', x: 70, h: 66}, {fx: 'tears', x: 69, y: 34}], clip: 'n24_opt_lachen', bg: '#fff8e8', ground: '#c98f55'},
    {parts: [{img: 'emily_wave_shoes', x: 34, h: 70}, {img: 'paul_jump', x: 68, h: 66}, {fx: 'hearts', x: 48, y: 18}], clip: 'n24_opt_zusammen', bg: '#fff8e8', ground: '#c98f55'}];
  while ((await T.choose(cards(), 'n19_was', 'r19_was')) === 0) await play('n24_lachen_nein');
  await emily.walkTo(0.48, 600);
  await T.repeat('e24_zusammen');
  T.tears(paul, false); paul.set('jump'); paul.hop();
  heike.set('talk'); await heike.walkTo(0.74, 900); hold(paul, rest[1]); tl[rest[1]].el.hidden = true; await heike.say('s24_neue'); heike.set('idle');
  paul.set('talk'); await paul.say('p24_danke'); paul.set('idle');
  await T.repeat('e24_freunde');
  paul.set('jump'); paul.hop(); await paul.say('p24_freunde'); T.hearts(paul); T.hearts(emily); paul.set('idle');
  await T.bone(paul);

  /* 2. вечер во дворе: зажигаем фонарики */
  await play('n24_draussen');
  await T.go('night', () => { table.el.hidden = true; Object.values(tl).forEach(t => t.el.hidden = true); moon.el.hidden = false;
    emily.dress('out'); heike.x = 0.1; emily.x = 0.3; abiha.x = 0.46; isabel.x = 0.62; paul.x = 0.78;
    hold(abiha, rest[2]); hold(heike, 'gelb'); heike.lant.style.top = '30%'; });
  heike.set('talk'); await heike.say('s24_an'); heike.set('idle');
  await play('n24_zaehl');
  let left = [heike, emily, abiha, isabel, paul];
  for (let i = 1; i <= 5; i++){
    const el = await T.tap(left, 'n24_zaehl', 'r_tipp_licht'); const h = left.find(x => x.el === el); left = left.filter(x => x !== h);
    light(h); sfx.clink(); await count(i);
  }
  hideNum(); await play('n24_fuenf'); await T.bone(emily);

  /* шествие и стишок */
  chimes();
  await Promise.all([heike, emily, abiha, isabel, paul].map(h => h.walkTo(h.x + 0.04, 1800)));
  heike.set('talk'); await heike.say('s24_lied'); heike.set('idle');
  await T.repeat('e24_laterne');
  await Promise.all([heike, emily, abiha, isabel, paul].map(h => h.walkTo(h.x - 0.04, 1800)));
  tune = false;
  abiha.set('wave'); await abiha.say('b24_mond'); abiha.set('idle');
  await play('n24_mond');
  await T.tap([moon], 'n24_mond', 'r24_mond'); sfx.ding(); moon.el.animate([{transform: 'scale(1)'}, {transform: 'scale(1.15)'}, {transform: 'scale(1)'}], {duration: 600});
  stars.forEach(s => s.el.hidden = false);
  await play('n24_sterne');
  let sl = [...stars];
  for (let i = 1; i <= 3; i++){
    const el = await T.tap(sl, 'n24_sterne', 'r_tipp_licht'); const s = sl.find(x => x.el === el); sl = sl.filter(x => x !== s);
    s.el.animate([{transform: 'scale(1) rotate(0)'}, {transform: 'scale(1.4) rotate(30deg)'}, {transform: 'scale(1) rotate(0)'}], {duration: 500}); await count(i);
  }
  hideNum(); await play('n24_drei'); await T.bone(moon);

  /* 3. Weckmann: две булочки на четверых — пополам */
  wecks.forEach((w, i) => { w.o.py = () => L.floorY - L.hE*1.1; w.o.x = 0.4 + i*0.2; w.o.w = 0.42; w.place(); w.el.hidden = false; });
  heike.set('talk'); await heike.say('s24_weckmann'); heike.set('idle');
  await play('n24_wie');
  await T.repeat('e24_teilen');
  await play('n24_tipp_teilen');
  const halves = [];
  for (let k = 0; k < 2; k++){
    const el = await T.tap(wecks.filter(w => !w.el.hidden), 'n24_tipp_teilen', 'r24_tipp_teilen'); const w = wecks.find(x => x.el === el);
    w.el.hidden = true; sfx.pop();
    for (const side of ['L', 'R']){ const h = T.prop(WECK(side), {x: w.o.x + (side === 'L' ? -0.04 : 0.04), py: w.o.py, w: 0.42, ratio: 100/80, z: 55}); halves.push(h); }
    await sleep(300);
  }
  await play('n24_haelften');
  const kids = [emily, abiha, isabel, paul];
  for (let i = 0; i < 4; i++){
    const el = await T.tap(halves.filter(h => !h.done), 'n24_haelften', 'r_tipp_licht'); const h = halves.find(x => x.el === el); h.done = true;
    h.o.py = null; h.o.w = 0.3; await T.move(h, kids[i].x + 0.04, (L.floorY - L.hE*0.3)/L.H, 500); await count(i + 1);
  }
  hideNum(); await play('n24_vier');
  abiha.set('laugh'); await abiha.say('b24_lecker'); abiha.set('idle');
  isabel.set('talk'); await isabel.say('i24_danke'); isabel.set('idle');
  T.hearts(emily); await T.bone(emily);
  [emily, abiha, isabel, paul].forEach(h => h.set('jump')); await play('n24_ende');
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
}
T.start(IMG.paul_wave[0], setup);
setup();
</script>
<script src="js/screen.js"></script>
<script src="js/common.js"></script>
