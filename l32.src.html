<script>
const IMG = __IMG__;  /*IMG: emily_{idle,blink,mouth1,mouth2,talk,wave,jump,surprised}_shoes paul_{idle,blink,talk,wave,jump}*/
const SND = __SND__;  /*SND: e_{1..3} a_super a_toll a_prima a_juhu a_wunderbar a_nach r_like_emily a_final r_tipp_licht*/
/* тексты фраз; записи — art/voice_new.json (голоса: n — ведущая, r — русская подсказка, e — Эмили, p — Пауль) */
const SAY = {
  n32_intro: 'In der Kita. Paul und Emily spielen: Ich sehe was, was du nicht siehst.',
  p32_rot: 'Ich sehe was, was du nicht siehst, und das ist rot!',
  n32_rate: 'Was ist rot? Tipp auf eine rote Sache!',
  r32_rate: 'Что здесь красное? Нажми на красную вещь!',
  n32_nicht_rot: 'Das ist nicht rot. Schau genau!',
  e32_ball: 'Ist es der Ball?',
  e32_apfel: 'Ist es der Apfel?',
  p32_nein: 'Nein!',
  p32_stuhl: 'Nein! Es ist der Stuhl!',
  e32_nicht_rot: 'Paul, der Stuhl ist nicht rot. Das gilt nicht!',
  p32_doch: 'Doch! Der Stuhl!',
  n24_fester: 'Das hat nicht geklappt. Sag es noch einmal, mit fester Stimme!',
  e32_geschummelt: 'Nein! Du hast geschummelt. Der Stuhl ist blau.',
  p32_apfel: 'Okay … es war der Apfel. Entschuldigung.',
  n32_zaehl_rot: 'Wie viele rote Sachen gibt es? Tipp und zähl!',
  n32_zwei: 'Zwei rote Sachen: der Ball und der Apfel!',
  n32_dein: 'Jetzt bist du dran, Emily! Such dir etwas Gelbes oder Grünes aus. Tipp darauf!',
  r32_dein: 'Выбери жёлтую или зелёную вещь и нажми на неё!',
  n32_nur: 'Nimm etwas Gelbes oder Grünes!',
  e32_gelb: 'Ich sehe was, was du nicht siehst, und das ist gelb!',
  e32_gruen: 'Ich sehe was, was du nicht siehst, und das ist grün!',
  p32_ente: 'Ist es die Ente?',
  p32_banane: 'Ist es die Banane?',
  p32_frosch: 'Ist es der Frosch?',
  p32_blatt: 'Ist es das Blatt?',
  e32_nein: 'Nein, das ist es nicht.',
  e32_ja: 'Ja, richtig! Jetzt bist du dran.',
  p32_juhu: 'Juhu! Das war lustig!',
  n32_ende: 'Super! Emily hat gemerkt, dass Paul geschummelt hat. Und sie hat es laut gesagt.',
  n_lauter: 'Lauter! Sag es mit fester Stimme!',
  r_lauter: 'Громче! Скажи твёрдо и громко!'
};

<script>
/* Уровень 32: «Ich sehe was, was du nicht siehst». Вещи в группе: красные — мяч и яблоко, синие — стул и машинка, жёлтые — утка и банан, зелёные — лягушка и лист.
   Пауль загадывает красное: Эмили нажимает на красную вещь и спрашивает «Ist es der Ball?» — «Nein!»; «Ist es der Apfel?» — Пауль жульничает «Nein! Es ist der Stuhl!».
   Шаг 1 «Paul, der Stuhl ist nicht rot. Das gilt nicht!» — «Doch!» — шаг 2 «Nein! Du hast geschummelt. Der Stuhl ist blau.» — признаётся. Считаем красные вещи (2).
   Эмили загадывает сама: выбирает жёлтую или зелёную вещь, говорит фразу с цветом, Пауль сначала ошибается («Nein, das ist es nicht.»), потом угадывает. */
const LEVEL = 32, FRIENDS = ['paul'];
const STICKER = '<svg viewBox="0 0 100 100"><circle cx="42" cy="42" r="26" fill="#cfe9ff" stroke="#2f80ed" stroke-width="7"/><path d="M62 62 L86 86" stroke="#2f80ed" stroke-width="10" stroke-linecap="round"/><circle cx="34" cy="38" r="7" fill="#ff5a4a"/><circle cx="50" cy="48" r="6" fill="#ffd34d"/></svg>';
const RUG = 0.5;
function drawScene(g, W, H, L){ drawKita(g, W, H, L, RUG);
  /* убираем нарисованные игрушки с полки — на полке лежат только вещи игры (их можно нажать) */
  const sx = W*0.86, fy = L.floorY, hE = L.hE; g.fillStyle = '#fff1c9'; g.fillRect(sx - hE*0.4, fy - hE*1.4, hE*0.8, hE*0.3); g.fillRect(sx - hE*0.4, fy - hE*1.03, hE*0.8, hE*0.33);
  g.fillStyle = '#ffe2a0'; g.fillRect(sx - hE*0.4, fy - hE*0.55, hE*0.8, 0); }
const ITEMS = {
  ball: {c: 'rot', x: 0.36, up: 0, w: 0.24, svg: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#ff5a4a" stroke="#c43a2e" stroke-width="5"/><path d="M8 44 Q50 62 92 44" fill="none" stroke="#fff" stroke-width="7"/></svg>'},
  apfel: {c: 'rot', x: 0.82, up: 0.66, w: 0.2, svg: '<svg viewBox="0 0 100 100"><path d="M50 30 C20 18 10 50 22 72 C32 92 46 86 50 82 C54 86 68 92 78 72 C90 50 80 18 50 30 Z" fill="#ff5a4a" stroke="#c43a2e" stroke-width="4"/><path d="M50 30 Q52 16 60 10" stroke="#8a5a1e" stroke-width="5" fill="none"/></svg>'},
  stuhl: {c: 'blau', x: 0.16, up: 0, w: 0.34, ratio: 1.3, svg: '<svg viewBox="0 0 100 130"><rect x="14" y="4" width="72" height="56" rx="10" fill="#4a8ff0" stroke="#2a5fb0" stroke-width="5"/><rect x="8" y="62" width="84" height="16" rx="6" fill="#4a8ff0" stroke="#2a5fb0" stroke-width="5"/><path d="M16 78 V126 M84 78 V126" stroke="#2a5fb0" stroke-width="8" stroke-linecap="round"/></svg>'},
  auto: {c: 'blau', x: 0.91, up: 0.66, w: 0.22, svg: '<svg viewBox="0 0 100 100"><path d="M8 70 V54 Q10 44 22 44 L32 30 H64 L76 44 Q92 46 92 58 V70 Z" fill="#4a8ff0" stroke="#2a5fb0" stroke-width="4" stroke-linejoin="round"/><circle cx="28" cy="72" r="10" fill="#333"/><circle cx="72" cy="72" r="10" fill="#333"/></svg>'},
  ente: {c: 'gelb', x: 0.56, up: 0, w: 0.24, svg: '<svg viewBox="0 0 100 100"><ellipse cx="54" cy="66" rx="38" ry="24" fill="#ffd34d" stroke="#d6a21e" stroke-width="4"/><circle cx="34" cy="36" r="18" fill="#ffd34d" stroke="#d6a21e" stroke-width="4"/><path d="M14 38 L2 42 L14 46 Z" fill="#ff7a59"/><circle cx="30" cy="32" r="3" fill="#333"/></svg>'},
  banane: {c: 'gelb', x: 0.82, up: 1.05, w: 0.22, svg: '<svg viewBox="0 0 100 100"><path d="M14 30 Q30 86 88 70 Q90 62 82 62 Q40 70 26 26 Z" fill="#ffd34d" stroke="#d6a21e" stroke-width="4" stroke-linejoin="round"/></svg>'},
  frosch: {c: 'gruen', x: 0.68, up: 0, w: 0.24, svg: '<svg viewBox="0 0 100 100"><ellipse cx="50" cy="66" rx="40" ry="26" fill="#3cc36a" stroke="#24924a" stroke-width="4"/><circle cx="32" cy="36" r="14" fill="#3cc36a" stroke="#24924a" stroke-width="4"/><circle cx="68" cy="36" r="14" fill="#3cc36a" stroke="#24924a" stroke-width="4"/><circle cx="32" cy="36" r="5" fill="#333"/><circle cx="68" cy="36" r="5" fill="#333"/><path d="M34 72 Q50 82 66 72" fill="none" stroke="#24924a" stroke-width="4"/></svg>'},
  blatt: {c: 'gruen', x: 0.91, up: 1.05, w: 0.2, svg: '<svg viewBox="0 0 100 100"><path d="M50 8 Q90 40 50 92 Q10 40 50 8 Z" fill="#3cc36a" stroke="#24924a" stroke-width="4"/><path d="M50 18 V86" stroke="#24924a" stroke-width="3"/></svg>'}
};
let emily, paul, it = {};
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'surprised'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = []; it = {};
  for (const [k, o] of Object.entries(ITEMS)) it[k] = T.prop(o.svg, {x: o.x, py: () => L.floorY - L.hE*o.up - L.hE*0.02, w: o.w, ratio: o.ratio || 1, z: 35});
  emily = T.hero('emily', {x: 0.28, outfit: 'shoes', poses: EP});
  paul = T.hero('paul', {x: 0.46, h: 0.97, poses: KP}); paul.face(true);
}
const glowIt = k => it[k].el.animate([{filter: 'none'}, {filter: 'drop-shadow(0 0 10px #fff36b) drop-shadow(0 0 18px #ffd84d)'}, {filter: 'none'}], {duration: 1200});
/* ждём нажатия на вещь из списка ok; другие вещи — мягкое «нет» */
async function pickItem(ok, de, ru, wrong){
  while (true){ const el = await T.tap(Object.values(it), de, ru); const k = Object.keys(it).find(x => it[x].el === el);
    if (ok.includes(k)) return k; el.classList.add('shake'); sfx.bonk(); await play(wrong); }
}

async function story(){
  await play('n32_intro');
  /* загадывает Пауль: красное */
  paul.set('talk'); await paul.say('p32_rot'); paul.set('idle');
  await play('n32_rate');
  const first = await pickItem(['ball', 'apfel'], 'n32_rate', 'r32_rate', 'n32_nicht_rot');
  const second = first === 'ball' ? 'apfel' : 'ball';
  glowIt(first); await T.repeat('e32_' + first);
  if (first === 'ball'){ paul.set('talk'); await paul.say('p32_nein'); paul.set('idle');
    await play('n32_rate'); await pickItem(['apfel'], 'n32_rate', 'r32_rate', 'n32_nicht_rot'); glowIt('apfel'); await T.repeat('e32_apfel'); }
  /* Пауль жульничает */
  paul.set('jump'); paul.hop(); await paul.say('p32_stuhl'); paul.set('idle'); glowIt('stuhl');
  emily.set('surprised'); await sleep(400); emily.set('idle');
  await T.repeat('e32_nicht_rot');
  paul.set('talk'); await paul.say('p32_doch'); paul.set('idle');
  await play('n24_fester');
  await T.firm('e32_geschummelt', {who: paul, step: 2});
  paul.set('talk'); await paul.say('p32_apfel'); paul.set('idle'); glowIt('apfel');
  await T.bone(emily);
  /* сколько красных вещей */
  await play('n32_zaehl_rot');
  let left = ['ball', 'apfel'];
  for (let i = 1; i <= 2; i++){ const k = await pickItem(left, 'n32_zaehl_rot', 'r_tipp_licht', 'n32_nicht_rot'); left = left.filter(x => x !== k); glowIt(k); showNum(i); await emily.say('e_' + i); }
  hideNum(); await play('n32_zwei'); await T.bone(it.ball);

  /* загадывает Эмили */
  await play('n32_dein');
  const mine = await pickItem(['ente', 'banane', 'frosch', 'blatt'], 'n32_dein', 'r32_dein', 'n32_nur');
  glowIt(mine); const col = ITEMS[mine].c;
  await T.repeat('e32_' + col);
  const other = Object.keys(ITEMS).find(k => k !== mine && ITEMS[k].c === col);
  paul.set('talk'); glowIt(other); await paul.say('p32_' + other); paul.set('idle');
  await T.repeat('e32_nein');
  paul.set('talk'); glowIt(mine); await paul.say('p32_' + mine); paul.set('idle');
  await T.repeat('e32_ja');
  paul.set('jump'); paul.hop(); await paul.say('p32_juhu'); paul.set('idle'); T.hearts(paul);
  await T.bone(emily);
  emily.set('jump'); paul.set('jump'); await play('n32_ende'); emily.set('idle'); paul.set('idle');
}
T.start(IMG.paul_talk[0], setup);
setup();
</script>
