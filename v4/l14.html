    g.strokeStyle = 'rgba(120,70,30,.3)'; g.lineWidth = 2; for (let x = 0; x < W; x += hE*0.4){ g.beginPath(); g.moveTo(x, fy - hE*0.06); g.lineTo(x - hE*0.2, H); g.stroke(); }

      /* окно, кровать, полка, коврик */

      g.fillStyle = '#e9d2b0'; g.fillRect(W*0.86, fy - hE*1.55, hE*0.7, hE*1.5); g.strokeStyle = '#b98a55'; g.strokeRect(W*0.86, fy - hE*1.55, hE*0.7, hE*1.5);
    }
    return;
  }
  /* улица: дом, дверь, звонок */
  let gr = g.createLinearGradient(0, 0, 0, fy); gr.addColorStop(0, '#f6d7b0'); gr.addColorStop(1, '#efc796'); g.fillStyle = gr; g.fillRect(0, 0, W, fy);
  g.fillStyle = 'rgba(255,255,255,.35)'; for (let y = hE*0.2; y < fy - hE*0.2; y += hE*0.4) g.fillRect(0, y, W, 2);
  for (const wx of [0.06, 0.82]){ g.fillStyle = '#9fd4f2'; g.fillRect(W*wx, fy - hE*1.45, hE*0.6, hE*0.75); g.strokeStyle = '#fff'; g.lineWidth = hE*0.05; g.strokeRect(W*wx, fy - hE*1.45, hE*0.6, hE*0.75);
    g.fillStyle = '#ff7a59'; for (let i = 0; i < 4; i++){ g.beginPath(); g.arc(W*wx + hE*(0.1 + i*0.13), fy - hE*0.66, hE*0.05, 0, 7); g.fill(); } }
  const dx = W*0.6, dw = hE*0.8, dh = hE*1.65;

  if (doorOpen){ g.fillStyle = '#fbeed6'; g.fillRect(dx - dw/2, fy - dh, dw, dh); g.fillStyle = '#2f6b3a'; g.beginPath(); g.moveTo(dx - dw/2, fy - dh); g.lineTo(dx - dw/2 - dw*0.32, fy - dh - hE*0.04); g.lineTo(dx - dw/2 - dw*0.32, fy + hE*0.02); g.lineTo(dx - dw/2, fy); g.closePath(); g.fill(); }
  else { g.fillStyle = '#2f6b3a'; g.fillRect(dx - dw/2, fy - dh, dw, dh); g.strokeStyle = '#255a30'; g.lineWidth = hE*0.025;
    g.strokeRect(dx - dw/2 + dw*0.12, fy - dh + dh*0.08, dw*0.76, dh*0.36); g.strokeRect(dx - dw/2 + dw*0.12, fy - dh + dh*0.52, dw*0.76, dh*0.4);
    g.fillStyle = '#ffd34d'; g.beginPath(); g.arc(dx + dw*0.36, fy - dh*0.48, hE*0.035, 0, 7); g.fill(); }
  g.fillStyle = '#b7b7b7'; g.fillRect(0, fy - hE*0.04, W, H - fy + hE*0.04); g.fillStyle = '#8b6b4a'; g.fillRect(dx - dw*0.6, fy - hE*0.04, dw*1.2, hE*0.06);
}

function clear(){ stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = []; }
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'laugh', 'surprised', 'crouch', 'jacketoff', 'walk'];

  await becker.say('b14_trinken');
  await T.repeat('e14_wasser');
  glass = T.prop(GLASS, {x: 0.87, py: () => L.floorY - L.hE*0.75, w: 0.12, ratio: 1.4, z: 60}); sfx.pop();
  await becker.say('b14_bitte');
  await T.move(glass, emily.x + 0.05, 0, 900); glass.o.py = () => L.floorY - L.hE*0.5; glass.place();
  emily.set('jump'); await sleep(300); emily.set('idle');
  await T.repeat('e_danke');
  await T.bone(glass);
  glass.el.remove();

  /* туалет */
  await play('n14_klo');
  await T.repeat('e14_toilette');
  becker.set('wave'); await becker.say('b14_toilette'); becker.set('idle');
  await emily.walkTo(-0.15, 1200); await sleep(900); sfx.whoosh(); await sleep(700); await emily.walkTo(0.2, 1200);

  /* мама пришла: попрощаться */
  dingdong(); await sleep(1200);
  await becker.say('b14_mama');
  await T.repeat('e14_einladung');
  paul.set('wave'); await paul.say('p14_tschuess');
  becker.set('wave'); await becker.say('b14_tschuess');
  emily.set('wave'); await sleep(700);
  await T.bone(emily);
}
T.start(IMG.emily_wave_out[0], setup);
setup();
</script>
