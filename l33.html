const LEVEL = 33, FRIENDS = ['isabel', 'abiha'];
const STICKER = '<svg viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width="4"><rect x="34" y="70" width="30" height="22"/><rect x="34" y="48" width="30" height="22"/><rect x="19" y="26" width="30" height="22"/><rect x="49" y="26" width="30" height="22"/><path d="M34 26 Q49 2 64 26"/></g><rect x="0" y="0" width="100" height="100" fill="#9d9da8" style="mix-blend-mode:multiply" opacity="0"/><circle cx="49" cy="58" r="6" fill="#ff7a59"/><text x="42" y="88" font-size="16" font-family="Trebuchet MS,sans-serif" font-weight="800" fill="#ffd34d">1</text></svg>';
function drawScene(g, W, H, L){ drawYard(g, W, H, L); }
const SQ0 = 0.3, SQD = 0.075;                       /* клетки 1–8 в ряд по асфальту */
const SQX = i => SQ0 + (i - 1)*SQD;
const SQUARE = n => `<svg viewBox="0 0 100 60"><path d="M10 6 H90 L96 54 H4 Z" fill="rgba(255,255,255,.06)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><text x="50" y="42" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-weight="800" font-size="30" fill="#ffd34d">${n}</text></svg>`;
const HAND = {
  schere: '<svg viewBox="0 0 100 100"><path d="M40 92 Q30 70 34 56 L22 20 Q20 12 28 12 Q34 12 36 20 L48 50 L56 12 Q58 4 66 6 Q72 8 70 16 L62 56 Q72 66 64 86 Z" fill="#ffd7b5" stroke="#c9895a" stroke-width="4" stroke-linejoin="round"/></svg>',
  stein: '<svg viewBox="0 0 100 100"><path d="M22 54 Q20 30 40 28 Q50 22 60 28 Q80 28 80 50 Q82 78 56 84 Q30 86 22 54 Z" fill="#ffd7b5" stroke="#c9895a" stroke-width="4"/><path d="M38 40 Q44 50 38 58 M52 36 Q58 48 52 58 M66 40 Q70 50 66 58" fill="none" stroke="#c9895a" stroke-width="3"/></svg>',
  papier: '<svg viewBox="0 0 100 100"><path d="M30 92 Q22 70 24 50 L20 24 Q20 16 27 16 Q33 16 34 24 L38 44 L38 12 Q38 4 45 4 Q52 4 52 12 L52 42 L56 10 Q58 2 65 4 Q71 6 70 14 L66 44 L74 22 Q78 14 84 18 Q88 22 86 30 L74 66 Q70 84 56 92 Z" fill="#ffd7b5" stroke="#c9895a" stroke-width="4" stroke-linejoin="round"/></svg>'
};
const BEATS = {stein: 'schere', schere: 'papier', papier: 'stein'};      /* что побеждает что */
let emily, abiha, isabel, sq = [];
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'laugh', 'walk'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'walk', 'jump', 'laugh'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = []; sq = [];
  for (let i = 1; i <= 8; i++) sq.push(T.prop(SQUARE(i), {x: SQX(i), py: () => L.floorY + L.hE*0.1, w: 0.3, ratio: 0.6, z: 30}));
  abiha = T.hero('abiha', {x: 0.06, outfit: 'out', poses: AP});
  isabel = T.hero('isabel', {x: 0.14, h: 0.95, poses: KP});
  emily = T.hero('emily', {x: 0.22, outfit: 'out', poses: EP});
}
async function hopTo(h, i, ms = 380){ h.set('jump'); await h.walkTo(SQX(i), ms); h.set('idle'); sfx.pop(); }

async function story(){
  await play('n33_intro');
  abiha.set('wave'); await abiha.say('b33_wer'); abiha.set('idle');
  /* Schnick Schnack Schnuck */
  await T.repeat('e33_schnick');
  const ks = ['schere', 'stein', 'papier'];
  const i = await T.choose(ks.map(k => ({parts: [{svg: HAND[k], x: 50, y: 14, w: 62, hh: 70}], clip: 'n33_' + k, bg: '#fff7ec', ground: '#fff7ec'})), 'n33_hand', 'r33_hand');
  const mine = ks[i], hers = BEATS[mine];
  const show = T.prop(HAND[mine], {x: 0.34, y: 0.42, w: 0.3, z: 70}), show2 = T.prop(HAND[hers], {x: 0.5, y: 0.42, w: 0.3, z: 70});
  show2.el.style.transform = 'scaleX(-1)'; sfx.ding(); await sleep(1300); show.el.remove(); show2.el.remove();
  emily.set('jump'); emily.hop(); await play('n33_gewinnt'); emily.set('idle');
  await T.bone(emily);

  /* Изабель влезает без очереди: шаги 1–3 */
  isabel.set("jump"); await isabel.walkTo(SQX(1), 500); isabel.set("talk"); await isabel.say("i33_zuerst"); isabel.set("idle");
  emily.set('surprised'); await sleep(300); emily.set('idle');
  await T.repeat('e33_ich_dran');
  isabel.set('talk'); await isabel.say('i33_egal'); isabel.set('idle');
  await play('n24_fester');
  await T.firm('e33_hinten', {who: isabel, step: 2});
  isabel.set("jump"); await isabel.walkTo(SQX(1), 300); await isabel.say("i33_will"); isabel.set("idle");
  await play('n19_stopp_tipp');
  await T.firm('e33_stopp', {who: isabel, step: 3});
  isabel.set('talk'); await isabel.say('i33_okay'); isabel.set('idle');
  await isabel.walkTo(0.12, 700);
  await T.bone(emily);

  /* Эмили прыгает: нажимаем клетки по порядку; на 6-й — линия */
  await emily.walkTo(SQ0 - 0.06, 400);
  await play('n33_hupf');
  for (let n = 1; n <= 6; n++){
    await T.tap([sq[n - 1]], 'n33_hupf', 'r33_hupf');
    await hopTo(emily, n); showNum(n); await emily.say('e_' + n);
  }
  hideNum(); emily.el.classList.add('wobble'); emily.set('surprised'); await play('n33_linie'); emily.el.classList.remove('wobble');
  isabel.set('talk'); await isabel.say('i33_linie'); isabel.set('idle');
  await T.repeat('e33_stimmt');
  emily.set('walk'); await emily.walkTo(0.2, 900); emily.set('idle');
  await T.bone(emily);

  /* прыгает Изабель — считаем */
  await play('n33_zaehl');
  await isabel.walkTo(SQ0 - 0.06, 400);
  for (let n = 1; n <= 8; n++){ await hopTo(isabel, n, 450); showNum(n); await emily.say('e_' + n); }
  hideNum(); isabel.set('jump'); isabel.hop(); await sleep(400);
  await isabel.walkTo(0.3, 800); isabel.face(true);
  isabel.set('talk'); await isabel.say('i33_danke'); isabel.set('idle'); T.hearts(isabel);
  await T.bone(isabel);
  abiha.set('wave'); await abiha.say('b33_mit'); abiha.set('idle');
  await T.repeat('e33_klar');
  abiha.set('jump'); abiha.hop(); T.hearts(abiha); await sleep(500); abiha.set('idle');
  [emily, abiha, isabel].forEach(h => h.set('jump')); await play('n33_ende');
  [emily, abiha, isabel].forEach(h => h.set('idle'));
}
T.start(IMG.isabel_jump[0], setup);
setup();
</script>
