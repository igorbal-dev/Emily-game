const SND = {"a_emily_1": "assets/snd/2bf100470f10.mp3", "a_emily_2": "assets/snd/627b01c3792c.mp3", "a_emily_3": "assets/snd/8c3ee0824e95.mp3", "a_isabel_1": "assets/snd/77a26e0ce9f8.mp3", "a_isabel_2": "assets/snd/149e885a4b2b.mp3", "a_isabel_3": "assets/snd/405deb434301.mp3", "a_juhu": "assets/snd/ab65e31fd892.mp3", "a_knochen": "assets/snd/5f0da8849dae.mp3", "a_nach": "assets/snd/ca5aa096bdb0.mp3", "a_paul_1": "assets/snd/9fd96975a571.mp3", "a_paul_2": "assets/snd/76b7bb356a76.mp3", "a_paul_3": "assets/snd/0aa7a931e0d8.mp3", "a_pfuetzen": "assets/snd/7c0c5aea93b7.mp3", "a_prima": "assets/snd/4beb6b79b97f.mp3", "a_rennen": "assets/snd/7cf3760134fc.mp3", "a_super": "assets/snd/fe00647daef4.mp3", "a_theo_weg": "assets/snd/ba95d5c1fbcd.mp3", "a_toll": "assets/snd/288f2e5a7bca.mp3", "a_wunderbar": "assets/snd/2a1e6fe05fd4.mp3", "a_ziel": "assets/snd/fb3438246e20.mp3", "c_321": "assets/snd/5f85f3bb8f18.mp3", "e_1": "assets/snd/47c925770470.mp3", "e_10": "assets/snd/46a8ffbe7b43.mp3", "e_2": "assets/snd/918ef9b62ef0.mp3", "e_3": "assets/snd/510e7125b84e.mp3", "e_4": "assets/snd/eedc12bfb218.mp3", "e_5": "assets/snd/61057bf82030.mp3", "e_6": "assets/snd/f1d18f32c4f6.mp3", "e_7": "assets/snd/ce569c9a5108.mp3", "e_8": "assets/snd/ee98e8bfbe63.mp3", "e_9": "assets/snd/742279368294.mp3", "e_dritte": "assets/snd/9512e5374244.mp3", "e_erste": "assets/snd/0db32cd1d73c.mp3", "e_hoppla": "assets/snd/fb93c5dce703.mp3", "e_theo_komm": "assets/snd/bf448a25d78d.mp3", "e_zweite": "assets/snd/db747a17d379.mp3", "i_warte": "assets/snd/5e1e0fff85cc.mp3", "k_laugh": "assets/snd/403616bb79cf.mp3", "k_warte": "assets/snd/7d9458859d51.mp3", "p_schneller": "assets/snd/641f2d03ab04.mp3", "r_like_emily": "assets/snd/9f24a0a81f00.mp3", "r_rennen": "assets/snd/e5c373f64bed.mp3", "r_theo": "assets/snd/e789ebfbe08c.mp3", "t_barks": "assets/snd/0b964a7cf853.mp3", "t_sniff": "assets/snd/1f8f12a132c4.mp3"};
const TEXT = {};
const BONE_SVG = '<svg viewBox="0 0 100 44" aria-hidden="true"><path d="M22 10a10 10 0 1 0-9 15a10 10 0 1 0 9 15h56a10 10 0 1 0 9-15a10 10 0 1 0-9-15z" fill="#fff7e6" stroke="#c9a77a" stroke-width="4" stroke-linejoin="round"/></svg>';
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#cv'), g = cv.getContext('2d');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let W = 0, H = 0, DPR = 1;

/* ---------- картинки ---------- */
const PIC = {};
for (const [k, [src, w, h]] of Object.entries(IMG)){ const im = new Image(); im.src = src; PIC[k] = {im, w, h}; }
const BONE_PATH = new Path2D('M22 10a10 10 0 1 0-9 15a10 10 0 1 0 9 15h56a10 10 0 1 0 9-15a10 10 0 1 0-9-15z');

/* ---------- звуки (как на уровнях) ---------- */
let actx = null;
const sfx = {
  tone(f1, f2, ms, type='sine', vol=.18){
    if (!actx) return; const t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t+ms/1000);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t+ms/1000);
    o.connect(gn).connect(actx.destination); o.start(t); o.stop(t+ms/1000+.02);
  },
  pop(){ this.tone(500, 900, 120, 'triangle', .22); },
  ding(){ this.tone(880, 1320, 200, 'triangle', .2); setTimeout(() => this.tone(1320, 1760, 240, 'triangle', .16), 110); },
  bonk(){ this.tone(180, 110, 220, 'triangle', .22); },
  splash(){ if (!actx) return; const t = actx.currentTime, n = actx.sampleRate*0.45, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/n, 2);
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), gn = actx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .8;
    gn.gain.value = .35; s.connect(f).connect(gn).connect(actx.destination); s.start(t); },
  bell(){ this.tone(1568, 1560, 500, 'sine', .14); setTimeout(() => this.tone(1568, 1560, 400, 'sine', .1), 160); },
  fanfare(){ [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, f, 260, 'triangle', .18), i*140)); }
};
const BUF = {};
let speaking = 0;
function decode(ab){ return new Promise((res, rej) => { const p = actx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }); }
async function loadSounds(){ await Promise.all(Object.entries(SND).map(async ([k, uri]) => { try { BUF[k] = await decode(await (await fetch(uri)).arrayBuffer()); } catch(e){} })); }
async function play(name){
  speaking++;
  try {
    const b = BUF[name];
    if (actx && b){
      if (actx.state !== 'running') actx.resume();
      await new Promise(resolve => {
        const s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination);
        let done = false; const fin = () => { if (!done){ done = true; resolve(); } };
        s.onended = fin; setTimeout(fin, b.duration*1000 + 400); s.start();
      });
    } else await sleep(300);
  } finally { speaking--; }
}
const PRAISE = ['a_super','a_toll','a_prima','a_juhu','a_wunderbar'];
function praise(){ return play(pick(PRAISE)); }

/* ---------- микрофон (общий код в js/common.js делает его мягким) ---------- */
let mic = null;
const micBtn = $('#mic'), levelRing = $('#level');
let micTapResolve = null;
micBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (micTapResolve) micTapResolve(true); });
async function setupMic(){
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    const src = actx.createMediaStreamSource(stream), an = actx.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    mic = {analyser:an, buf:new Float32Array(an.fftSize)};
  } catch(e){ mic = null; }
}
function listen(ms=6000){   /* заменяется в js/common.js */
  return new Promise(resolve => { micBtn.hidden = false; micBtn.classList.add('on');
    micTapResolve = ok => { micTapResolve = null; micBtn.classList.remove('on'); micBtn.hidden = true; resolve(ok); };
    setTimeout(() => micTapResolve && micTapResolve(false), ms); });
}
/* мультяшная Эмили говорит образец, настоящая повторяет (как на уровнях, но мягче: не больше трёх раз) */
async function repeatAfter(model){
  for (let i = 0; i < 3; i++){
    if (i === 1) await play('a_nach');
    if (i === 2) await play('r_like_emily');
    talk(R.emily, play(model)); await waitTalk(R.emily);
    await sleep(120);
    if (await listen()) return true;
  }
  return false;
}

/* ---------- раскладка ---------- */
let L = {};
function layout(){
  W = stage.clientWidth; H = stage.clientHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  /* вертикальный экран: дорога почти во всю ширину, дети вверху и едут на нас, трасса впереди — ниже них */
  const roadW = Math.min(W*0.8, H*0.62), laneW = roadW/3;
  L = {cx: W/2, roadW, laneW, baseY: H*0.31, riderH: Math.min(H*0.2, laneW*1.55)};
  $('#rotate').hidden = !(W > H && H < 600);   /* телефон боком — просим повернуть вертикально */
}
const laneX = i => L.cx + (i - 1)*L.laneW;
/* расстояние по дороге меряется в высотах экрана: d больше — дальше по дороге, ниже на экране */
const scrY = d => L.baseY + (d - R.emily.d)*H;

for (const r of Object.values(R)){ r.talking = false; r.talkP = null; r.flash = 0; r.bob = 0; }
function talk(r, p){ r.talking = true; r.talkP = p; p.finally(() => { if (r.talkP === p) r.talking = false; }); return p; }
function waitTalk(r){ return r.talkP || Promise.resolve(); }

/* ---------- состояние гонки ---------- */
const RACE_D = 14;            /* длина трассы в высотах экрана (~55 секунд) */
let S;
function resetRace(){
  S = {phase:'intro', t:0, v:0, slowUntil:0, hits:0, bones:0, bonesSpawned:0, items:[], drops:[], nextRow:0.9,

/* скорость: от медленной к чуть быстрой; после лужи или удара немного медленнее */
function speedAt(t){ return H > 0 ? 0.2 + 0.08*clamp(t/50, 0, 1) : 0; }

function spawnRow(atD){
  /* ряд: одна-две помехи, всегда остаётся свободная полоса; в свободной иногда косточка */
  const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
  const late = atD > 5, nObs = late && Math.random() < 0.35 ? 2 : 1;
  for (let i = 0; i < nObs; i++) S.items.push({type: Math.random() < 0.7 ? 'puddle' : 'cone', lane: lanes[i], d: atD + (i ? 0.12 : 0)});
  if (S.bonesSpawned < 10 && Math.random() < 0.75){ S.items.push({type:'bone', lane: lanes[2], d: atD + 0.04}); S.bonesSpawned++; }
}

/* ---------- управление: нажатие слева или справа ---------- */
function steer(dir){
  if (S.phase !== 'race' && S.phase !== 'finish') return;
  const e = R.emily, to = clamp(e.lane + dir, 0, 2); if (to === e.lane) return;
  /* в той полосе рядом соперник — толкаемся, без аварии: чуть медленнее, остаёмся в своей полосе */
  const block = RIVALS.find(r => r.lane === to && Math.abs(r.d - e.d) < 0.07);
  if (block){ sfx.bonk(); e.flash = S.t + 0.5; e.pose = 'leanL'; S.slowUntil = S.t + 0.8; e.x += dir*L.laneW*0.15; return; }
  e.lane = to; e.leanUntil = S.t + 0.35; e.leanDir = dir; sfx.pop();
  hint(false);
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button,a')) return;
  steer(e.clientX < W/2 ? -1 : 1);
});
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') steer(-1); if (e.key === 'ArrowRight') steer(1); });
function hint(on){ $('#sideL').classList.toggle('on', on); $('#sideR').classList.toggle('on', on); }

/* ---------- Тео: бежит рядом, иногда отвлекается ---------- */
const theoBtn = $('#theoBtn');
let theoCall = null;
theoBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (theoCall) theoCall('button'); });
async function theoRunsOff(first){
  const th = R.theo; th.mode = 'away'; th.awayT = S.t; sfx.tone(700, 1200, 180, 'sine', .1);
  await play('t_sniff');
  theoBtn.hidden = false; theoBtn.classList.add('tapme');
  await play('a_theo_weg');
  let how = null;
  for (let i = 0; i < 3 && !how; i++){
    if (i === 1 && first) await play('r_theo');
    if (i === 2) await play('a_theo_weg');

  await play('t_barks');
  if (how) praise();
}

/* ---------- рисование ---------- */
function rr(x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
function hash(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }
function drawWorld(){
  const {cx, roadW} = L, e = R.emily;
  /* трава */
  g.fillStyle = '#8fd16a'; g.fillRect(0, 0, W, H);
  const left = cx - roadW/2, right = cx + roadW/2;
  /* полоски травы движутся вместе с дорогой */
  const stripe = 0.25;
  for (let k = Math.floor((e.d - 0.3)/stripe); k*stripe < e.d + 1.1; k++){
    if (k % 2) continue; const y1 = scrY(k*stripe), y2 = scrY((k + 1)*stripe);
    g.fillStyle = '#86c962'; g.fillRect(0, y1, W, y2 - y1);
  }
  /* дорога и бордюры */
  g.fillStyle = '#f4e4c1'; g.fillRect(left - roadW*0.035, 0, roadW*1.07, H);
  g.fillStyle = '#9aa0a8'; g.fillRect(left, 0, roadW, H);
  g.fillStyle = 'rgba(255,255,255,.08)'; for (let i = 0; i < 3; i++) g.fillRect(left + L.laneW*i + L.laneW*0.1, 0, L.laneW*0.8, H);
  /* штриховая разметка */
  g.fillStyle = '#ffffff';
  const dash = 0.16;
  for (let k = Math.floor((e.d - 0.3)/dash); k*dash < e.d + 1.1; k++){
    if (k % 2) continue; const y = scrY(k*dash);
    for (const lx of [left + L.laneW, left + 2*L.laneW]) rr(lx - 3, y, 6, dash*H*0.9, 3), g.fill();
  }
  /* старт и финиш: клетчатая полоса */
  for (const [dd, big] of [[0, false], [RACE_D, true]]){
    const y = scrY(dd); if (y < -H*0.1 || y > H*1.7) continue;
    const n = 12, cw = roadW/n, ch = L.laneW*0.09;
    for (let r = 0; r < 2; r++) for (let i = 0; i < n; i++){ g.fillStyle = (i + r) % 2 ? '#222' : '#fff'; g.fillRect(left + i*cw, y + r*ch - ch, cw, ch); }
    if (big){   /* арка финиша: два столба и флажки */
      g.fillStyle = '#d65a3b'; const ph = L.riderH*1.5; g.fillRect(left - roadW*0.04, y - ph, roadW*0.025, ph); g.fillRect(right + roadW*0.015, y - ph, roadW*0.025, ph);
      const fy = y - ph*0.97; g.strokeStyle = '#7a4a22'; g.lineWidth = 2; g.beginPath(); g.moveTo(left - roadW*0.05, fy); g.quadraticCurveTo(cx, fy + L.laneW*0.5, right + roadW*0.05, fy); g.stroke();
      const cols = ['#ff7a59','#ffd84d','#5aa8f0','#32b67a','#ff8fb8'];
      for (let i = 0; i < 14; i++){ const t = (i + 0.5)/14, fx = left - roadW*0.05 + t*(roadW*1.1), yy = fy + L.laneW*0.25*4*t*(1 - t);
        g.fillStyle = cols[i % 5]; g.beginPath(); g.moveTo(fx - roadW*0.025, yy); g.lineTo(fx + roadW*0.025, yy); g.lineTo(fx, yy + L.laneW*0.18); g.fill(); }
    }
  }
  /* кусты, деревья и цветы по краям */
  const step = 0.3;
  for (let k = Math.floor((e.d - 0.4)/step); k*step < e.d + 1.2; k++){
    for (const side of [-1, 1]){
      const r1 = hash(k*2 + (side > 0 ? 1 : 0)), y = scrY(k*step + r1*0.2);
      const room = (W - roadW)/2 - roadW*0.05; if (room < 12) continue;
      const x = side < 0 ? left - roadW*0.06 - room*(0.2 + 0.7*hash(k + 9.1)) : right + roadW*0.06 + room*(0.2 + 0.7*hash(k + 3.7));
      const kind = Math.floor(hash(k*5.3 + side)*4);
      if (kind === 0){ const s = Math.min(L.laneW*0.22, room*0.45); g.fillStyle = '#5cae43'; for (const [ox, oy] of [[-.6,0],[.6,0],[0,-.5]]){ g.beginPath(); g.arc(x + ox*s, y + oy*s, s*0.75, 0, 7); g.fill(); } }
      else if (kind === 1){ const s = L.laneW*0.05; for (let f = 0; f < 3; f++){ g.fillStyle = ['#ff6b8a','#ffd84d','#fff'][f]; g.beginPath(); g.arc(x + (f - 1)*s*2.2, y + (f % 2)*s, s, 0, 7); g.fill(); } }
      else if (kind === 2){ const s = Math.min(L.laneW*0.35, room*0.9); g.fillStyle = '#a8703f'; g.fillRect(x - s*0.1, y - s*0.6, s*0.2, s*0.6); g.fillStyle = '#6fbf4f'; g.beginPath(); g.arc(x, y - s*0.8, s*0.5, 0, 7); g.fill(); }
    }
  }
}
function drawItem(it){
  const y = scrY(it.d), x = laneX(it.lane), s = L.laneW;
  if (y < -H*0.2 || y > H*1.2 || it.gone) return;
  if (it.type === 'puddle'){
    g.fillStyle = '#5aa8f0'; g.beginPath(); g.ellipse(x, y, s*0.38, s*0.16, 0, 0, 7); g.fill();
    g.fillStyle = '#9fd0ff'; g.beginPath(); g.ellipse(x - s*0.08, y - s*0.04, s*0.14, s*0.05, 0, 0, 7); g.fill();
  } else if (it.type === 'cone'){
    const h = s*0.42, w = s*0.26;
    g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.ellipse(x, y, w*0.9, h*0.12, 0, 0, 7); g.fill();
    g.fillStyle = '#ff7a2e'; g.beginPath(); g.moveTo(x - w*0.5, y); g.lineTo(x - w*0.12, y - h); g.lineTo(x + w*0.12, y - h); g.lineTo(x + w*0.5, y); g.fill();
    g.fillStyle = '#fff'; g.fillRect(x - w*0.33, y - h*0.55, w*0.66, h*0.14);
  } else if (it.type === 'bone'){
    const w = s*0.4, bob = Math.sin(S.t*5 + it.d*9)*s*0.03;
    g.save(); g.translate(x - w/2, y - s*0.22 + bob); g.scale(w/100, w/100);
    g.shadowColor = '#fff36b'; g.shadowBlur = 14; g.fillStyle = '#fff7e6'; g.fill(BONE_PATH); g.shadowBlur = 0;
    g.lineWidth = 4; g.strokeStyle = '#c9a77a'; g.stroke(BONE_PATH); g.restore();
  }
}
function drawImg(key, x, yBottom, h, flip){
  const p = PIC[key]; if (!p || !p.im.complete || !p.im.naturalWidth) return;
  const w = h*p.w/p.h;
  g.save(); g.translate(x, yBottom); if (flip) g.scale(-1, 1);
  g.drawImage(p.im, -w/2, -h, w, h); g.restore();
}
function shadow(x, y, w){ g.fillStyle = 'rgba(40,40,40,.22)'; g.beginPath(); g.ellipse(x, y, w, w*0.22, 0, 0, 7); g.fill(); }
/* Изабель и Пауль плоские: рисую их как на уровнях и спереди велосипед в том же простом стиле */
function drawFlatRider(r, x, y, h){
  const bodyH = h*0.84, wheelR = h*0.2, top = y - wheelR*0.55 - bodyH, lean = r.lean || 0;
  shadow(x, y, h*0.16);
  g.save(); g.translate(x, y); g.rotate(lean*0.12); g.translate(-x, -y);
  drawImg(r.name + '_' + (r.jump ? 'jump' : 'idle'), x, y - wheelR*0.55 + r.bob, bodyH);
  /* колесо (видно спереди узким овалом), вилка, руль */
  g.fillStyle = '#333'; g.beginPath(); g.ellipse(x, y - wheelR, wheelR*0.22, wheelR, 0, 0, 7); g.fill();
  g.fillStyle = '#ddd'; g.beginPath(); g.ellipse(x, y - wheelR, wheelR*0.08, wheelR*0.8, 0, 0, 7); g.fill();
  g.strokeStyle = r.bike; g.lineWidth = Math.max(3, h*0.025); g.lineCap = 'round';
  const hy = top + bodyH*0.5;
  g.beginPath(); g.moveTo(x - wheelR*0.3, y - wheelR); g.lineTo(x, hy); g.lineTo(x + wheelR*0.3, y - wheelR); g.stroke();
  g.strokeStyle = '#666'; g.beginPath(); g.moveTo(x - bodyH*0.21, hy - h*0.01); g.quadraticCurveTo(x, hy + h*0.03, x + bodyH*0.21, hy - h*0.01); g.stroke();
  g.fillStyle = r.bike; for (const sx of [-1, 1]){ rr(x + sx*bodyH*0.21 - h*0.025, hy - h*0.03, h*0.05, h*0.05, h*0.02); g.fill(); }
  g.restore();
}
function drawRider(r){
  const y = scrY(r.d), h = L.riderH*r.h;
  if (y < -h*0.2 || y > H + h) return;
  if (r === R.isabel || r === R.paul) return drawFlatRider(r, r.x, y, h);
  shadow(r.x, y, h*(r === R.theo ? 0.3 : 0.18));
  const flip = r === R.theo && r.flip;
  drawImg(r.name + '_' + r.pose, r.x, y + r.bob, h*(PIC[r.name + '_' + r.pose] ? PIC[r.name + '_' + r.pose].h/440 : 1), flip);
}
function drawDrops(){
  for (const p of S.drops){ g.fillStyle = `rgba(110,180,240,${clamp(p.life*1.6, 0, 0.9)})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
}
function draw(){
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWorld();
  for (const it of S.items) if (it.type !== 'bone') drawItem(it);
  for (const it of S.items) if (it.type === 'bone') drawItem(it);
  const all = Object.values(R).filter(r => r.x).sort((a, b) => scrY(a.d) - scrY(b.d));
  for (const r of all) drawRider(r);
  drawDrops();
}

/* ---------- шаг игры ---------- */
let lastT = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (lastT || now))/1000); lastT = now;
  if (!W) return;
  step(dt); draw();
}
function step(dt){
  S.t += dt;
  const e = R.emily, racing = S.phase === 'race' || S.phase === 'finish';
  /* скорость */
  let target = 0;
  if (S.phase === 'race') target = speedAt(S.t - S.raceT0)*(S.t < S.slowUntil ? 0.62 : 1);
  if (S.phase === 'finish') target = Math.max(0, S.v - dt*0.12);
  S.v += (target - S.v)*Math.min(1, dt*3);
  e.d += S.v*dt;
  /* Эмили едет к своей полосе, крутит педали, наклоняется при перестроении */
  e.x += (laneX(e.lane) - e.x)*Math.min(1, dt*9);
  if (racing && S.v > 0.02){
    const ped = Math.floor(S.t*6) % 2;
    e.pose = S.t < (e.splashUntil || 0) ? 'splash' : S.t < (e.leanUntil || 0) ? (e.leanDir < 0 ? 'leanL' : 'leanR') : S.v > 0.27 ? (ped ? 'fast' : 'ride2') : (ped ? 'ride1' : 'ride2');
    e.bob = Math.sin(S.t*12)*L.riderH*0.01;
  } else if (S.phase === 'done') e.bob = 0;
  /* соперники: держатся рядом, обгоняют и отстают; в конце место зависит от того, сколько луж задела Эмили */
  RIVALS.forEach((r, i) => {
    let off;
    if (S.phase === 'intro' || S.phase === 'count') off = 0;
    else if (S.phase === 'race' && e.d < RACE_D - 3) off = 0.1*Math.sin((S.t - S.raceT0)*0.32 + i*2.4) + (i ? -0.02 : 0.03);
    else {
      const place = S.hits <= 3 ? 1 : S.hits <= 6 ? 2 : 3;
      off = place === 1 ? [-0.16, -0.28][i] : place === 2 ? [0.16, -0.18][i] : [0.14, 0.28][i];
    }
    r.off = off;
    if (S.phase === 'done'){   /* после финиша встают в ряд, каждый в своей полосе */
      r.d += (e.d + 0.02*i - r.d)*Math.min(1, dt*2.5);
      const tx = laneX(r.lane); r.x += (tx - r.x)*Math.min(1, dt*4); r.bob = 0; return;
    }
    r.d += (S.v + 2.2*(e.d + off - r.d))*dt*(racing || S.phase === 'done' ? 1 : 0);
    /* объезжают лужи, конусы и косточки (косточки — для Эмили) */
    const danger = lane => S.items.some(it => !it.gone && it.lane === lane && it.d - r.d > -0.05 && it.d - r.d < 0.4);
    const busy = lane => [e, ...RIVALS].some(o => o !== r && o.lane === lane && Math.abs(o.d - r.d) < 0.16);
    if (racing && danger(r.lane) && S.t > (r.moveT || 0)){
      const opts = [r.lane - 1, r.lane + 1].filter(l => l >= 0 && l <= 2 && !danger(l) && !busy(l));
      if (opts.length){ r.lane = pick(opts); r.moveT = S.t + 0.5; }
    } else if (racing && r.lane === e.lane && S.t > (r.moveT || 0)){   /* не висим на хвосте у Эмили: уходим в свободную полосу */
      const opts = [0, 1, 2].filter(l => l !== r.lane && !danger(l) && !busy(l));
      if (opts.length){ r.lane = opts.sort((a, b) => Math.abs(a - r.lane) - Math.abs(b - r.lane))[0]; r.moveT = S.t + 1.2; }
    }
    const tx = laneX(r.lane); r.lean = clamp((tx - r.x)/L.laneW, -1, 1); r.x += (tx - r.x)*Math.min(1, dt*6);
    r.bob = racing && S.v > 0.02 ? Math.sin(S.t*12 + i)*L.riderH*0.01 : 0;
  });
  /* Марк на беговеле позади, по краю дороги слева */
  const m = R.mark;
  m.x = L.cx - L.roadW/2 + L.laneW*0.12;   /* Марк едет у левого края, сзади (выше, за краем экрана); подъезжает, когда зовёт «Wartet auf mich!» */
  if (S.phase === 'done'){ m.d += (e.d + 0.2 - m.d)*Math.min(1, dt*1.5); m.bob = 0; }
  if (racing){ m.d += (S.v*0.92 + 1.5*(e.d + (S.t < (S.markNear || 0) ? -0.06 : -0.3) - m.d))*dt; m.pose = Math.floor(S.t*3) % 4 === 3 ? 'glide' : (Math.floor(S.t*4) % 2 ? 'push1' : 'push2'); m.bob = Math.sin(S.t*8)*L.riderH*0.008; }
  /* Тео: справа по траве; отвлёкся — убегает к краю и отстаёт */
  const th = R.theo, nearX = L.cx + L.roadW/2 + (W - L.roadW)*0.12, farX = L.cx + L.roadW/2 + (W - L.roadW)/4;
  if (th.mode === 'sit'){ th.x = nearX; th.d = e.d + 0.03; th.pose = 'look'; }
  else if (th.mode === 'run'){ th.x += (nearX - th.x)*Math.min(1, dt*4); th.d += ((e.d + 0.04 + 0.04*Math.sin(S.t*0.8)) - th.d)*Math.min(1, dt*3); th.pose = 'run' + (1 + Math.floor(S.t*9) % 3); th.flip = false; th.bob = -Math.abs(Math.sin(S.t*9))*L.riderH*0.04; }
  else if (th.mode === 'away'){ th.x += (farX - th.x)*Math.min(1, dt*2.5); th.d += ((e.d + 0.45) - th.d)*Math.min(1, dt*2);
    const k = S.t - th.awayT; th.pose = k < 1.2 ? 'side' : (Math.floor(k/2.5) % 2 ? 'bow' : 'sniff'); th.flip = k < 1.2; th.bob = 0; }
  else if (th.mode === 'back'){ th.x += (nearX - th.x)*Math.min(1, dt*3); th.d += ((e.d + 0.04) - th.d)*Math.min(1, dt*3); th.pose = 'jump'; th.flip = false;
    th.bob = -Math.abs(Math.sin(S.t*8))*L.riderH*0.12; if (S.t - th.backT > 1.4) th.mode = S.phase === 'done' ? 'sit' : 'run'; }
  /* ряды помех впереди, до финиша; последние метры пустые */
  if (S.phase === 'race'){
    while (S.nextRow < e.d + 1.05 && S.nextRow < RACE_D - 1.2){ spawnRow(S.nextRow); S.nextRow += 0.5 + Math.random()*0.25; }
    /* Тео убегает */
    if (S.theoEvents.length && S.t - S.raceT0 > S.theoEvents[0] && R.theo.mode === 'run'){ S.theoEvents.shift(); theoRunsOff(!S.said.theo); S.said.theo = true; }
    /* реплики соперников, редко */
    const pl = R.paul;
    if (pl.d - e.d > 0.08 && S.t - S.last.paul > 14 && !speaking){ S.last.paul = S.t; talk(pl, play('p_schneller')); }
    if (R.isabel.d - e.d < -0.08 && S.t - S.last.isabel > 16 && !speaking){ S.last.isabel = S.t; talk(R.isabel, play('i_warte')); }
    if (!S.said.mark && S.t - S.raceT0 > 25 && !speaking){ S.said.mark = true; S.markNear = S.t + 5; play('k_warte'); }
  }
  /* наезды Эмили */
  if (racing) for (const it of S.items){
    if (it.gone || it.hit || Math.abs(it.d - e.d) > 0.035 || Math.abs(laneX(it.lane) - e.x) > L.laneW*0.45) continue;
    it.hit = true;
    if (it.type === 'bone'){ it.gone = true; S.bones++; sfx.ding(); const pn = $('#purseNum'); pn.textContent = S.bones; const pu = $('#purse'); pu.classList.remove('pop'); void pu.offsetWidth; pu.classList.add('pop');
      if (S.bones === 1) play('a_knochen'); }
    else {
      S.hits++; S.slowUntil = S.t + 1.1;
      if (it.type === 'puddle'){ sfx.splash(); e.splashUntil = S.t + 0.7; splashAt(e.x, scrY(e.d)); }
      else { sfx.bonk(); it.gone = true; e.leanUntil = S.t + 0.4; e.leanDir = Math.random() < 0.5 ? -1 : 1; }
      if (S.t - S.last.hoppla > 7 && !speaking){ S.last.hoppla = S.t; talk(e, play('e_hoppla')); }
    }
  }

  S.drops = S.drops.filter(p => p.life > 0);
  /* финиш */
  if (S.phase === 'race' && e.d >= RACE_D){ S.phase = 'finish'; S.finishT = S.t; onFinish(); }
}
function splashAt(x, y){ for (let i = 0; i < 16; i++) S.drops.push({x, y: y - L.riderH*0.05, vx: (Math.random()*2 - 1)*L.laneW*1.4, vy: -L.riderH*(1.6 + Math.random()*1.6), r: L.riderH*(0.02 + Math.random()*0.03), life: 0.7}); }

/* ---------- ход игры ---------- */
async function race(){
  resetRace(); hint(false);
  for (const r of [R.emily, R.isabel, R.paul]) r.x = laneX(r.lane);
  R.theo.x = 1; R.mark.x = 1;
  await sleep(400);
  await play('a_rennen');
  await play('a_pfuetzen');
  hint(true);
  await play('r_rennen');
  await sleep(300);
  /* «Drei, zwei, eins, los!» — все вместе, на экране цифры */
  S.phase = 'count'; R.emily.pose = 'ride1'; R.mark.pose = 'push1'; R.theo.mode = 'run';
  const box = $('#count'), num = $('#num'); box.hidden = false; $('#dots').innerHTML = '';
  const chorus = play('c_321');
  for (const n of [3, 2, 1]){ num.textContent = n; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); sfx.pop(); await sleep(720); }
  box.hidden = true; sfx.bell();
  S.phase = 'race'; S.raceT0 = S.t; $('#purse').hidden = false;
  await chorus;
  setTimeout(() => hint(false), 3000);
}
async function onFinish(){
  hint(false); sfx.fanfare();
  const e = R.emily;
  /* порядок на финише: кто дальше по дороге в момент, когда Эмили пересекла линию */
  const order = [e, R.isabel, R.paul].sort((a, b) => b.d - a.d);
  S.order = order; e.placeN = order.indexOf(e) + 1;
  await play('a_ziel');
  await sleep(1400);
  S.phase = 'done'; S.v = 0;
  { const free = [0, 1, 2].filter(l => l !== e.lane); RIVALS.forEach((r, i) => r.lane = free[i]); }
  e.pose = 'cheer'; for (const r of RIVALS) r.jump = true;
  R.mark.pose = 'laugh'; R.theo.mode = 'back'; R.theo.backT = S.t;
  play('k_laugh');
  for (let i = 0; i < 3; i++) await play(`a_${order[i].name}_${i + 1}`);
  /* настоящая Эмили говорит своё место */
  await repeatAfter(['e_erste', 'e_zweite', 'e_dritte'][e.placeN - 1]);
  /* косточки: летят в общий кошелёк, Эмили считает */
  if (S.bones){
    const box = $('#count'), num = $('#num'), dots = $('#dots'); box.hidden = false; dots.innerHTML = '';
    for (let i = 1; i <= S.bones; i++){
      num.textContent = i; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
      dots.insertAdjacentHTML('beforeend', BONE_SVG); sfx.pop();
      await talk(e, play('e_' + Math.min(10, i)));
    }
    await sleep(500); box.hidden = true;
    saveBones(S.bones);
  }
  e.pose = 'stand';
  await praise();
  $('#again').hidden = false;
}
function saveBones(n){
  try {
    const d = JSON.parse(localStorage.getItem('emily-game') || '{}') || {};
    d.bones = (d.bones || 0) + n;                     /* общий кошелёк косточек: за них открываются мини-игры и причёски */
    d.mini = d.mini || {}; d.mini.race = (d.mini.race || 0) + 1;
    localStorage.setItem('emily-game', JSON.stringify(d));
  } catch(e){}
}

/* ---------- старт ---------- */
$('#pursePic').innerHTML = BONE_SVG;
$('#go').style.backgroundImage = `url(${IMG.emily_ride1[0]})`;
theoBtn.style.backgroundImage = `url(${IMG.theo_look[0]})`;
$('#go').addEventListener('click', async () => {
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
    const s = actx.createBufferSource(); s.buffer = actx.createBuffer(1, 1, 22050); s.connect(actx.destination); s.start();
  } catch(e){ actx = null; }
  $('#start').hidden = true; sfx.pop();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch(e){}
  if (actx) await Promise.all([loadSounds(), setupMic()]);
  race();
});
$('#again').addEventListener('click', async () => { $('#again').hidden = true; $('#purse').hidden = true; sfx.pop(); await sleep(300); race(); });
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));
layout(); resetRace();
for (const r of [R.emily, R.isabel, R.paul]) r.x = laneX(r.lane);
R.theo.x = 1; R.mark.x = 1;
requestAnimationFrame(frame);
window.__race = () => ({phase: S.phase, d: R.emily.d, lane: R.emily.lane, hits: S.hits, bones: S.bones, theo: R.theo.mode, place: R.emily.placeN || 0});
</script>
