<script>
/* Футбол, вид из-за мяча на ворота. Часть 1: пять ударов — палец от мяча к воротам (или просто нажать на ворота), Пауль прыгает
   влево-вправо; забила — «Tor!» и счёт «Eins zu null!», поймал — «Gehalten!», без обиды. Тео один раз утаскивает мяч — все смеются.
   Часть 2: меняются — Эмили на воротах, Пауль бьёт три раза; нажать на летящий мяч — Эмили его ловит. Косточки: голы + пойманные. */
const KEY = 'fussball', SHOTS = 5, SAVES = 3;
const G = () => ({cx: L.W*0.5, half: Math.min(L.W*0.26, L.hE*1.25), top: L.H*0.55 - L.hE*0.95, bottom: L.H*0.55});
function drawScene(g, W, H, L){
  const hz = H*0.42;
  let gr = g.createLinearGradient(0, 0, 0, hz); gr.addColorStop(0, '#8fd3ff'); gr.addColorStop(1, '#e4f6ff'); g.fillStyle = gr; g.fillRect(0, 0, W, hz);
  for (let i = 0; i < 9; i++){ const tx = W*(i/8), r = L.hE*(0.16 + (i % 3)*0.04); g.fillStyle = i % 2 ? '#5fae4a' : '#4f9e3e'; g.beginPath(); g.arc(tx, hz - r*0.4, r, 0, 7); g.fill(); }
  /* поле полосами, разметка */
  for (let i = 0; i < 8; i++){ const y0 = hz + (H - hz)*Math.pow(i/8, 1.4), y1 = hz + (H - hz)*Math.pow((i + 1)/8, 1.4); g.fillStyle = i % 2 ? '#7cc35a' : '#8fd06a'; g.fillRect(0, y0, W, y1 - y0 + 1); }
  const o = G(); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = L.hE*0.025; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, o.bottom); g.lineTo(W, o.bottom); g.stroke();
  g.beginPath(); g.moveTo(o.cx - o.half*1.5, o.bottom); g.lineTo(o.cx - o.half*2.1, H*0.82); g.lineTo(o.cx + o.half*2.1, H*0.82); g.lineTo(o.cx + o.half*1.5, o.bottom); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.ellipse(o.cx, H*0.9, L.hE*0.05, L.hE*0.02, 0, 0, 7); g.fill();
  /* ворота: сетка и белые штанги */
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.5;
  for (let x = o.cx - o.half; x <= o.cx + o.half + 1; x += o.half/8){ g.beginPath(); g.moveTo(x, o.top); g.lineTo(x + (x - o.cx)*0.06, o.bottom - L.hE*0.06); g.stroke(); }
  for (let y = o.top; y < o.bottom; y += L.hE*0.09){ g.beginPath(); g.moveTo(o.cx - o.half, y); g.lineTo(o.cx + o.half, y); g.stroke(); }
  g.strokeStyle = '#fff'; g.lineWidth = L.hE*0.05; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(o.cx - o.half, o.bottom); g.lineTo(o.cx - o.half, o.top); g.lineTo(o.cx + o.half, o.top); g.lineTo(o.cx + o.half, o.bottom); g.stroke();
}
const BALL = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#333" stroke-width="4"/><path d="M50 30 L66 42 L60 61 L40 61 L34 42 Z" fill="#333"/><path d="M50 4 L50 30 M66 42 L92 34 M60 61 L74 86 M40 61 L26 86 M34 42 L8 34" stroke="#333" stroke-width="4"/><path d="M42 6 L58 6 L50 16 Z M88 26 L96 46 L86 42 Z M4 46 L12 26 L14 42 Z" fill="#333"/></svg>';
const ball = $('#ball'); ball.innerHTML = BALL;
const BALL_HOME = () => ({x: L.W*0.5, y: L.H*0.9});
const ballSize = () => L.hE*0.24;
function ballAt(x, y, s = 1){ const w = ballSize()*s; Object.assign(ball.style, {left: (x - w/2) + 'px', top: (y - w/2) + 'px', width: w + 'px', height: w + 'px', transform: ''}); ball.dataset.x = x; ball.dataset.y = y; ball.dataset.s = s; }
/* мяч летит из текущего места в (x, y), уменьшаясь до s; spin — крутится */
function ballFly(x, y, s, ms, easing = 'cubic-bezier(.2,.6,.4,1)'){
  const x0 = +ball.dataset.x, y0 = +ball.dataset.y, s0 = +ball.dataset.s;
  ballAt(x, y, s);
  const k = s0/s, w = ballSize()*s;
  return ball.animate([{transform: `translate(${x0 - x}px,${y0 - y}px) scale(${k}) rotate(0)`}, {transform: 'none'}], {duration: ms, easing}).finished.catch(() => {});
}

let emily, paul, mark, theo;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'laugh', 'walk', 'crouch', 'surprised'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  paul = T.hero('paul', {x: 0.5, d: 1, h: 0.85, poses: ['idle', 'blink', 'talk', 'wave', 'jump', 'hide']});
  emily = T.hero('emily', {x: 0.36, outfit: 'out', poses: EP});
  mark = T.hero('mark', {x: 0.9, h: 0.62, outfit: 'out', poses: ['idle', 'blink', 'laugh', 'wave']});
  theo = T.hero('theo', {x: -0.2, h: 0.48, poses: ['idle', 'blink', 'happy', 'bark', 'run1', 'run2', 'run3']});
}
const S = {goals: 0, saves: 0, phase: 0};

/* ---------- прицел: палец от мяча к воротам или нажатие на ворота; подсказки через 7 с ---------- */
function aim(){
  return new Promise(resolve => {
    const o = G(), ring = document.createElement('div'); ring.className = 'aim'; const rw = o.half*0.5;
    Object.assign(ring.style, {left: (o.cx - rw/2) + 'px', top: ((o.top + o.bottom)/2 - rw/2) + 'px', width: rw + 'px', height: rw + 'px'}); stage.appendChild(ring);
    let start = null, done = false;
    const st = () => stage.getBoundingClientRect();
    const down = e => { if (e.target.closest('#home,#mic,#again')) return; const r = st(); start = {x: e.clientX - r.left, y: e.clientY - r.top}; };
    const up = e => {
      if (!start || done) return; const r = st(), x = e.clientX - r.left, y = e.clientY - r.top, dx = x - start.x, dy = y - start.y;
      let tx = null;
      if (Math.hypot(dx, dy) > 30 && dy < -10) tx = clamp(dx/Math.abs(dy)*1.6, -1, 1);                 /* провела пальцем вверх */
      else if (y < o.bottom + L.hE*0.1 && Math.abs(x - o.cx) < o.half*1.2) tx = clamp((x - o.cx)/o.half, -1, 1);   /* нажала на ворота */
      start = null; if (tx === null) return;
      done = true; finish(); resolve(tx);
    };
    stage.addEventListener('pointerdown', down); stage.addEventListener('pointerup', up);
    const finish = () => { stage.removeEventListener('pointerdown', down); stage.removeEventListener('pointerup', up); ring.remove(); };
    (async () => { let k = 0; while (!done){ await sleep(7000); if (done) break; k++; if (!speaking) await play(k % 3 === 0 ? 'r_m5_schiess' : 'a_m5_schiess'); } })();
  });
}
const zone = tx => tx < -0.33 ? -1 : tx > 0.33 ? 1 : 0;

/* ---------- Тео утаскивает мяч и приносит обратно ---------- */
async function theoSteals(){
  theo.x = -0.15; theo.place(); theo.show('run1');
  const run = setInterval(() => theo.show('run' + (1 + Math.floor(Date.now()/120) % 3)), 120);
  await theo.walkTo(0.47, 1100); t_bark();
  await play('a_m5_theo');
  theo.walkTo(1.2, 1600); await ballFly(L.W*1.15, L.H*0.86, 1, 1600, 'ease-in');
  mark.set('laugh'); emily.set('laugh'); paul.set('jump');
  await Promise.all([play('k_laugh'), play('p_hihi')]);
  await paul.say('p_m5_theo');
  theo.face(true); ballAt(L.W*1.15, L.H*0.9);
  ballFly(BALL_HOME().x, BALL_HOME().y, 1, 1500, 'ease-out'); await theo.walkTo(0.62, 1500);
  clearInterval(run); theo.show('happy'); sfx.ding();
  mark.set('idle'); emily.set('idle'); paul.set('idle');
  await theo.walkTo(-0.2, 1200);
}
function t_bark(){ play('t_bark'); theo.show('bark'); }

/* ---------- часть 1: Эмили бьёт ---------- */
async function shoot(n){
  const tx = await aim(), z = zone(tx), o = G();
  /* Пауль угадывает чаще не туда; трёх голов Эмили хватает всегда */
  const need = 3 - S.goals, left = SHOTS - n + 1;
  let guess = Math.random() < 0.35 ? z : pick([-1, 0, 1].filter(v => v !== z));
  if (left <= need) guess = pick([-1, 0, 1].filter(v => v !== z));
  emily.set('jump'); await T.glide(emily, 0.44, 0, 220, 'ease-out'); sfx.tone(160, 90, 120, 'triangle', .3);
  const bx = o.cx + tx*o.half*0.75, by = (o.top + o.bottom)/2 + L.hE*0.05;
  const px = 0.5 + guess*(o.half*0.62)/L.W;
  paul.set('jump'); T.glide(paul, px, 0, 420, 'ease-out');
  await ballFly(bx, by, 0.5, 650);
  emily.set('idle'); T.glide(emily, 0.36, 0, 400);
  if (guess === z){
    sfx.bonk(); await ballFly(bx + (Math.random() - 0.5)*L.hE*0.2, o.bottom + L.hE*0.05, 0.55, 350, 'ease-in');
    await paul.say('p_m5_gehalten'); await play('a_m5_nochmal');
  } else {
    sfx.whoosh(); sfx.fanfare(); S.goals++; mark.set('laugh'); emily.set('jump');
    await play('a_m5_tor');
    if (S.goals === 1) await T.repeat('e_m5_tor');           /* настоящая Эмили кричит «Tor!» */
    await play('a_m5_' + S.goals + '_0');
    await T.bone(emily); mark.set('idle'); emily.set('idle');
  }
  paul.set('idle'); await T.glide(paul, 0.5, 0, 400);
  ballAt(BALL_HOME().x, BALL_HOME().y); ball.animate([{transform: 'scale(0)'}, {transform: 'none'}], {duration: 300});
}

/* ---------- часть 2: Эмили на воротах, ловит мяч нажатием ---------- */
async function keep(n){
  const o = G(), z = pick([-1, 0, 1]), bx = o.cx + z*o.half*0.7, by = (o.top + o.bottom)/2 + L.hE*0.05;
  paul.set('jump'); await T.glide(paul, 0.45, 0, 220, 'ease-out'); sfx.tone(160, 90, 120, 'triangle', .3); paul.set('idle');
  let caught = null;
  ball.classList.add('tapme');
  const tapBall = e => { if (caught) return; e.preventDefault(); e.stopPropagation(); caught = ball.getBoundingClientRect(); ball.getAnimations().forEach(a => a.cancel()); };
  ball.addEventListener('pointerdown', tapBall);
  await ballFly(bx, by, 0.5, n === 1 ? 2300 : 1800, 'linear');
  ball.removeEventListener('pointerdown', tapBall); ball.classList.remove('tapme');
  if (caught){
    const r = caught, st = stage.getBoundingClientRect();
    ballAt(r.left - st.left + r.width/2, r.top - st.top + r.height/2, r.width/ballSize());
    emily.set('jump'); await T.glide(emily, (r.left - st.left + r.width/2)/L.W, 0, 300, 'ease-out');
    sfx.ding(); S.saves++;
    await emily.say('e_m5_gehalten'); await praise();
    await T.bone(emily);
  } else {
    sfx.whoosh(); paul.set('jump'); await paul.say('p_m5_tor'); await play('a_m5_nochmal');
  }
  emily.set('crouch'); paul.set('idle'); await T.glide(emily, 0.5, 0, 400);
  ballAt(BALL_HOME().x, BALL_HOME().y); ball.animate([{transform: 'scale(0)'}, {transform: 'none'}], {duration: 300});
}

async function game(){
  setup(); tLayout(); T.bones = 0; S.goals = S.saves = 0; $('#purse').hidden = true;
  ballAt(BALL_HOME().x, BALL_HOME().y);
  await sleep(300);
  paul.set('wave'); await paul.say('p_m5_fussball'); paul.set('idle');
  await play('a_m5_schiess'); await play('r_m5_schiess');
  const theoShot = 2 + Math.floor(Math.random()*2);           /* Тео выбегает перед 2-м или 3-м ударом */
  for (let n = 1; n <= SHOTS; n++){ if (n === theoShot) await theoSteals(); await shoot(n); }
  /* меняются: Эмили на воротах, Пауль бьёт */
  await paul.say('p_m5_tausch');
  await T.go('swap', () => { emily.d = 1; emily.k = 0.85; emily.x = 0.5; paul.d = 0; paul.k = 1; paul.x = 0.38; emily.el.style.zIndex = 40; paul.el.style.zIndex = 50; });
  emily.set('crouch'); ballAt(BALL_HOME().x, BALL_HOME().y);
  await play('a_m5_fang'); await play('r_m5_fang');
  for (let n = 1; n <= SAVES; n++) await keep(n);
