};

const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'surprised'];

async function lift(p, on){ await p.el.animate([{transform: on ? 'none' : 'translateY(-30%)'}, {transform: on ? 'translateY(-30%)' : 'none'}], {duration: 300, fill: 'forwards'}).finished.catch(() => {}); }

async function story(){
  await play('n37_intro');
  heike.set('talk'); await heike.say('s37_wer'); heike.set('idle');
  /* рассказываем громко */
  await play('n37_laut');

  }
