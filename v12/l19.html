/* герой отходит вглубь сцены (d: 0 — спереди, 1 — далеко) или возвращается: выше на полу и меньше */
async function depth(h, d, ms = 400){
  const r0 = h.el.getBoundingClientRect(); h.d = d; h.place(); const r1 = h.el.getBoundingClientRect();
  h.el.style.zIndex = 40 + Math.round((1 - d)*10);
  await h.el.animate([{transformOrigin: '0 0', transform: `translate(${r0.left - r1.left}px,${r0.top - r1.top}px) scale(${r0.width/r1.width})`}, {transformOrigin: '0 0', transform: 'none'}], {duration: ms, easing: 'ease-out'}).finished.catch(() => {});
}

  {parts: [{img: 'emily_jump_out', x: 22, h: 66, b: 22}, {img: 'leon_sly', x: 66, h: 70}, {fx: 'zap', x: 32, y: 40}], clip: 'n19_opt_weg', bg: '#e8f6ff', ground: '#bde3a0'},
  {parts: [{img: 'emily_wave_out', x: 40, h: 72}, {img: 'leon_oh', x: 66, h: 70, rot: 12}, {fx: 'zap', x: 46, y: 36}], clip: 'n19_opt_zurueck', bg: '#e8f6ff', ground: '#bde3a0'},
  {parts: [{img: 'emily_blink_out', x: 40, h: 72}, {img: 'leon_sly', x: 72, h: 70}], clip: 'n19_opt_augen', bg: '#e8f6ff', ground: '#bde3a0'}];
const cardsCastle = () => [
  {parts: [{img: 'emily_jump_out', x: 34, h: 70}, {svg: FLAT, x: 70, y: 66, w: 40, hh: 26}, {img: 'leon_sad', x: 76, h: 56}], clip: 'n19_opt_kaputt', bg: '#fff8e8', ground: '#f3d79a'},
  {parts: [{img: 'emily_wave_out', x: 30, h: 66}, {img: 'sommer_wave', x: 70, h: 86}], clip: 'n19_opt_heike', bg: '#fff8e8', ground: '#f3d79a'},
  {parts: [{img: 'emily_crouch_out', x: 40, h: 52}, {fx: 'tears', x: 40, y: 44}, {img: 'leon_laugh', x: 74, h: 70}], clip: 'n19_opt_weinen', bg: '#fff8e8', ground: '#f3d79a'}];

async function story(){
  /* 1. песок: громкое «Stopp!» */
  await play('n19_intro');
  await leon.walkTo(SBX + 0.26, 1300);
  leon.set('throw'); sfx.noise(300, 900, .3); await T.burst(leon, emily); emily.set('surprised'); leon.set('sly');
  await play('n19_sand');
  await play('n19_stopp_tipp'); await play('r19_stopp');
  await loud('e19_stopp');
  leon.set('sly'); await sleep(500);
  await T.glide(leon, SBX + 0.26, 0, 500);
  leon.set('throw'); sfx.noise(300, 900, .3); await T.burst(leon, emily); emily.set('surprised'); leon.set('sly');
  await loud('e19_hoer_auf');
  leon.set('shy'); await leon.say('l19_okay'); leon.set('idle');
  await T.bone(emily);

  /* 2. лужа сзади Эмили: Леон бежит слева толкнуть её — сцена замирает, три карточки.
     Порядок слева направо: Леон → Эмили → лужа. Отошла — Леон пролетает мимо прямо в лужу. */
  const EX = PDX - 0.17;
  await T.go('puddle', () => { emily.x = EX; leon.x = 0.12; leon.set('sly'); });
  emily.set('idle');
  while (true){
    leon.set('sly'); await leon.say('l19_schubse');
    leon.el.classList.add('walking'); await T.glide(leon, EX - 0.2, 0, 500, 'ease-in'); leon.el.classList.remove('walking');
    const i = await T.choose(cardsPuddle(), 'n19_was', 'r19_was');
    if (i === 0){
      /* отойти в сторону: Эмили отпрыгивает назад, Леон проносится мимо и плюхается в лужу — все хохочут */
      emily.set('jump'); await depth(emily, 0.7, 350); emily.set('surprised');
      leon.el.classList.add('walking'); await T.glide(leon, PDX - 0.02, 0, 650, 'ease-in'); leon.el.classList.remove('walking');
      await leon.el.animate([{transform: 'rotate(0)'}, {transform: 'rotate(18deg) translateY(4%)'}], {duration: 250, fill: 'forwards'}).finished.catch(() => {});
      sfx.noise(500, 400, .6); T.burst([L.W*PDX, L.floorY], null, '#7a5230', 24); leon.set('mudsad');
      leon.el.getAnimations().forEach(x => x.cancel());
      await play('n19_platsch');
      await laughAll();
      await sleep(700); leon.set('mud'); await leon.say('l19_igitt');
      await depth(emily, 0, 350); emily.set('idle');
      break;
    }
    if (i === 1){
      /* толкнуть в ответ: Леон врезается, оба летят назад в лужу */
      await T.glide(leon, EX - 0.07, 0, 250, 'ease-in'); sfx.bonk(); emily.set('surprised');
      T.glide(emily, PDX + 0.04, 0, 450, 'ease-in'); await T.glide(leon, PDX - 0.05, 0, 450, 'ease-in');
      sfx.noise(600, 400, .7); T.burst([L.W*PDX, L.floorY], null, '#7a5230', 28); T.mud(emily, true); leon.set('mudsad');
      await sleep(500); await play('n19_beide');
      leon.set('mud'); await laughAll();
      break;
    }
    /* зажмуриться: Леон толкает — Эмили качается на краю лужи, «Nicht schubsen!» и всё сначала */
    emily.set('blink'); await T.glide(leon, EX - 0.07, 0, 300, 'ease-in'); sfx.bonk();
    emily.set('surprised'); await T.glide(emily, EX + 0.06, 0, 300, 'ease-out');
    await emily.el.animate([{transform: 'rotate(0)'}, {transform: 'rotate(12deg)'}, {transform: 'rotate(-6deg)'}, {transform: 'rotate(0)'}], {duration: 700}).finished.catch(() => {});
    await T.repeat('e19_nicht_schubsen');
    leon.set('idle'); await T.glide(leon, 0.12, 0, 600); await T.glide(emily, EX, 0, 300); emily.set('idle');
    await play('n19_noch_mal');
  }
  await T.bone(emily);
  /* все отмылись — играем дальше */
  await T.go('play', () => { T.mud(emily, false); leon.set('idle'); resetAll(); emily.x = 0.4; leon.x = 0.7; mark.x = 0.14; });

  /* 3. Леон отбирает мяч у Марка — Эмили защищает брата */
  mark.set('laugh'); await T.move(ball, 0.2, 0, 500); await T.move(ball, 0.1, 0, 500); mark.set('idle');
  leon.set('sly'); await leon.walkTo(0.22, 1000);
  await T.move(ball, 0.27, 0, 300); ball.o.py = () => L.floorY - L.hE*0.35; ball.place();
  await leon.say('l19_meins'); await leon.walkTo(0.34, 600); leon.face(true);
  mark.set('sad'); T.tears(mark, true); await mark.say('k19_ball');
  await play('n19_mark');
  await emily.walkTo(0.24, 700); emily.face(false);
  await loud('e19_bruder');
  leon.set('shy'); await leon.say('l19_hier');
  ball.o.py = () => L.floorY; await T.move(ball, 0.12, 0, 600);
  T.tears(mark, false); mark.set('laugh'); T.hearts(mark); await praise(); mark.set('idle');
  await T.bone(mark);

  /* 4. Леон ломает замок Эмили: три карточки, плакать не помогает */
  tower.el.hidden = false; tower.el.innerHTML = TOWER; castle.el.innerHTML = CASTLE;
  await T.go('sand', () => { emily.x = SBX - 0.04; leon.x = SBX - 0.2; leon.face(false); });
  emily.set('crouch'); await sleep(600);
  leon.set('sly'); await leon.walkTo(SBX + 0.06, 700); leon.hop(); sfx.bonk(); castle.el.innerHTML = FLAT; T.burst(castle, null, '#e8c27a', 12);
  emily.set('surprised'); leon.set('laugh'); await leon.say('l19_haha');
  while (true){
    const i = await T.choose(cardsCastle(), 'n19_was', 'r19_was');
    if (i === 0){
      await emily.walkTo(SBX - 0.12, 600); emily.set('jump'); emily.hop(); sfx.bonk(); tower.el.innerHTML = FLAT; T.burst(tower, null, '#e8c27a', 12);
      leon.set('sad'); await leon.say('l19_meine_burg');
      emily.set('idle'); await T.repeat('e19_siehst');
      leon.set('shy'); await leon.say('l19_ok_entschuldigung');
      break;
    }
    if (i === 1){
      emily.set('wave'); await T.repeat('e19_heike'); emily.set('idle');
      await heike.walkTo(0.12, 1200);
      await heike.say('s19_sag');
      leon.set('shy'); await leon.say('l19_entschuldigung');
      break;
    }
    /* сесть и плакать: Леон смеётся и ломает дальше */
    emily.set('crouch'); T.tears(emily, true);
    leon.set('laugh'); leon.hop(); sfx.bonk(); T.burst(castle, null, '#e8c27a', 10); await leon.say('l19_haha');
    await play('n19_weinen'); T.tears(emily, false); emily.set('idle');
  }
  await T.repeat('e19_nicht_mehr');
  leon.set('shy'); await leon.say('l19_mach_nicht');
  await T.bone(leon);
  /* строят заново вместе */
  castle.el.innerHTML = CASTLE; tower.el.innerHTML = TOWER; sfx.ding(); castle.el.animate([{transform: 'scale(.3)'}, {transform: 'none'}], {duration: 500, easing: 'cubic-bezier(.3,1.6,.5,1)'});
  emily.set('jump'); leon.set('jump'); await play('n19_ende');
  emily.set('idle'); leon.set('idle');
}
T.start(IMG.leon_sly[0], setup);
setup();
</script>
<script src="js/screen.js"></script>
<script src="js/common.js"></script>
</body></html>
