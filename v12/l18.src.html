<script>
/* Уровень 18: на следующий день София выходит во двор с куклой Лоттой. Любимый цвет и любимая еда — выбор на карточках,
   Эмили говорит выбранное. Музыка: «Ich höre gern K-Pop!», балет — нажать на Эмили, пируэт, потом бодрая мелодия и все танцуют. */
const LEVEL = 18;
const STICKER = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#e8f6ff" stroke="#5aa8f0" stroke-width="5"/><path d="M42 26 V64 a9 7 0 1 1 -5 -6 V30 l26 -6 V58 a9 7 0 1 1 -5 -6 V30" fill="#ff6b8a" stroke="#d6476a" stroke-width="3" stroke-linejoin="round"/><path d="M20 80 q30 -14 60 0" stroke="#ffd34d" stroke-width="6" fill="none" stroke-linecap="round"/></svg>';
function drawScene(g, W, H, L){ drawYard(g, W, H, L); }

const DOLL = '<svg viewBox="0 0 60 100"><path d="M14 48 Q30 40 46 48 L54 92 Q30 98 6 92 Z" fill="#ff8fb8" stroke="#d6476a" stroke-width="3" stroke-linejoin="round"/><circle cx="30" cy="30" r="18" fill="#ffe0c8" stroke="#c99a7a" stroke-width="3"/><path d="M12 30 Q12 8 30 8 Q48 8 48 30 Q42 18 30 18 Q18 18 12 30 Z" fill="#ffd34d" stroke="#c99a1e" stroke-width="2"/><circle cx="24" cy="30" r="2.5" fill="#333"/><circle cx="36" cy="30" r="2.5" fill="#333"/><path d="M25 37 q5 4 10 0" stroke="#d6476a" stroke-width="2" fill="none"/></svg>';
const NOTE = '<svg viewBox="0 0 40 50"><path d="M14 6 V36 a8 6 0 1 1 -4 -5 V10 l22 -6 V30 a8 6 0 1 1 -4 -5 V10" fill="#9b6bff" stroke="#6a3fd0" stroke-width="2"/></svg>';
const blob = c => `<svg viewBox="0 0 100 100"><path d="M50 8 C72 6 92 22 90 46 C88 70 74 92 50 90 C26 92 8 74 10 50 C12 26 28 10 50 8 Z" fill="${c}" stroke="rgba(0,0,0,.18)" stroke-width="4"/><ellipse cx="36" cy="32" rx="12" ry="8" fill="#fff" opacity=".45"/></svg>`;
const FOOD = {
  eis: '<svg viewBox="0 0 60 110"><path d="M14 54 H46 L30 106 Z" fill="#e8b46a" stroke="#b8803a" stroke-width="3"/><circle cx="30" cy="44" r="17" fill="#ff8fb8" stroke="#d6476a" stroke-width="3"/><circle cx="30" cy="22" r="16" fill="#fff3d6" stroke="#d9c49a" stroke-width="3"/><circle cx="30" cy="5" r="5" fill="#ff3b3b"/></svg>',
  pommes: '<svg viewBox="0 0 80 100"><g fill="#ffd34d" stroke="#d9a925" stroke-width="2"><rect x="16" y="8" width="8" height="50" rx="2"/><rect x="28" y="2" width="8" height="56" rx="2"/><rect x="40" y="6" width="8" height="52" rx="2"/><rect x="52" y="10" width="8" height="48" rx="2"/></g><path d="M8 40 H72 L64 96 H16 Z" fill="#ff3b3b" stroke="#b82020" stroke-width="3" stroke-linejoin="round"/><circle cx="40" cy="66" r="10" fill="#fff" opacity=".8"/></svg>',
  aepfel: '<svg viewBox="0 0 110 70"><g transform="translate(0 6)"><path d="M30 18 C16 8 4 20 8 36 C12 52 24 58 30 52 C36 58 48 52 52 36 C56 20 44 8 30 18 Z" fill="#ff4d4d" stroke="#c22f2f" stroke-width="3"/><path d="M30 18 q2 -10 8 -12" stroke="#6b3d1e" stroke-width="3" fill="none"/></g><g transform="translate(50 6)"><path d="M30 18 C16 8 4 20 8 36 C12 52 24 58 30 52 C36 58 48 52 52 36 C56 20 44 8 30 18 Z" fill="#7ccf6b" stroke="#4f9e3e" stroke-width="3"/><path d="M30 18 q2 -10 8 -12" stroke="#6b3d1e" stroke-width="3" fill="none"/></g></svg>',
  nudeln: '<svg viewBox="0 0 100 80"><path d="M20 22 q8 -14 16 0 q8 -14 16 0 q8 -14 16 0 q8 -14 16 0" fill="none" stroke="#ffd34d" stroke-width="7" stroke-linecap="round"/><path d="M24 30 q10 -12 20 0 q10 -12 20 0 q10 -12 20 0" fill="none" stroke="#f0c040" stroke-width="7" stroke-linecap="round"/><circle cx="42" cy="26" r="6" fill="#ff3b3b"/><circle cx="62" cy="24" r="5" fill="#ff3b3b"/><path d="M6 34 H94 Q90 76 50 76 Q10 76 6 34 Z" fill="#5aa8f0" stroke="#2f80ed" stroke-width="3" stroke-linejoin="round"/></svg>'
};
const card = (svg, bg) => ({parts: [{svg, x: 50, y: 10, w: 62, hh: 72}], bg});

let emily, mark, theo, sofia, doll;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'crouch', 'laugh', 'walk'];
const SP = ['idle', 'blink', 'talk', 'wave', 'jump', 'laugh', 'sad', 'dance'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  sofia = T.hero('sofia', {x: DOOR_X, h: 0.95, poses: SP}); sofia.el.style.opacity = 0;
  doll = T.prop(DOLL, {px: () => L.W*sofia.x + L.hE*0.18, py: () => L.floorY - L.hE*0.3, w: 0.16, ratio: 100/60, z: 56}); doll.el.hidden = true;
  theo = T.hero('theo', {x: 0.44, h: 0.48, poses: ['idle', 'blink', 'happy', 'lie', 'sniff', 'bark']});
  mark = T.hero('mark', {x: 0.13, h: 0.62, outfit: 'out', poses: ['idle', 'blink', 'laugh', 'wave', 'talk', 'walk']});
  emily = T.hero('emily', {x: 0.3, outfit: 'out', poses: EP});
}
/* ноты летят над головой (музыка) */
function notes(h, n = 4){
  const st = stage.getBoundingClientRect(), r = h.el.getBoundingClientRect();
  for (let i = 0; i < n; i++){ const d = document.createElement('i'), w = L.hE*0.13; d.className = 'fly'; d.innerHTML = NOTE;
    Object.assign(d.style, {left: (r.left - st.left + r.width*(0.2 + Math.random()*0.6)) + 'px', top: (r.top - st.top) + 'px', width: w + 'px', height: w*1.25 + 'px'}); stage.appendChild(d);
    d.animate([{transform: 'translate(0,0) rotate(0)', opacity: 0}, {opacity: 1, offset: .2}, {transform: `translate(${(Math.random() - .5)*L.hE*0.5}px,${-L.hE*0.6}px) rotate(${(Math.random() - .5)*60}deg)`, opacity: 0}], {duration: 1600, delay: i*250}).finished.then(() => d.remove()).catch(() => d.remove()); }
}
/* своя бодрая мелодия в стиле поп (не настоящая песня): 128 ударов в минуту, аккорды C–G–Am–F, бас, бочка, тарелочки, мелодия */
function popTune(bars = 8){
  if (!actx) return sleep(bars*1900);
  const b = 60/128, t0 = actx.currentTime + 0.1, out = actx.createGain(); out.gain.value = 0.5; out.connect(actx.destination);
  const note = (f, t, d, type, v) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(g).connect(out); o.start(t); o.stop(t + d + 0.05); };
  const kick = t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
    g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(g).connect(out); o.start(t); o.stop(t + 0.25); };
  const hat = t => { const n = actx.createBufferSource(), buf = actx.createBuffer(1, 2205, 44100), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1)*(1 - i/d.length);
    const f = actx.createBiquadFilter(), g = actx.createGain(); f.type = 'highpass'; f.frequency.value = 7000; g.gain.value = 0.18; n.buffer = buf; n.connect(f).connect(g).connect(out); n.start(t); };
  const CH = [[261.6, 329.6, 392], [196, 246.9, 293.7], [220, 261.6, 329.6], [174.6, 220, 261.6]];
  const MEL = [[659, 0], [784, 1], [880, 1.5], [784, 2], [659, 3], [587, 3.5], [523, 4], [587, 5], [659, 5.5], [784, 6], [659, 7]];
  for (let bar = 0; bar < bars; bar++){
    const tb = t0 + bar*4*b, ch = CH[bar % 4];
    for (let q = 0; q < 4; q++){ kick(tb + q*b); hat(tb + q*b + b/2); note(ch[0]/2, tb + q*b, b*0.9, 'triangle', 0.35); }
    for (const f of ch) note(f, tb + b, b*0.4, 'square', 0.05), note(f, tb + 3*b, b*0.4, 'square', 0.05);
    for (const [f, at] of MEL) if (at < 4 === (bar % 2 === 0)) note(f*(bar >= 4 ? 1.122 : 1), tb + (at % 4)*b, b*0.45, 'square', 0.09);
  }
  return sleep(bars*4*b*1000 + 200);
}

async function story(){
  /* на следующий день София выходит из подъезда */
  await play('n18_intro');
  sofia.el.animate([{opacity: 0}, {opacity: 1}], {duration: 500, fill: 'forwards'}); sofia.el.style.opacity = 1;
  await sofia.walkTo(0.62, 1000);
  sofia.set('wave'); await sofia.say('f18_hallo'); sofia.set('idle');
  await T.repeat('e18_hallo');

  /* кукла Лотта */
  doll.el.hidden = false; doll.place(); doll.el.animate([{transform: 'scale(0)'}, {transform: 'none'}], {duration: 400, easing: 'cubic-bezier(.3,1.6,.5,1)'});
  await sofia.say('f18_puppe');
  await T.repeat('e18_schoen');
  await sofia.say('f18_lotta');
  T.hearts(doll, 2);
  await T.bone(sofia);

  /* любимый цвет: выбор на карточках */
  await sofia.say('f18_farbe');
  const COLORS = [['rosa', '#ff8fb8', 'n18_rosa'], ['blau', '#2f80ed', 'a_farbe_blau'], ['gelb', '#ffd34d', 'a_farbe_gelb'], ['gruen', '#32b67a', 'n18_gruen']];
  const c = await T.choose(COLORS.map(([, col, clip]) => Object.assign(card(blob(col), '#fff'), {clip})), 'f18_farbe', 'r_tipp_bild');
  await T.repeat('e18_' + COLORS[c][0]);
  if (COLORS[c][0] === 'blau'){ sofia.set('jump'); await sofia.say('f18_auch_blau'); T.hearts(sofia); }
  else { await sofia.say('f18_blau'); sofia.set('jump'); }
  await sleep(400); sofia.set('idle');
  await T.bone(emily);

  /* любимая еда */
  await sofia.say('f18_essen');
  const FOODS = ['eis', 'pommes', 'aepfel', 'nudeln'];
  const f = await T.choose(FOODS.map(k => Object.assign(card(FOOD[k], '#fff8e8'), {clip: 'n18_' + k})), 'f18_essen', 'r_tipp_bild');
  await T.repeat('e18_' + FOODS[f]);
  sofia.set('laugh'); await sofia.say('f18_lecker'); sofia.set('idle');
  await T.bone(emily);

  /* музыка */
  await sofia.say('f18_hoeren');
  await T.repeat('e18_kpop');
  notes(sofia); await sofia.say('f18_lieder');

  /* балет: нажать на Эмили — пируэт, потом все танцуют */
  await T.repeat('e18_ballett');
  sofia.set('jump'); await sofia.say('f18_zeig'); sofia.set('idle');
  await T.tap([emily], 'n18_tipp_emily', 'r_tipp_licht');
  emily.set('wave'); emily.el.classList.remove('spin'); void emily.el.offsetWidth; emily.el.classList.add('spin'); sfx.whoosh();
  await sleep(1300); emily.el.classList.remove('spin'); emily.set('jump'); sfx.ding(); await sleep(400);
  sofia.set('jump'); await praise();
  await play('n18_tanzen');
  const dancers = [emily, sofia, mark, theo]; dancers.forEach((h, i) => setTimeout(() => h.body.classList.add('dance'), i*120));
  emily.set('laugh'); sofia.set('dance'); mark.set('laugh'); theo.set('happy');
  const hopper = setInterval(() => { mark.hop(); theo.hop(); notes(pick([emily, sofia]), 1); }, 900);
  const flip = setInterval(() => { emily.set(emily.base === 'laugh' ? 'jump' : 'laugh'); sofia.set(sofia.base === 'dance' ? 'jump' : 'dance'); }, 470);
  await popTune(8);
  clearInterval(hopper); clearInterval(flip); dancers.forEach(h => h.body.classList.remove('dance'));
  emily.set('idle'); sofia.set('idle'); mark.set('idle'); theo.set('idle');
  await T.bone(emily);

  /* в гости */
  await T.repeat('e18_kommen');
  sofia.set('jump'); await sofia.say('f18_mama'); sofia.set('idle');
  await T.bone(sofia);

  /* пока */
  await T.repeat('e18_tschuess');
  sofia.set('wave'); emily.set('wave'); mark.set('wave'); await sofia.say('f18_bis_bald');
  emily.set('idle'); mark.set('idle');
  doll.el.hidden = true; await sofia.walkTo(DOOR_X, 900); sofia.el.animate([{opacity: 1}, {opacity: 0}], {duration: 400, fill: 'forwards'});
}
T.start(IMG.sofia_dance[0], setup);
setup();
</script>
