function drawScene(g, W, H, L){
  const fy = L.floorY, hE = L.hE, hz = H*0.55;
  let gr = g.createLinearGradient(0, 0, 0, hz); gr.addColorStop(0, '#c9e2f2'); gr.addColorStop(1, '#eef6fa'); g.fillStyle = gr; g.fillRect(0, 0, W, hz);
  for (const [x, r, c] of [[0.08, 0.55, '#e0763a'], [0.3, 0.45, '#e3a33a'], [0.55, 0.5, '#c9584a'], [0.82, 0.55, '#e3a33a'], [0.97, 0.4, '#b5452f']]){
    g.fillStyle = '#6e4a2a'; g.fillRect(W*x - hE*0.06, hz - hE*1.0, hE*0.12, hE*1.0); g.fillStyle = c; g.beginPath(); g.arc(W*x, hz - hE*1.05, hE*r, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.arc(W*x - hE*r*0.3, hz - hE*1.2, hE*r*0.4, 0, 7); g.fill(); }
  gr = g.createLinearGradient(0, hz, 0, H); gr.addColorStop(0, '#9cc56a'); gr.addColorStop(1, '#7fae52'); g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
  g.fillStyle = '#d9c29a'; g.beginPath(); g.ellipse(W*0.5, fy + hE*0.05, W*0.6, hE*0.12, 0, 0, 7); g.fill();
  for (let i = 0; i < 40; i++){ const x = (i*37.7 % 100)/100*W, y = hz + (i*23.1 % 100)/100*(H - hz); g.fillStyle = ['#e0763a', '#e3a33a', '#b5452f', '#8a5a2e'][i % 4]; g.beginPath(); g.ellipse(x, y, hE*0.035, hE*0.016, i, 0, 7); g.fill(); }
  /* скамейка */
  g.fillStyle = '#8a5a2e'; g.fillRect(W*0.86, fy - hE*0.42, hE*0.8, hE*0.07); g.fillRect(W*0.86, fy - hE*0.28, hE*0.8, hE*0.06); g.fillRect(W*0.86 + hE*0.05, fy - hE*0.24, hE*0.05, hE*0.24); g.fillRect(W*0.86 + hE*0.7, fy - hE*0.24, hE*0.05, hE*0.24);
}
const NUT = '<svg viewBox="0 0 100 100"><path d="M50 10 Q90 30 76 72 Q50 94 24 72 Q10 30 50 10 Z" fill="#8a4a1e" stroke="#5e2f10" stroke-width="5"/><ellipse cx="50" cy="72" rx="22" ry="11" fill="#d9b58a"/><ellipse cx="40" cy="32" rx="9" ry="5" fill="#b0703a" opacity=".8"/></svg>';
const BUCKET = '<svg viewBox="0 0 100 90"><path d="M14 24 H86 L76 86 H24 Z" fill="#4a8ff0" stroke="#2a5fb0" stroke-width="5" stroke-linejoin="round"/><path d="M18 24 Q50 -10 82 24" fill="none" stroke="#2a5fb0" stroke-width="4"/></svg>';
const LEAF = c => `<svg viewBox="0 0 100 100"><path d="M50 6 L60 30 L84 22 L74 46 L96 56 L70 64 L76 90 L50 76 L24 90 L30 64 L4 56 L26 46 L16 22 L40 30 Z" fill="${c[0]}" stroke="${c[1]}" stroke-width="4" stroke-linejoin="round"/><path d="M50 30 V96" stroke="${c[1]}" stroke-width="4"/></svg>`;
const LC = {rot: ['#e2483a', '#a82a20'], gelb: ['#ffd34d', '#d6a21e'], braun: ['#9a6232', '#6a3e18']};
const PILE = n => `<svg viewBox="0 0 200 100"><g>${Array.from({length: 6 + n*4}, (_, i) => { const x = 100 + Math.cos(i*2.4)*(20 + (i % 7)*10)*(0.4 + n*0.12), y = 92 - (i % 5)*8*(0.4 + n*0.12) - Math.abs(Math.sin(i))*10*(n/5); const c = [LC.rot, LC.gelb, LC.braun][i % 3]; return `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="16" ry="8" transform="rotate(${(i*47) % 180} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${c[0]}" stroke="${c[1]}" stroke-width="2"/>`; }).join('')}</g></svg>`;
let emily, abiha, isabel, paul, heike, bucket, nuts = [], big, big2, leaves = [], pile;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'crouch', 'laugh', 'walk'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'walk', 'jump', 'laugh'];

  big.el.hidden = big2.el.hidden = true;
  await T.bone(paul);

  /* листья по цветам */

  const spots = [[0.2, 'rot'], [0.32, 'gelb'], [0.44, 'braun'], [0.56, 'gelb'], [0.68, 'rot'], [0.8, 'braun']];
  leaves = spots.map(([x, c], i) => { const p = T.prop(LEAF(LC[c]), {x, py: gy((i % 2)*0.04), w: 0.22, z: 56}); p.c = c; return p; });
  for (const c of ['rot', 'gelb', 'braun']){
    await play('n35_' + c);
    while (true){
      const el = await T.tap(leaves.filter(l => !l.el.hidden), 'n35_' + c, 'r35_blatt'); const l = leaves.find(x => x.el === el);
      if (l.c === c){ l.el.animate([{transform: 'none'}, {transform: 'translateY(-40%) rotate(40deg) scale(1.3)'}, {transform: 'none'}], {duration: 600}); sfx.ding(); break; }
      el.classList.add('shake'); sfx.bonk(); await play('n35_falsch');

  leaves.forEach(l => l.el.hidden = true);
  await T.bone(emily);

  /* Эмили прыгает в кучу Пауля */

  await T.glide(emily, 0.7, 0, 400); pile.el.innerHTML = PILE(1); T.burst(pile, null, '#e3a33a', 22); emily.set('laugh');
  emily.set('idle');

  await play('n35_bauen');
  emily.set('crouch');
  for (let i = 1; i <= 5; i++){ await T.tap([pile], 'n35_bauen', 'r35_bauen'); pile.el.innerHTML = PILE(i); sfx.pop(); await count(i); }
  hideNum(); emily.set('idle');
  paul.set('jump'); await paul.say('p35_zusammen');
  emily.set('jump'); paul.hop(); emily.hop(); T.burst(pile, null, '#e0763a', 26); await Promise.all([play('k_laugh'), play('p_hihi')]);
  emily.set('laugh'); paul.set('idle'); await sleep(500); emily.set('idle');
  await T.bone(pile);
  heike.set('talk'); await heike.say('s35_zurueck'); heike.set('idle');
  [emily, abiha, isabel, paul].forEach(h => h.set('jump')); await play('n35_ende');
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
}
T.start(IMG.paul_wave[0], setup);
setup();
</script>
