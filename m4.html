<div id="stage">

    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="#fff"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
  </button>

    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>

<script>
const IMG = {"emily_idle_out": ["assets/img/75212f3d100c.webp", 220, 407], "emily_blink_out": ["assets/img/8f259a32dae9.webp", 220, 407], "emily_mouth1_out": ["assets/img/9526ce345376.webp", 220, 407], "emily_mouth2_out": ["assets/img/9526ce345376.webp", 220, 407], "emily_wave_out": ["assets/img/acf19e1e2d3e.webp", 218, 410], "emily_jump_out": ["assets/img/afd822bd4c46.webp", 276, 377], "emily_laugh_out": ["assets/img/919bf61cad53.webp", 232, 399], "emily_walk_out": ["assets/img/8e591eafe46b.webp", 225, 385], "isabel_idle": ["assets/img/7961dcd89080.svg", 240, 420], "isabel_blink": ["assets/img/c5a76f73e7d4.svg", 240, 420], "isabel_talk": ["assets/img/baef4844e6b3.svg", 240, 420], "isabel_wave": ["assets/img/288d5ba24e38.svg", 240, 420], "isabel_jump": ["assets/img/0127eade7189.svg", 240, 420], "mark_idle_out": ["assets/img/445af52614b6.webp", 193, 397], "mark_blink_out": ["assets/img/0835c9f94d77.webp", 193, 397], "mark_laugh_out": ["assets/img/82ef3421dc54.webp", 189, 386], "mark_wave_out": ["assets/img/3f7d07abc7df.webp", 198, 397], "mark_talk_out": ["assets/img/554d772231eb.webp", 193, 397], "theo_idle": ["assets/img/8ce5fe0202bd.webp", 258, 346], "theo_blink": ["assets/img/5bd18fc57314.webp", 259, 347], "theo_happy": ["assets/img/e2a2a3c50086.webp", 322, 316], "theo_bark": ["assets/img/9a746a81bb63.webp", 258, 347], "theo_run1": ["assets/img/3b191919007b.webp", 343, 407], "theo_run2": ["assets/img/fef68db15d46.webp", 296, 390], "theo_run3": ["assets/img/41f6c10d7050.webp", 337, 381]};  /*IMG: emily_{idle,blink,mouth1,mouth2,wave,jump,laugh,walk}_out isabel_{idle,blink,talk,wave,jump} mark_{idle,blink,laugh,wave,talk}_out theo_{idle,blink,happy,bark} theo_run1 theo_run2 theo_run3*/
const SND = {"a_juhu": "assets/snd/ab65e31fd892.mp3", "a_nach": "assets/snd/ca5aa096bdb0.mp3", "a_prima": "assets/snd/4beb6b79b97f.mp3", "a_super": "assets/snd/fe00647daef4.mp3", "a_toll": "assets/snd/288f2e5a7bca.mp3", "a_wunderbar": "assets/snd/2a1e6fe05fd4.mp3", "e_1": "assets/snd/47c925770470.mp3", "e_10": "assets/snd/46a8ffbe7b43.mp3", "e_2": "assets/snd/918ef9b62ef0.mp3", "e_3": "assets/snd/510e7125b84e.mp3", "e_4": "assets/snd/eedc12bfb218.mp3", "e_5": "assets/snd/61057bf82030.mp3", "e_6": "assets/snd/f1d18f32c4f6.mp3", "e_7": "assets/snd/ce569c9a5108.mp3", "e_8": "assets/snd/ee98e8bfbe63.mp3", "e_9": "assets/snd/742279368294.mp3", "e_spass": "assets/snd/69f875580c64.mp3", "k_laugh": "assets/snd/403616bb79cf.mp3", "r_like_emily": "assets/snd/9f24a0a81f00.mp3", "r_repeat": "assets/snd/17dff5d39745.mp3", "t_bark": "assets/snd/d5a7365a3230.mp3"};  /*SND: e_{1..10} a_super a_toll a_prima a_juhu a_wunderbar a_nach r_repeat r_like_emily e_spass t_bark k_laugh*/
/* фразы без записи — пока голос браузера (js/mini.js), тексты для озвучки — voice-next.md */
const SAY = {
  i_m4_schaukeln: 'Wollen wir schaukeln?',
  e_m4_ja: 'Ja!',
  a_m4_zaehl: 'Wir zählen zusammen! Sag die Zahlen laut!',
  r_m4_zaehl: 'Считай вместе с Эмили вслух — тогда качели полетят выше!',
  i_m4_hoeher: 'Höher!',
  e_m4_hoeher: 'Höher, höher!',
  a_m4_baum: 'Ein Baum!',
  a_m4_vogel: 'Ein Vogel!',
  a_m4_wolke: 'Eine Wolke!',
  i_m4_juhu: 'Juhu!',
  i_m4_spass: 'Das hat Spaß gemacht!'
};

<script>
/* Качели: Эмили и Изабель качаются рядом. Считаем 1–10 как в прятках: число звучит, загорается микрофон, Эмили повторяет —
   качели взлетают выше. Нажать на качели в нижней точке — ещё толчок (не вовремя — ничего страшного). Выше — видно дерево, птичку, облако. */
const KEY = 'schaukel', BONES = 5;
const SWE = 0.4, SWI = 0.62;                          /* где висят качели Эмили и Изабель */
function drawScene(g, W, H, L){
  const fy = L.floorY, hE = L.hE, hz = H*0.55;
  let gr = g.createLinearGradient(0, 0, 0, hz); gr.addColorStop(0, '#8fd3ff'); gr.addColorStop(1, '#e4f6ff'); g.fillStyle = gr; g.fillRect(0, 0, W, hz);
  g.fillStyle = '#fff3a8'; g.beginPath(); g.arc(W*0.92, H*0.12, hE*0.14, 0, 7); g.fill();
  for (let i = 0; i < 9; i++){ const tx = W*(i/8), r = hE*(0.16 + (i % 3)*0.04); g.fillStyle = i % 2 ? '#5fae4a' : '#4f9e3e'; g.beginPath(); g.arc(tx, hz - r*0.4, r, 0, 7); g.fill(); }
  gr = g.createLinearGradient(0, hz, 0, H); gr.addColorStop(0, '#a6dd78'); gr.addColorStop(1, '#7cc35a'); g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
  g.fillStyle = '#f3d79a'; for (const x of [SWE, SWI]){ g.beginPath(); g.ellipse(W*x, fy + hE*0.03, hE*0.3, hE*0.07, 0, 0, 7); g.fill(); }
  /* стойки и перекладина */
  g.lineCap = 'round'; g.strokeStyle = '#8a5a1e'; const top = beamY(), l = W*SWE - hE*0.45, r = W*SWI + hE*0.45;
  g.lineWidth = hE*0.055; for (const x of [l, r]) for (const s of [-1, 1]){ g.beginPath(); g.moveTo(x + s*hE*0.3, fy); g.lineTo(x, top); g.stroke(); }
  g.lineWidth = hE*0.065; g.beginPath(); g.moveTo(l - hE*0.05, top); g.lineTo(r + hE*0.05, top); g.stroke();
}
const beamY = () => L.floorY - L.hE*1.7;
const SEAT = '<svg viewBox="0 0 45 125" preserveAspectRatio="none"><path d="M8 0 V118 M37 0 V118" stroke="#7a5a3a" stroke-width="2.2"/><rect x="2" y="114" width="41" height="9" rx="4" fill="#ff7a59" stroke="#d65a3b" stroke-width="2"/></svg>';
const SEAT2 = SEAT.replace('#ff7a59', '#5aa8f0').replace('#d65a3b', '#2f80ed');
const TREE = '<svg viewBox="0 0 100 100"><rect x="44" y="60" width="12" height="40" fill="#8a5a1e"/><circle cx="50" cy="42" r="32" fill="#4f9e3e"/><circle cx="30" cy="54" r="20" fill="#5fae4a"/><circle cx="70" cy="54" r="20" fill="#5fae4a"/><g fill="#ff4d4d"><circle cx="38" cy="40" r="5"/><circle cx="62" cy="34" r="5"/><circle cx="54" cy="58" r="5"/></g></svg>';
const BIRD = '<svg viewBox="0 0 100 70"><ellipse cx="50" cy="42" rx="24" ry="18" fill="#ffd34d" stroke="#d6a21e" stroke-width="4"/><circle cx="70" cy="30" r="13" fill="#ffd34d" stroke="#d6a21e" stroke-width="4"/><circle cx="74" cy="27" r="3" fill="#333"/><path d="M82 31 l12 3 l-12 4 z" fill="#ff7a59"/><path d="M40 34 Q30 4 12 14 Q24 30 44 44 Z" fill="#ffe58a" stroke="#d6a21e" stroke-width="4" stroke-linejoin="round"/></svg>';
const CLOUD = '<svg viewBox="0 0 120 70"><g fill="#fff" stroke="#cfe6f7" stroke-width="4"><circle cx="36" cy="42" r="22"/><circle cx="62" cy="30" r="26"/><circle cx="88" cy="44" r="20"/><rect x="30" y="40" width="64" height="24" rx="12" stroke="none"/></g><circle cx="52" cy="40" r="3" fill="#7a8fa6"/><circle cx="72" cy="40" r="3" fill="#7a8fa6"/><path d="M56 50 q6 5 12 0" stroke="#7a8fa6" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';

let emily, isabel, mark, theo, seatE, seatI, tree, bird, cloud;
const SW = {a: 0, ai: 0, A: 0, target: 0, ph: 0, on: false, last: 0};
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  seatE = T.prop(SEAT, {x: SWE, py: () => L.floorY - L.hE*0.27, w: 0.42, ratio: 1.43/0.42, z: 35});
  seatI = T.prop(SEAT2, {x: SWI, py: () => L.floorY - L.hE*0.27, w: 0.42, ratio: 1.43/0.42, z: 35});
  tree = T.prop(TREE, {px: () => L.W*0.12, py: () => L.H*0.42, w: 0.7, z: 5}); tree.el.classList.add('sky');
  bird = T.prop(BIRD, {px: () => L.W*0.82, py: () => L.H*0.3, w: 0.32, ratio: 0.7, z: 5}); bird.el.classList.add('sky', 'bird');
  cloud = T.prop(CLOUD, {px: () => L.W*0.5, py: () => L.H*0.2, w: 0.75, ratio: 70/120, z: 5}); cloud.el.classList.add('sky');
  isabel = T.hero('isabel', {x: SWI, h: 0.86, lift: 0.3, poses: ['idle', 'blink', 'talk', 'wave', 'jump']});
  emily = T.hero('emily', {x: SWE, h: 0.86, lift: 0.3, outfit: 'out', poses: ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'laugh', 'walk']});
  mark = T.hero('mark', {x: 0.86, h: 0.62, outfit: 'out', poses: ['idle', 'blink', 'laugh', 'wave', 'talk']});
  theo = T.hero('theo', {x: 0.5, h: 0.48, poses: ['idle', 'blink', 'happy', 'bark', 'run1', 'run2', 'run3']});
  theo.el.style.zIndex = 60;
  SW.a = SW.ai = SW.A = SW.target = 0; SW.on = false;
}

/* качание: угол = A·sin(фаза); A плавно растёт к target; каждый кадр поворачиваем героя и сиденье вокруг перекладины */
function swingFrame(now){
  requestAnimationFrame(swingFrame);
  const dt = Math.min(0.05, (now - (SW.last || now))/1000); SW.last = now;
  SW.A += (SW.target - SW.A)*Math.min(1, dt*1.5);
  SW.ph += dt*2*Math.PI/2.3;
  SW.a = SW.A*Math.sin(SW.ph); SW.ai = SW.A*0.9*Math.sin(SW.ph + 1.3);
  const py = beamY();
  for (const [els, a] of [[[emily, seatE], SW.a], [[isabel, seatI], SW.ai]]) for (const h of els){
    if (!h || !h.el) continue; const el = h.el;
    el.style.transformOrigin = `50% ${py - el.offsetTop}px`; el.style.transform = a ? `rotate(${a.toFixed(2)}deg)` : '';
  }
  /* Тео бегает внизу туда-сюда вслед за качелями */
  if (theo && SW.on){
    const x = 0.5 + 0.16*Math.sin(SW.ph*0.5), dir = Math.cos(SW.ph*0.5);
    theo.x = x; theo.place(); theo.face(dir < 0);
    const f = 'run' + (1 + Math.floor(now/120) % 3); if (theo.pose !== f) theo.show(f);
  }
}
/* толчок по нажатию на качели: в нижней точке — выше, не вовремя — просто качается */
function pushTap(e){
  if (!SW.on) return; e.preventDefault();
  if (Math.abs(Math.sin(SW.ph)) < 0.4){ SW.target = Math.min(44, SW.target + 1.5); sfx.whoosh(); }
  else sfx.pop();
}

async function game(){
  setup(); tLayout(); T.bones = 0; $('#purse').hidden = true;
  [tree, bird, cloud].forEach(p => p.el.classList.remove('on'));
  emily.el.style.pointerEvents = 'auto';
  await sleep(300);
  isabel.set('wave'); await isabel.say('i_m4_schaukeln'); isabel.set('idle');
  await T.repeat('e_m4_ja');
  SW.on = true; SW.target = 7; sfx.whoosh(); emily.set('laugh');
  await play('a_m4_zaehl'); await play('r_m4_zaehl');
  for (let i = 1; i <= 10; i++){
    showNum(i); sfx.tone(700 + i*30, 900 + i*30, 160, 'sine', .14);
    for (let a = 0; a < 4; a++){                         /* как при счёте в прятках: образец, образец, «Sag es nach!», русская подсказка */
      if (a === 2) await play('a_nach');
      if (a === 3) await play('r_repeat');
      await play('e_' + i); await sleep(100);
      if (await listen()) break;
    }
    SW.target = 7 + i*3.5; sfx.whoosh();                 /* выше! */
    mark.set(i % 2 ? 'laugh' : 'wave'); mark.el.classList.remove('clap'); void mark.el.offsetWidth; mark.el.classList.add('clap');
    if (i === 3){ tree.el.classList.add('on'); await play('a_m4_baum'); }
    else if (i === 6){ bird.el.classList.add('on'); await play('a_m4_vogel'); }
    else if (i === 9){ cloud.el.classList.add('on'); await play('a_m4_wolke'); }
    else if (i % 2 === 0) await play(i % 4 ? 'i_m4_hoeher' : 'e_m4_hoeher');
    if (i === 5) play('t_bark');
    if (i % 2 === 0) await T.bone(emily);
  }
  hideNum();
  sfx.fanfare(); isabel.set('jump'); mark.set('laugh');
  await Promise.all([play('i_m4_juhu'), play('a_juhu')]);
  SW.target = 0; await sleep(2600);                     /* качели замедляются */
  isabel.set('idle'); await isabel.say('i_m4_spass');
  await emily.say('e_spass');
  SW.on = false; theo.show('happy');
  purse(T.bones); await saveMini(KEY, T.bones);
  await praise();
  $('#again').hidden = false;
}

/* нажатие на Эмили или её сиденье — толчок (перехватываем раньше, чтобы сиденье не тряслось как обычный предмет) */
stage.addEventListener('pointerdown', e => { if (SW.on && (e.target.closest('.char') === emily.el || e.target.closest('.prop') === seatE.el)){ e.stopPropagation(); pushTap(e); } }, true);
addEventListener('resize', tLayout); addEventListener('orientationchange', () => setTimeout(tLayout, 200));
setup(); tLayout();
requestAnimationFrame(swingFrame);
miniStart(IMG.isabel_wave[0], game);
window.__mini = () => ({A: SW.A, target: SW.target, bones: T.bones});
</script>
