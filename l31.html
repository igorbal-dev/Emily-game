/* Уровень 31: Stille Post. Считаем детей в кругу (4). Хайке шепчет слово Абихе, Абиха — Эмили; Эмили шепчет Паулю (T.soft — громко не засчитывается),

   «Aber laut ist lustiger!» — шаг 2 «Nein, Paul. Bei Stiller Post flüstert man. Das ist die Regel.» Третий круг проходит правильно. */
const LEVEL = 31, FRIENDS = ['paul', 'isabel', 'abiha'];
const STICKER = '<svg viewBox="0 0 100 100"><path d="M30 20 Q14 22 14 44 Q14 62 28 66 Q32 80 44 82 Q52 82 52 70 Q52 60 40 54 Q34 44 40 34 Q48 26 40 20 Z" fill="#ffd7b5" stroke="#c9895a" stroke-width="4"/><path d="M62 36 q8 8 0 16 M72 28 q14 16 0 32" fill="none" stroke="#9b6bff" stroke-width="5" stroke-linecap="round"/><path d="M80 80 h12 M86 74 v12" stroke="#9b6bff" stroke-width="4" stroke-linecap="round" opacity=".6"/></svg>';
const RUG = 0.5;
function drawScene(g, W, H, L){ drawKita(g, W, H, L, RUG); }

let emily, abiha, isabel, paul, heike;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'surprised', 'laugh'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'jump', 'laugh', 'sit', 'think'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  heike = T.hero('sommer', {x: 0.1, h: 1.45, poses: ['idle', 'blink', 'talk', 'wave']});
  abiha = T.hero('abiha', {x: 0.3, poses: AP});
  emily = T.hero('emily', {x: 0.46, poses: EP});
  paul = T.hero('paul', {x: 0.62, h: 0.97, poses: KP});
  isabel = T.hero('isabel', {x: 0.78, h: 0.95, poses: KP});
}
/* шёпот от героя к соседу: наклон и тихое «пш-ш» (запись звучит тише — громкость не меняем, только анимация) */
async function whisper(from, to, clip){
  const x0 = from.x; await from.walkTo(to.x + (to.x > from.x ? -0.07 : 0.07), 400); from.face(to.x < from.x);
  sfx.noise(600, 3000, .05); if (clip) await from.say(clip); else await sleep(900);
  to.el.animate([{transform: 'none'}, {transform: 'rotate(-4deg)'}, {transform: 'none'}], {duration: 500});
  await from.walkTo(x0, 400); from.face(false);
}
const laughAll = async () => { emily.set('laugh'); abiha.set('laugh'); isabel.set('jump'); paul.set('jump'); await Promise.all([play('k_laugh'), play('i_hihi'), play('p_hihi')]); [emily, abiha, isabel, paul].forEach(h => h.set('idle')); };

async function story(){
  await play('n31_intro');
  /* сколько детей в кругу */
  await play('n31_zaehl');
  let left = [abiha, emily, paul, isabel];
  for (let i = 1; i <= 4; i++){ const el = await T.tap(left, 'n31_zaehl', 'r_tipp_licht'); const h = left.find(x => x.el === el); left = left.filter(x => x !== h); h.hop(); showNum(i); await emily.say('e_' + i); }
  hideNum(); await play('n31_vier');
  heike.set('talk'); await heike.say('s31_regel'); heike.set('idle');

  /* 1 круг: Эмили шепчет, Изабель путает — смешно */
  await whisper(heike, abiha);
  await whisper(abiha, emily, 'b31_theo');
  await play('n31_jetzt');
  await T.soft('e31_theo', {to: paul});
  await whisper(paul, isabel);
  isabel.set('talk'); await isabel.say('i31_hexe'); isabel.set('idle');
  await laughAll();
  heike.set('talk'); await heike.say('s31_richtig'); heike.set('idle');
  await T.bone(emily);

  /* 2 круг: Пауль кричит */
  await whisper(heike, abiha);
  await whisper(abiha, emily, 'b31_katze');
  await T.soft('e31_katze', {to: paul});
  paul.set('jump'); paul.hop(); sfx.whoosh(); await paul.say('p31_laut'); paul.set('idle');
  abiha.set('think'); await abiha.say('b31_oh'); abiha.set('idle');
  await T.repeat('e31_psst');
  paul.set('talk'); await paul.say('p31_lustig'); paul.set('idle'); paul.hop();
  await play('n24_fester');
  await T.firm('e31_regel', {who: paul, step: 2});
  paul.set('talk'); await paul.say('p31_okay'); paul.set('idle');
  await paul.walkTo(0.62, 400);
  await T.bone(paul);

  /* 3 круг: правильно */
  heike.set('talk'); await heike.say('s31_neu'); heike.set('idle');
  await whisper(heike, abiha);
  await whisper(abiha, emily, 'b31_mond');
  await T.soft('e31_mond', {to: paul});
  await whisper(paul, isabel);
  isabel.set('jump'); isabel.hop(); await isabel.say('i31_mond'); isabel.set('idle');
  heike.set('wave'); await heike.say('s31_super'); heike.set('idle'); sfx.fanfare();
  T.hearts(emily); await T.bone(emily);
  [emily, abiha, isabel, paul].forEach(h => h.set('jump')); await play('n31_ende');
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
}
T.start(IMG.abiha_peace[0], setup);
setup();
</script>
