<script>
/* Уровень 19: площадка. Леон кидает песок — Эмили выставляет ладонь и кричит «Stopp! Das mag ich nicht!» (чем громче, тем дальше он отшатывается),

   Леон отбирает мяч у Марка — «Lass meinen Bruder in Ruhe!». Леон ломает замок: три карточки, плакать — не помогает. */
const LEVEL = 19, FRIENDS = ['leon'];
const STICKER = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff" stroke="#ff5a5a" stroke-width="6"/><path d="M36 74 V40 a5 5 0 0 1 10 0 V30 a5 5 0 0 1 10 0 V34 a5 5 0 0 1 10 0 V44 a5 5 0 0 1 10 0 V62 Q76 80 58 84 H48 Q38 82 36 74 Z" fill="#ffd7b5" stroke="#c9895a" stroke-width="3" stroke-linejoin="round"/><path d="M36 58 Q26 52 24 44 Q30 40 36 48" fill="#ffd7b5" stroke="#c9895a" stroke-width="3" stroke-linejoin="round"/></svg>';
const SBX = 0.3, PDX = 0.64;                    /* песочница и лужа */
function drawScene(g, W, H, L){
  const fy = L.floorY, hE = L.hE, hz = H*0.55;
  let gr = g.createLinearGradient(0, 0, 0, hz); gr.addColorStop(0, '#8fd3ff'); gr.addColorStop(1, '#e4f6ff'); g.fillStyle = gr; g.fillRect(0, 0, W, hz);
  g.fillStyle = '#fff3a8'; g.beginPath(); g.arc(W*0.9, H*0.13, hE*0.15, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.9)'; for (const [cx, cy, r] of [[0.2, 0.12, 0.08], [0.58, 0.09, 0.06]]){ g.beginPath(); g.ellipse(W*cx, H*cy, hE*r*2, hE*r, 0, 0, 7); g.fill(); }
  for (let i = 0; i < 9; i++){ const tx = W*(i/8), r = hE*(0.18 + (i % 3)*0.05); g.fillStyle = i % 2 ? '#5fae4a' : '#4f9e3e'; g.beginPath(); g.arc(tx, hz - r*0.4, r, 0, 7); g.fill(); }
  /* горка вдали справа */
  g.lineCap = 'round'; g.strokeStyle = '#2f80ed'; g.lineWidth = hE*0.03; const sx = W*0.86, sy = hz - hE*0.05;
  g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx, sy - hE*0.6); g.stroke(); g.beginPath(); g.moveTo(sx + hE*0.12, sy); g.lineTo(sx + hE*0.12, sy - hE*0.6); g.stroke();
  g.strokeStyle = '#ff7a59'; g.lineWidth = hE*0.07; g.beginPath(); g.moveTo(sx + hE*0.06, sy - hE*0.55); g.quadraticCurveTo(sx - hE*0.2, sy - hE*0.3, sx - hE*0.5, sy); g.stroke();
  gr = g.createLinearGradient(0, hz, 0, H); gr.addColorStop(0, '#a6dd78'); gr.addColorStop(1, '#7cc35a'); g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
  /* песочница */
  const bx = W*SBX, bw = hE*0.95;
  g.fillStyle = '#f3d79a'; g.beginPath(); g.ellipse(bx, fy + hE*0.02, bw, hE*0.13, 0, 0, 7); g.fill();
  g.strokeStyle = '#b07b3c'; g.lineWidth = hE*0.05; g.beginPath(); g.ellipse(bx, fy + hE*0.02, bw, hE*0.13, 0, 0, 7); g.stroke();
  /* большая грязная лужа */
  const px = W*PDX; g.fillStyle = '#8a6038'; g.beginPath(); g.ellipse(px, fy + hE*0.03, hE*0.62, hE*0.11, 0, 0, 7); g.fill();
  g.fillStyle = '#6e4a2a'; g.beginPath(); g.ellipse(px + hE*0.05, fy + hE*0.04, hE*0.45, hE*0.07, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(px - hE*0.2, fy, hE*0.14, hE*0.025, 0, 0, 7); g.fill();
}

const CASTLE = '<svg viewBox="0 0 100 80"><path d="M10 78 Q50 70 90 78 V48 H10 Z" fill="#e8c27a" stroke="#b9904a" stroke-width="3"/><path d="M22 50 V26 h14 v24 M64 50 V26 h14 v24 M40 50 V12 h20 v38" fill="#f0cf8a" stroke="#b9904a" stroke-width="3" stroke-linejoin="round"/><path d="M50 12 V0 l12 5 l-12 5" fill="#ff7a59" stroke="#d65a3b" stroke-width="2"/><circle cx="50" cy="32" r="4" fill="#b9904a"/></svg>';
const TOWER = '<svg viewBox="0 0 60 80"><path d="M8 78 Q30 72 52 78 V30 H8 Z" fill="#e8c27a" stroke="#b9904a" stroke-width="3"/><path d="M8 30 v-8 h9 v6 h8 v-6 h10 v6 h8 v-6 h9 v8 z" fill="#f0cf8a" stroke="#b9904a" stroke-width="3" stroke-linejoin="round"/><path d="M30 22 V4 l14 5 l-14 5" fill="#2f80ed" stroke="#1f5fb0" stroke-width="2"/></svg>';
const FLAT = '<svg viewBox="0 0 100 80"><path d="M4 78 Q20 62 40 66 Q60 58 78 66 Q92 66 96 78 Z" fill="#e8c27a" stroke="#b9904a" stroke-width="3"/><path d="M60 60 l12 -4 l-2 8" fill="#ff7a59" stroke="#d65a3b" stroke-width="2"/></svg>';
const BALL = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#ffd34d" stroke="#d6a21e" stroke-width="5"/><path d="M8 40 Q50 60 92 40 M50 4 Q30 50 50 96" fill="none" stroke="#ff7a59" stroke-width="7"/></svg>';

let emily, leon, isabel, paul, mark, theo, heike, castle, tower, ball;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'crouch', 'laugh', 'walk'];
const LP = ['idle', 'blink', 'talk', 'wave', 'jump', 'laugh', 'sad', 'throw', 'mud', 'mudsad', 'sly', 'shy', 'oh'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  castle = T.prop(CASTLE, {x: SBX + 0.06, py: () => L.floorY + L.hE*0.05, w: 0.5, ratio: 0.8, z: 38});
  tower = T.prop(TOWER, {x: SBX - 0.12, py: () => L.floorY + L.hE*0.06, w: 0.3, ratio: 80/60, z: 38}); tower.el.hidden = true;
  ball = T.prop(BALL, {x: 0.08, py: () => L.floorY, w: 0.2, z: 52});
  isabel = T.hero('isabel', {x: 0.84, d: 0.5, h: 0.92, poses: ['idle', 'blink', 'talk', 'wave', 'jump']});
  paul = T.hero('paul', {x: 0.94, d: 0.5, h: 0.95, poses: ['idle', 'blink', 'talk', 'wave', 'jump']});
  mark = T.hero('mark', {x: 0.14, h: 0.62, outfit: 'out', poses: ['idle', 'blink', 'laugh', 'wave', 'talk', 'sad', 'walk']});
  theo = T.hero('theo', {x: 0.04, h: 0.48, poses: ['idle', 'blink', 'happy', 'bark']});
  heike = T.hero('sommer', {x: -0.2, h: 1.5, poses: ['idle', 'blink', 'talk', 'wave']});
  leon = T.hero('leon', {x: 1.15, h: 1.02, poses: LP});
  emily = T.hero('emily', {x: SBX - 0.02, outfit: 'out', poses: EP}); emily.set('crouch');
}
/* Эмили выставляет ладонь и говорит громко: пока говорит, Леон отшатывается тем сильнее, чем громче голос */
async function loud(model){
  emily.set('wave');
  const stop = T.loudness(v => { leon.el.style.translate = `${(v*L.hE*0.09).toFixed(1)}px 0`; if (v > 1.2) leon.show('oh'); });
  await T.repeat(model);
  const max = stop(); leon.el.style.translate = '';
  leon.set('oh'); sfx.whoosh(); await T.glide(leon, Math.min(0.92, leon.x + 0.05 + Math.min(0.14, max*0.05)), 0, 450, 'ease-out');
  emily.set('idle');
}
async function laughAll(){
  emily.set('laugh'); isabel.set('jump'); paul.set('jump'); mark.set('laugh');
  await Promise.all([play('k_laugh'), play('i_hihi'), play('p_hihi')]);
  mark.set('wave'); await mark.say('k19_hihi');                       /* Марк показывает пальцем и хихикает */
  mark.set('laugh'); await sleep(500);
}
const resetAll = () => { emily.set('idle'); isabel.set('idle'); paul.set('idle'); mark.set('idle'); };
const cardsPuddle = () => [
  {parts: [{img: 'emily_jump_out', x: 22, h: 66, b: 22}, {img: 'leon_sly', x: 66, h: 70}, {fx: 'zap', x: 32, y: 40}], clip: 'n19_opt_weg', bg: '#e8f6ff', ground: '#bde3a0'},
  {parts: [{img: 'emily_wave_out', x: 40, h: 72}, {img: 'leon_oh', x: 66, h: 70, rot: 12}, {fx: 'zap', x: 46, y: 36}], clip: 'n19_opt_zurueck', bg: '#e8f6ff', ground: '#bde3a0'},
  {parts: [{img: 'emily_blink_out', x: 40, h: 72}, {img: 'leon_sly', x: 72, h: 70}], clip: 'n19_opt_augen', bg: '#e8f6ff', ground: '#bde3a0'}];
const cardsCastle = () => [
  {parts: [{img: 'emily_jump_out', x: 34, h: 70}, {svg: FLAT, x: 70, y: 66, w: 40, hh: 26}, {img: 'leon_sad', x: 76, h: 56}], clip: 'n19_opt_kaputt', bg: '#fff8e8', ground: '#f3d79a'},
  {parts: [{img: 'emily_wave_out', x: 30, h: 66}, {img: 'sommer_wave', x: 70, h: 86}], clip: 'n19_opt_heike', bg: '#fff8e8', ground: '#f3d79a'},
  {parts: [{img: 'emily_crouch_out', x: 40, h: 52}, {fx: 'tears', x: 40, y: 44}, {img: 'leon_laugh', x: 74, h: 70}], clip: 'n19_opt_weinen', bg: '#fff8e8', ground: '#f3d79a'}];

async function story(){
  /* 1. песок: громкое «Stopp!» */
  await play('n19_intro');
  await leon.walkTo(SBX + 0.26, 1300);
  leon.set('throw'); sfx.noise(300, 900, .3); await T.burst(leon, emily); emily.set('surprised'); leon.set('sly');
  await play('n19_sand');
  await play('n19_stopp_tipp'); await play('r19_stopp');
  await loud('e19_stopp');
  leon.set('sly'); await sleep(500);
  await T.glide(leon, SBX + 0.26, 0, 500);
  leon.set('throw'); sfx.noise(300, 900, .3); await T.burst(leon, emily); emily.set('surprised'); leon.set('sly');
  await loud('e19_hoer_auf');
  leon.set('shy'); await leon.say('l19_okay'); leon.set('idle');
  await T.bone(emily);

  /* 2. лужа: Леон разбегается — сцена замирает, три карточки */
  await emily.walkTo(PDX - 0.17);
  leon.x = 0.94; leon.place();
  while (true){
    leon.set('sly'); await leon.say('l19_schubse');
    leon.el.classList.add('walking'); await T.glide(leon, PDX + 0.18, 0, 500, 'ease-in'); leon.el.classList.remove('walking');
    const i = await T.choose(cardsPuddle(), 'n19_was', 'r19_was');
    if (i === 0){
      /* отойти: Леон проносится мимо и плюхается в грязь — все хохочут */
      emily.set('jump'); await T.glide(emily, PDX - 0.32, 0.25, 280, 'ease-out'); T.glide(emily, PDX - 0.32, 0, 250, 'ease-in');
      leon.el.classList.add('walking'); await T.glide(leon, PDX, 0, 500, 'ease-in'); leon.el.classList.remove('walking');
      sfx.noise(500, 400, .6); T.burst([L.W*PDX, L.floorY], null, '#7a5230', 22); leon.set('mudsad'); emily.set('idle');
      await play('n19_platsch');
      await laughAll();
      await sleep(700); leon.set('mud'); await leon.say('l19_igitt');
      break;
    }
    if (i === 1){
      /* толкнуть в ответ: оба плюхаются в лужу */
      T.glide(emily, PDX - 0.05, 0, 400, 'ease-in'); await T.glide(leon, PDX + 0.05, 0, 400, 'ease-in');
      sfx.noise(600, 400, .7); T.burst([L.W*PDX, L.floorY], null, '#7a5230', 26); T.mud(emily, true); leon.set('mudsad'); emily.set('surprised');
      await sleep(500); await play('n19_beide');
      leon.set('mud'); await laughAll();
      break;
    }
    /* зажмуриться: Леон толкает — «Nicht schubsen!» и всё сначала */
    emily.set('blink'); await T.glide(leon, PDX - 0.06, 0, 300, 'ease-in'); sfx.bonk();
    emily.set('surprised'); await emily.el.animate([{transform: 'rotate(0)'}, {transform: 'rotate(-14deg)'}, {transform: 'rotate(0)'}], {duration: 600}).finished.catch(() => {});
    await T.repeat('e19_nicht_schubsen');
    leon.set('idle'); await T.glide(leon, 0.94, 0, 600); emily.set('idle');
    await play('n19_noch_mal');
  }
  await T.bone(emily);
  /* все отмылись — играем дальше */
  await T.go('play', () => { T.mud(emily, false); leon.set('idle'); resetAll(); emily.x = 0.4; leon.x = 0.7; mark.x = 0.14; });

  /* 3. Леон отбирает мяч у Марка — Эмили защищает брата */
  mark.set('laugh'); await T.move(ball, 0.2, 0, 500); await T.move(ball, 0.1, 0, 500); mark.set('idle');
  leon.set('sly'); await leon.walkTo(0.22, 1000);
  await T.move(ball, 0.27, 0, 300); ball.o.py = () => L.floorY - L.hE*0.35; ball.place();
  await leon.say('l19_meins'); await leon.walkTo(0.34, 600); leon.face(true);
  mark.set('sad'); T.tears(mark, true); await mark.say('k19_ball');
  await play('n19_mark');
  await emily.walkTo(0.24, 700); emily.face(false);
  await loud('e19_bruder');
  leon.set('shy'); await leon.say('l19_hier');
  ball.o.py = () => L.floorY; await T.move(ball, 0.12, 0, 600);
  T.tears(mark, false); mark.set('laugh'); T.hearts(mark); await praise(); mark.set('idle');
  await T.bone(mark);

  /* 4. Леон ломает замок Эмили: три карточки, плакать не помогает */
  tower.el.hidden = false; tower.el.innerHTML = TOWER; castle.el.innerHTML = CASTLE;
  await T.go('sand', () => { emily.x = SBX - 0.04; leon.x = SBX - 0.2; leon.face(false); });
  emily.set('crouch'); await sleep(600);
  leon.set('sly'); await leon.walkTo(SBX + 0.06, 700); leon.hop(); sfx.bonk(); castle.el.innerHTML = FLAT; T.burst(castle, null, '#e8c27a', 12);
  emily.set('surprised'); leon.set('laugh'); await leon.say('l19_haha');
  while (true){
    const i = await T.choose(cardsCastle(), 'n19_was', 'r19_was');
    if (i === 0){
      await emily.walkTo(SBX - 0.12, 600); emily.set('jump'); emily.hop(); sfx.bonk(); tower.el.innerHTML = FLAT; T.burst(tower, null, '#e8c27a', 12);
      leon.set('sad'); await leon.say('l19_meine_burg');
      emily.set('idle'); await T.repeat('e19_siehst');
      leon.set('shy'); await leon.say('l19_ok_entschuldigung');
      break;
    }
    if (i === 1){
      emily.set('wave'); await T.repeat('e19_heike'); emily.set('idle');
      await heike.walkTo(0.12, 1200);
      await heike.say('s19_sag');
      leon.set('shy'); await leon.say('l19_entschuldigung');
      break;
    }
    /* сесть и плакать: Леон смеётся и ломает дальше */
    emily.set('crouch'); T.tears(emily, true);
    leon.set('laugh'); leon.hop(); sfx.bonk(); T.burst(castle, null, '#e8c27a', 10); await leon.say('l19_haha');
    await play('n19_weinen'); T.tears(emily, false); emily.set('idle');
  }
  await T.repeat('e19_nicht_mehr');
  leon.set('shy'); await leon.say('l19_mach_nicht');
  await T.bone(leon);
