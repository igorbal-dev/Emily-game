/* Комната во весь экран: сзади у стены укрытия (шкаф, диван, стол, коробка), спереди герои и миска Тео. */
:root{
  --accent:#ff7a59; --ink:#3b2a1f; --mic:#2f80ed; --ok:#32b67a; --night:rgba(28,20,60,.72);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#9fdc6c;color:var(--ink)}
body{font-family:"Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#9fdc6c}
#bg{position:absolute;left:0;top:0;display:block}
.char{position:absolute;cursor:pointer}
.char .body{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.char img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.char .shadow{position:absolute;left:10%;right:10%;bottom:-4%;height:8%;border-radius:50%;background:rgba(80,40,10,.18)}
.inspot .shadow{display:none}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
.hop{animation:hop .7s cubic-bezier(.3,.7,.4,1) !important}
@keyframes hop{0%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.06,.92)}45%{transform:translateY(-22%) scale(.97,1.04)}75%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1)}}
.squish{animation:squish .35s ease-out !important}
@keyframes squish{0%{transform:scale(1)}40%{transform:scale(1.07,.93)}100%{transform:scale(1)}}
.wiggle{animation:wiggle .5s ease-in-out 2 !important}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
/* укрытия */
.sback,.sfront{position:absolute;pointer-events:none}
.sfront{pointer-events:auto;cursor:pointer;transform-origin:50% 100%}
.sfront svg,.sback svg,.door svg{width:100%;height:100%;display:block;overflow:visible}
.holder{position:absolute;left:0;top:0;overflow:hidden;pointer-events:none}
.holder .char{pointer-events:none}
.door{position:absolute;transition:transform .45s cubic-bezier(.3,.8,.4,1)}
.shake{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4%) rotate(-1.5deg)}40%{transform:translateX(4%) rotate(1.5deg)}60%{transform:translateX(-3%)}80%{transform:translateX(2%)}}
.glow{filter:drop-shadow(0 0 6px #fff36b) drop-shadow(0 0 14px #ffd84d);animation:glowp 1s ease-in-out infinite}
@keyframes glowp{0%,100%{filter:drop-shadow(0 0 4px #fff36b) drop-shadow(0 0 10px #ffd84d)}50%{filter:drop-shadow(0 0 10px #fff36b) drop-shadow(0 0 22px #ffd84d)}}
#dark{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none;transition:opacity .8s;z-index:45}
#dark.on{opacity:1}
#bowl{position:absolute;z-index:52}
.bone{position:absolute;pointer-events:none;z-index:55}
.bone svg,#bowl svg{width:100%;height:100%;display:block;overflow:visible}
.bone.glowb{animation:glowb .7s ease-out forwards}
@keyframes glowb{0%{transform:scale(1)}40%{transform:scale(1.6) translateY(-30%);filter:drop-shadow(0 0 8px #fff36b)}100%{transform:scale(1.25) translateY(-10%);filter:drop-shadow(0 0 6px #fff36b)}}
/* счёт */
#count{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#num{font:800 clamp(64px,16vh,140px)/1 "Trebuchet MS",system-ui,sans-serif;color:#fff;text-shadow:0 6px 0 #d65a3b,0 0 30px rgba(255,216,77,.9)}
#num.pop{animation:numpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes numpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:80vw}
#dots i{width:clamp(14px,3vh,24px);height:clamp(14px,3vh,24px);border-radius:50%;background:#ffd84d;box-shadow:0 0 10px #ffd84d}
/* микрофон */
#mic{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px));
  width:96px;height:96px;border-radius:50%;border:0;background:var(--mic);color:#fff;

#mic svg{width:46px;height:46px}
#mic.on{animation:pulse 1.2s ease-out infinite}
#mic.heard{background:var(--ok);box-shadow:0 6px 0 #1f8a5a}
@keyframes pulse{0%{box-shadow:0 6px 0 #1d5fb8,0 0 0 0 rgba(47,128,237,.55)}100%{box-shadow:0 6px 0 #1d5fb8,0 0 0 28px rgba(47,128,237,0)}}
#level{position:absolute;inset:-10px;border-radius:50%;border:6px solid rgba(255,255,255,.9);transform:scale(.9);opacity:0;pointer-events:none}
#start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(205,238,255,.75);z-index:90}
#go{position:relative;width:min(56vw,56vh,260px);height:min(56vw,56vh,260px);border-radius:50%;border:10px solid #fff;
  background:#fff center 8%/150% auto no-repeat;box-shadow:0 10px 0 #e2b98a;cursor:pointer;animation:bob 1.8s ease-in-out infinite;padding:0}
#go .play{position:absolute;right:-6%;bottom:-6%;width:34%;height:34%;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 5px 0 #d65a3b}
#go .play svg{width:46%;height:46%;margin-left:8%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#again{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;
  border:0;background:var(--accent);box-shadow:0 6px 0 #d65a3b;display:grid;place-items:center;cursor:pointer;z-index:85;animation:bob 1.8s ease-in-out infinite}
#again svg{width:60px;height:60px}
#rotate{position:absolute;inset:0;z-index:95;background:#cdeeff;display:grid;place-items:center}
#rotate svg{width:min(50vw,220px);height:auto;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#cards{position:absolute;inset:0;z-index:72;display:flex;gap:4vw;align-items:center;justify-content:center;background:rgba(255,255,255,.35);transition:transform .6s ease-in,opacity .6s}
#cards.away{transform:translate(-40vw,-40vh) scale(.2);opacity:0}
.card{position:relative;width:min(24vw,36vh);aspect-ratio:3/4;max-width:100%;border-radius:18px;background:#fff7ec;border:6px solid #ffd84d;box-shadow:0 8px 0 #e2b98a;display:grid;place-items:end center;overflow:hidden;animation:numpop .5s cubic-bezier(.3,1.6,.5,1)}
.card img{height:92%;max-width:none}
.card i{position:absolute;top:6px;right:10px;font-style:normal;font-size:min(6vw,8vh);color:#ffb02e}
.prop,.tower,.cake{position:absolute}
.prop svg,.cake svg,#choice svg{width:100%;height:100%;display:block;overflow:visible}
#pile,.tower{cursor:pointer}.tower{z-index:37}.cake{z-index:36;pointer-events:none}
#choice{position:absolute;inset:0;z-index:70;display:flex;gap:8vw;align-items:center;justify-content:center;background:rgba(255,255,255,.4)}
#choice button{width:min(28vw,40vh);height:min(28vw,40vh);border-radius:50%;border:0;background:none;padding:0;cursor:pointer;animation:bob 1.8s ease-in-out infinite}
#choice button:nth-child(2){animation-delay:.9s}
[data-name=paul] .shadow{display:none}
button:focus-visible{outline:4px solid #fff;outline-offset:4px}
.confetti{position:absolute;width:12px;height:18px;border-radius:3px;pointer-events:none;z-index:75}
@media (prefers-reduced-motion:reduce){.char .body{animation:none}#go,#again{animation:none}}
.held svg{width:100%;height:100%;display:block;overflow:visible}

</style>

function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
function blob(g, x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill(); }
function drawRoom(){
  const {W, H, floorY, hE, hz} = L;
  const c = $('#bg'), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); c.style.width = W+'px'; c.style.height = H+'px';
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const lw = Math.max(2, hE*0.01);
  /* небо */
  const sky = g.createLinearGradient(0, 0, 0, hz); sky.addColorStop(0, '#7cc6ff'); sky.addColorStop(1, '#cdeeff');
  g.fillStyle = sky; g.fillRect(0, 0, W, hz + 2);
  g.fillStyle = '#ffd84d'; blob(g, W*0.12, hz*0.22, hE*0.13);
  g.fillStyle = 'rgba(255,216,77,.3)'; blob(g, W*0.12, hz*0.22, hE*0.2);
  g.fillStyle = '#fff';
  for (const [cx, cy, s] of [[0.32, 0.18, 1], [0.58, 0.1, 0.8], [0.84, 0.22, 1.1]]){
    const x = W*cx, y = hz*cy, r = hE*0.07*s; blob(g, x, y, r); blob(g, x + r*1.1, y - r*0.55, r*1.2); blob(g, x + r*2.3, y, r); g.fillRect(x, y, r*2.3, r);
  }
  /* дальние холмы и деревья */
  g.fillStyle = '#a6dd84';
  g.beginPath(); g.moveTo(0, hz); for (let x = 0; x <= W; x += W/8) g.quadraticCurveTo(x + W/16, hz - hE*0.25, x + W/8, hz); g.closePath(); g.fill();
  for (let i = 0; i < 9; i++){
    const x = W*(0.04 + i*0.12), y = hz - hE*0.06;
    g.fillStyle = '#8a5a33'; g.fillRect(x - hE*0.012, y - hE*0.05, hE*0.024, hE*0.08);
    g.fillStyle = i % 2 ? '#7cc95e' : '#6bbd50'; blob(g, x, y - hE*0.1, hE*0.08);
  }

  g.strokeStyle = '#d7ad7e'; g.fillStyle = '#fff7ec'; g.lineWidth = lw*0.7;
  const fh = hE*0.13, fw = hE*0.07;
  g.fillRect(0, hz - fh*0.7, W, fh*0.12); g.fillRect(0, hz - fh*0.35, W, fh*0.12);
  for (let x = fw*0.3; x < W; x += fw*1.4){
    g.beginPath(); g.moveTo(x, hz); g.lineTo(x, hz - fh*0.85); g.lineTo(x + fw*0.5, hz - fh); g.lineTo(x + fw, hz - fh*0.85); g.lineTo(x + fw, hz); g.closePath(); g.fill(); g.stroke();
  }
  /* трава */
  const gr = g.createLinearGradient(0, hz, 0, H); gr.addColorStop(0, '#9fdc6c'); gr.addColorStop(1, '#6fbf4f');
  g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = hE*0.12;
  for (let i = 0; i < 6; i++){ const y = hz + (H - hz)*(0.1 + i*0.18); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y + hE*0.05); g.stroke(); }
  /* травинки и цветочки */
  g.lineWidth = lw*0.7;
  for (let i = 0; i < 70; i++){
    const x = (i*137.5 % 1) * W + ((i*53) % W), y = hz + ((i*71) % 100)/100*(H - hz);

    g.strokeStyle = '#5aa83f'; g.beginPath(); g.moveTo(xx, y); g.lineTo(xx - lw, y - lw*3); g.moveTo(xx, y); g.lineTo(xx + lw, y - lw*3); g.stroke();
    if (i % 7 === 0){ g.fillStyle = ['#fff', '#ffd84d', '#ff9fb4'][i % 3]; blob(g, xx, y - lw*3.5, lw*1.3); }
  }
  /* дорожка спереди */
  g.fillStyle = '#f2d9a8'; g.strokeStyle = '#d9b77a'; g.lineWidth = lw;
  g.beginPath(); g.ellipse(W*0.24, floorY + hE*0.02, W*0.24, Math.max(hE*0.1, 18), 0, 0, Math.PI*2); g.fill(); g.stroke();
}

function layout(){
  const W = stage.clientWidth, H = stage.clientHeight;
  $('#rotate').hidden = !(H > W*1.05);
  const hE = Math.min(H*0.52, W*0.24);
  const floorY = H*0.95 - hE*0.05;
  const hz = floorY - hE*0.95;
  const backY = hz + (floorY - hz)*0.32;
  L = {W, H, hE, floorY, hz, backY};
  layoutSpots();
  drawRoom();
  for (const h of Object.values(heroes)) placeHero(h);
  layoutSand();
  heroes.paul.put(L.box.x + L.box.w*0.78, L.box.y + L.box.h*0.75, 1);
  const bw = hE*0.3; L.bowl = {x: W*0.775 - bw/2, y: floorY - bw*0.5, w: bw, h: bw*0.5};
  Object.assign($('#bowl').style, {left:L.bowl.x+'px', top:L.bowl.y+'px', width:bw+'px', height:bw*0.5+'px'});

/* ---------- Косточки ---------- */
let bones = [];

function boneSlot(i){ const s = boneSize(); return {x: L.bowl.x + L.bowl.w*(0.22 + i*0.28) - s/2, y: L.bowl.y - s*0.15 - (i===1 ? s*0.12 : 0), r: [-18,8,22][i]}; }
function placeBone(b, i){ const s = boneSize(), p = boneSlot(i);
  Object.assign(b.style, {left:p.x+'px', top:p.y+'px', width:s+'px', height:s*0.44+'px', transform:`rotate(${p.r}deg)`}); }
async function flyBone(fromHero){
  const i = bones.length, b = document.createElement('div'); b.className = 'bone'; b.innerHTML = BONE_SVG;
  stage.appendChild(b); bones.push(b); placeBone(b, i);
  const s = boneSize(), p = boneSlot(i), r = fromHero.el.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const sx = r.left - st.left + r.width/2 - s/2 - p.x, sy = r.top - st.top + r.height*0.3 - p.y;

    {transform:`translate(0,0) rotate(${360+p.r}deg) scale(1)`}

}

    if (!actx) return; const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t+ms/1000);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+ms/1000);

  whoosh(){ this.tone(300, 1200, 400, 'sine', .08); },

function b64ToBytes(uri){ const s = atob(uri.split(',')[1]); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; }
function decode(ab){ return new Promise((res, rej) => { const p = actx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }); }
async function loadSounds(){ await Promise.all(Object.entries(SND).map(async ([k, uri]) => { try { BUF[k] = await decode(await (await fetch(uri)).arrayBuffer()); } catch(e){} })); }
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function tts(text, who){
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)){ setTimeout(resolve, 500 + text.length*60); return; }
    const lang = who === 'r' ? 'ru-RU' : 'de-DE';
    const u = new SpeechSynthesisUtterance(text); u.lang = lang;
    const v = voices.find(v => v.lang && v.lang.replace('_','-').toLowerCase() === lang.toLowerCase()) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2)));
    if (v) u.voice = v;
    u.rate = who === 'r' ? 0.95 : 0.85; u.pitch = who === 'e' ? 1.5 : who === 'k' ? 1.8 : who === 'i' ? 1.4 : who === 'p' ? 1.25 : 1.15;

async function play(name){

        let done = false; const fin = () => { if (!done){ done = true; resolve(); } };
        s.onended = fin; setTimeout(fin, b.duration*1000 + 400); s.start();

}

/* ---------- Микрофон ---------- */
let mic = null;
const micBtn = $('#mic'), levelRing = $('#level');
let micTapResolve = null;
micBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (micTapResolve) micTapResolve(true); });
async function setupMic(){
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    const src = actx.createMediaStreamSource(stream), an = actx.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    mic = {analyser:an, buf:new Float32Array(an.fftSize)};
  } catch(e){ mic = null; }
}
function rms(){ mic.analyser.getFloatTimeDomainData(mic.buf); let s = 0; for (const x of mic.buf) s += x*x; return Math.sqrt(s/mic.buf.length); }
function listen(ms=6000){
  return new Promise(resolve => {
    micBtn.hidden = false; micBtn.classList.remove('heard'); micBtn.classList.add('on');
    let finished = false;
    const end = ok => { if (finished) return; finished = true; micTapResolve = null; micBtn.classList.remove('on');
      levelRing.style.opacity = 0;
      if (ok){ micBtn.classList.add('heard'); sfx.ding(); setTimeout(() => { if (!micTapResolve){ micBtn.hidden = true; } micBtn.classList.remove('heard'); }, 600); }
      else micBtn.hidden = true;
      resolve(ok); };
    micTapResolve = end;
    if (!mic){ setTimeout(() => end(false), ms + 2000); return; }
    if (actx.state !== 'running') actx.resume();
    const t0 = performance.now(); let floor = 0.01, n = 0, voiced = 0, last = t0;
    const tick = now => {
      if (finished) return;
      const r = rms(), dt = now - last; last = now;
      if (now - t0 < 350){ floor = (floor*n + r)/(n+1); n++; }
      const thr = Math.max(0.03, floor*2.5 + 0.012);
      levelRing.style.opacity = Math.min(1, r/thr); levelRing.style.transform = `scale(${0.95 + Math.min(0.5, r*4)})`;
      if (now - t0 > 350 && r > thr) voiced += dt; else voiced = Math.max(0, voiced - dt*0.3);
      if (voiced > 380) return end(true);
      if (now - t0 > ms) return end(false);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* Эмили-мультяшка говорит образец, настоящая Эмили повторяет.
   Игра ждёт: образец, ещё раз образец, «Sag es nach!» + образец, русская подсказка + образец, и снова по кругу. */
async function repeatAfter(model, speaker){
  const say = () => speaker ? speaker.talkWhile(play(model), speaker.name === 'emily' ? 'hold' : 'talk') : play(model);
  for (let i = 0; i < 4; i++){
    const c = i % 4;
    /* 1-й и 2-й раз просто фраза, 3-й раз «Sag es nach!» + фраза, 4-й раз русская подсказка + фраза */
    if (c === 2) await play('a_nach');
    if (c === 3) await play('r_like_emily');
    await say();
    await sleep(150);
    if (await listen()) return true;
  }
  return false;
}
/* Счёт: число загорается и звучит, Эмили повторяет, только потом следующее */
async function countTo(n, voice, speaker){
  const box = $('#count'), num = $('#num'), dots = $('#dots');
  box.hidden = false; dots.innerHTML = '';
  for (let i = 1; i <= n; i++){
    num.textContent = i; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
    const d = document.createElement('i'); dots.appendChild(d); sfx.pop();
    for (let a = 0; a < 4; a++){
      const c = a % 4;
      if (c === 2) await play('a_nach');
      if (c === 3) await play('r_repeat');
      if (speaker) await speaker.talkWhile(play(voice + i), 'talk'); else await play(voice + i);
      await sleep(100);
      if (await listen(5000)) break;
    }
  }
  await sleep(300); box.hidden = true;
}

const mk = (id, html, z, cls) => { const d = document.createElement('div'); d.id = id; d.className = cls || 'prop'; d.innerHTML = html; d.style.zIndex = z; stage.appendChild(d); return d; };

const towers = {emily: [], paul: []};
const towerEl = {emily: mk('tower_emily', '', 35, 'tower'), paul: mk('tower_paul', '', 35, 'tower')};
function layoutSand(){
  const {W, hE, floorY} = L;
  const bH = hE*0.36, bW = W*0.46, bX = W*0.29, bBase = floorY - hE*0.02;
  L.box = {x: bX, y: bBase - bH, w: bW, h: bH, base: bBase};
  Object.assign(box.style, {left:bX+'px', top:(bBase - bH)+'px', width:bW+'px', height:bH+'px'});
  const ps = hE*0.3; Object.assign(pile.style, {left:(bX + bW*0.06)+'px', top:(bBase - bH - ps*0.35)+'px', width:ps+'px', height:ps*0.55+'px'});
  const ss = hE*0.22; Object.assign(shovel.style, {left:(bX + bW*0.8)+'px', top:(bBase - bH - ss*0.85)+'px', width:ss*0.5+'px', height:ss+'px'});
  Object.assign(bucket.style, {left:(bX + bW*0.88)+'px', top:(bBase - bH - ss*0.55)+'px', width:ss*0.6+'px', height:ss*0.6+'px'});
  const cw = bW*0.52; Object.assign(castle.style, {left:(bX + bW*0.02)+'px', top:(bBase - bH - cw*0.5)+'px', width:cw+'px', height:cw*0.55+'px'});
  for (const who of ['emily', 'paul']){
    /* ряд куличиков: у Эмили спереди слева, у Пауля сзади справа */
    const s = hE*0.2, x = bX + bW*(who === 'emily' ? 0.16 : 0.5), y = bBase - bH*(who === 'emily' ? 0.38 : 0.86);
    L['t_' + who] = {x, y, s};
    Object.assign(towerEl[who].style, {left:(x - s*0.2)+'px', top:(y - s*1.1)+'px', width:(s*4.9)+'px', height:(s*1.3)+'px'});
    towers[who].forEach((el, i) => placeCake(el, who, i));
  }
}
function placeCake(el, who, i){
  const t = L['t_' + who]; Object.assign(el.style, {left:(t.x + i*t.s*1.12)+'px', top:(t.y - t.s*0.75)+'px', width:t.s+'px', height:t.s*0.75+'px', zIndex: who === 'emily' ? 36 : 34});
}
function addCake(who){
  const el = document.createElement('div'); el.className = 'cake'; el.innerHTML = ART.sandcake; stage.appendChild(el);
  towers[who].push(el); placeCake(el, who, towers[who].length - 1);
  el.animate([{transform:'translateY(-40%) scale(.6)', opacity:0}, {transform:'none', opacity:1}], {duration:300, easing:'cubic-bezier(.3,1.6,.5,1)'});
  sfx.pop();
}
function clearTowers(){ for (const w of ['emily', 'paul']){ towers[w].forEach(e => e.remove()); towers[w] = []; } }

/* ожидание нажатий */
let mode = null, want = 0, waitR = null;
pile.addEventListener('pointerdown', async e => {
  e.preventDefault();
  if (mode !== 'pile' || towers.emily.length >= want){ sfx.bonk(); return; }
  addCake('emily'); bumpN(towers.emily.length);
  await play('e_' + towers.emily.length);
  if (towers.emily.length >= want && waitR){ const r = waitR; waitR = null; r(); }
});
for (const who of ['emily', 'paul']) towerEl[who].addEventListener('pointerdown', e => { e.preventDefault(); if (mode === 'tower' && waitR){ const r = waitR; waitR = null; r(who); } });
let choiceR = null;
$('#grab').addEventListener('click', () => { if (choiceR){ const r = choiceR; choiceR = null; r('grab'); } });
$('#share').addEventListener('click', () => { if (choiceR){ const r = choiceR; choiceR = null; r('share'); } });
function bumpN(n){
  const b = $('#count'), num = $('#num'), dots = $('#dots');
  b.hidden = false; num.textContent = n; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
  dots.innerHTML = '<i></i>'.repeat(n);
}
async function waitFor(m, n, targets, hint, ruHint){
  mode = m; want = n;
  const p = new Promise(r => waitR = r);
  let done = false; p.then(() => { done = true; tapHint(targets(), false); });
  tapHint(targets(), true); if (m === 'pile') pointAt(targets()[0]);
  (async () => { let k = 0; while (!done){ await sleep(8000); if (done) break; k++;
    targets().forEach(el => { el.classList.add('glow'); setTimeout(() => el.classList.remove('glow'), 3000); });
    if (!speaking) await play(k % 2 === 0 ? ruHint : hint); } })();
  const res = await p; mode = null; return res;
}

const HEART_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 88 C10 60 8 30 30 22 C42 18 50 28 50 34 C50 28 58 18 70 22 C92 30 90 60 50 88 Z" fill="#ff6b8a" stroke="#d6476a" stroke-width="5"/></svg>';
const ZAP_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10 50 h60 M50 26 l26 24 l-26 24" fill="none" stroke="#ff3b3b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* parts: {img:'emily_idle', x, h, flip}  — x центр в %, h высота в % карточки, стоит на земле
          {svg, x, y, w}                  — предмет
          {fx:'tears'|'hearts'|'zap', x, y} */
function sceneCard(parts, bg){
  const c = document.createElement('button'); c.className = 'card'; c.type = 'button';
  if (bg) c.style.setProperty('--cardbg', bg);
  c.innerHTML = '<span class="ground"></span>';
  for (const p of parts){
    if (p.img){
      const [w, h] = SIZE[p.img] || [1, 1], im = document.createElement('img'); const oo = (typeof heroes !== 'undefined' && heroes.emily && heroes.emily._outfit && p.img.startsWith('emily_') && IMG[p.img + '_' + heroes.emily._outfit]) ? p.img + '_' + heroes.emily._outfit : p.img; im.src = IMG[oo]; im.alt = '';
      const hh = p.h, ww = hh * (w/h) * (4/3) * 0.75;
      Object.assign(im.style, {height:hh + '%', left:(p.x - ww/2) + '%', bottom:(p.b ?? 8) + '%', transform:p.flip ? 'scaleX(-1)' : ''});
      c.appendChild(im);
    } else if (p.svg){
      const d = document.createElement('span'); d.className = 'sv'; d.innerHTML = p.svg;
      Object.assign(d.style, {left:(p.x - p.w/2) + '%', top:p.y + '%', width:p.w + '%', height:(p.hh ?? p.w*1.33) + '%', transform:p.rot ? `rotate(${p.rot}deg)` : ''});
      c.appendChild(d);
    } else if (p.fx === 'tears'){
      for (const dx of [-3, 3]){ const t = document.createElement('i'); t.className = 'tear'; Object.assign(t.style, {left:(p.x + dx) + '%', top:p.y + '%', animationDelay:(dx > 0 ? .6 : 0) + 's'}); c.appendChild(t); }
    } else if (p.fx === 'hearts'){
      for (const [dx, dy, dl] of [[-8, 0, 0], [6, -6, .5], [0, -14, 1]]){ const t = document.createElement('i'); t.className = 'heart'; t.innerHTML = HEART_SVG; Object.assign(t.style, {left:(p.x + dx) + '%', top:(p.y + dy) + '%', animationDelay:dl + 's'}); c.appendChild(t); }
    } else if (p.fx === 'zap'){
      const t = document.createElement('i'); t.className = 'zap'; t.innerHTML = ZAP_SVG; Object.assign(t.style, {left:p.x + '%', top:p.y + '%', transform:p.flip ? 'scaleX(-1)' : ''}); c.appendChild(t);
    }
  }
  return c;
}
/* Показывает две сцены, ведущая озвучивает каждую (сцена подсвечивается), потом спрашивает.
   Возвращает номер выбранной сцены. */
async function chooseScene(opts, askClip, ruAsk){
  let box = document.getElementById('scenes');
  if (!box){ box = document.createElement('div'); box.id = 'scenes'; document.getElementById('stage').appendChild(box); }
  box.innerHTML = ''; box.hidden = false;
  const cards = opts.map(o => sceneCard(o.parts, o.bg));
  cards.forEach(c => box.appendChild(c));
  let picked = null, resolveP;
  const p = new Promise(r => resolveP = r);
  cards.forEach((c, i) => c.addEventListener('click', () => { if (picked === null){ picked = i; resolveP(i); } }));
  const narrate = async () => {
    for (let i = 0; i < opts.length && picked === null; i++){
      cards[i].classList.add('lit'); await play(opts[i].clip); cards[i].classList.remove('lit'); await sleep(200);
    }
  };
  (async () => {
    await narrate(); if (picked === null) await play(askClip);
    let k = 0;
    while (picked === null){ await sleep(9000); if (picked !== null) break; k++;
      if (k % 2 === 0) await play(ruAsk); else { await narrate(); if (picked === null) await play(askClip); } }
  })();
  const i = await p;
  cards[i].classList.add('lit'); sfx.pop(); await sleep(500);
  box.hidden = true;
  return i;
}

/* Всё, на что можно нажать, мягко пульсирует; палец показывает, куда нажимать */
const FINGER_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M26 30 V10 a5 5 0 0 1 10 0 V28 l2 -6 a5 5 0 0 1 9 3 l-1 8 l2 -3 a5 5 0 0 1 8 4 l-4 14 q-4 12 -18 12 h-6 q-10 0 -14 -10 l-6 -14 a5 5 0 0 1 9 -4 z" fill="#fff" stroke="#3b2a1f" stroke-width="3" stroke-linejoin="round"/></svg>';
let fingerEl = null;
function tapHint(els, on){ (els || []).forEach(el => el && el.classList.toggle('tapme', on)); if (!on) hideFinger(); }
function pointAt(el){
  if (!el) return; hideFinger();
  const st = document.getElementById('stage').getBoundingClientRect(), r = el.getBoundingClientRect();
  fingerEl = document.createElement('div'); fingerEl.id = 'finger'; fingerEl.innerHTML = FINGER_SVG;
  fingerEl.style.left = (r.left - st.left + r.width*0.55) + 'px'; fingerEl.style.top = (r.top - st.top + r.height*0.45) + 'px';
  document.getElementById('stage').appendChild(fingerEl);
}
function hideFinger(){ if (fingerEl){ fingerEl.remove(); fingerEl = null; } }

/* ---------- Ход уровня ---------- */
let plays = 0;
async function level(){
  const {emily, mark, theo, isabel, paul} = heroes;
  clearTowers(); castle.hidden = true; shovel.hidden = false; bucket.hidden = false; heroes.emily.hold(''); heroes.paul.hold('');
  shovel.style.transform = ''; bucket.style.transform = '';
  /* 1. Попросить лопатку: она у Пауля в руках */
  shovel.hidden = true; paul.hold(ART.shovel, {x:0.68, y:0.5, w:0.26, h:0.5, rot:18});
  paul.setBase('idle');
  await repeatAfter('e_schaufel', emily);
  paul.setBase('hide'); paul.anim('squish'); await paul.talkWhile(play('p_meins'), 'talk'); paul.setBase('idle');
  /* 2. Как поступить? Две сцены: выхватить лопатку или по-доброму предложить играть вместе */
  const SHOVEL = ART.shovel;
  const opts = [
    {clip:'a_opt_weg', parts:[{img:'emily_surprised', x:32, h:74}, {img:'paul_idle', x:70, h:72}, {fx:'tears', x:67, y:36},
      {svg:SHOVEL, x:46, y:38, w:9, rot:-35}, {fx:'zap', x:44, y:16, flip:true}]},
    {clip:'a_opt_teilen', parts:[{img:'emily_jump', x:30, h:74}, {img:'paul_jump', x:70, h:72},
      {svg:SHOVEL, x:50, y:44, w:9}, {svg:ART.bucket, x:50, y:66, w:12, hh:16}, {fx:'hearts', x:46, y:12}]}
  ];
  while (true){
    const i = await chooseScene(opts, 'a_was_tun', 'r_choose_kind');
    if (i === 1){ sfx.ding(); await praise(); break; }
    /* последствие плохого выбора: Пауль расстроился */
    paul.setBase('hide'); paul.anim('wiggle'); sfx.bonk();
    await play('a_paul_traurig'); paul.setBase('idle');
  }
  await repeatAfter('e_teilen', emily);
  paul.setBase('jump'); paul.anim('hop'); await paul.talkWhile(play('p_hier'), 'talk'); paul.setBase('idle');
  await giveFX(ART.shovel, paul, emily, {x:0.5, y:0.5, w:0.24, h:0.48, size:L.hE*0.24, holdOpts:{rot:-20}});
  await repeatAfter('e_danke', emily);
  /* 3. Пауль строит башню из 4 куличиков */
  await play('a_paul_baut');
  for (let i = 1; i <= 4; i++){ addCake('paul'); await paul.talkWhile(play('e_' + i), 'talk'); await sleep(200); }
  /* 4. Эмили строит 2 */
  await play('a_du_baust');
  await waitFor('pile', 2, () => [pile], 'a_du_baust', 'r_sand');
  await sleep(400); $('#count').hidden = true;
  /* 5. У кого больше? */
  let ans;
  do {
    await play('a_wer_mehr');
    ans = await waitFor('tower', 1, () => [towerEl.emily, towerEl.paul], 'a_wer_mehr', 'r_mehr');
    if (ans !== 'paul'){ sfx.bonk(); await play('a_noch_mal_zaehl'); }
  } while (ans !== 'paul');
  sfx.ding(); await play('a_paul_mehr');
  /* 6. Сделать поровну */
  await play('a_gleich');
  mode = null;
  await waitFor('pile', 4, () => [pile], 'a_gleich', 'r_sand');
  await sleep(400); $('#count').hidden = true;
  sfx.ding(); await play('a_gleich_viele'); await praise();
  /* 7. Строим замок вместе */
  await repeatAfter('e_sandburg', emily);
  clearTowers(); castle.hidden = false;
  castle.animate([{transform:'scale(.2)', opacity:0}, {transform:'scale(1)', opacity:1}], {duration:600, easing:'cubic-bezier(.3,1.6,.5,1)'});
  for (const h of [emily, paul, isabel, mark]) h.anim('hop');
  sfx.ding(); await flyBone(theo);
  await repeatAfter('e_spass', emily);
  paul.setBase('wave'); emily.setBase('wave'); isabel.setBase('wave');
  await paul.talkWhile(play('p_tschuess'), 'talk');
  await repeatAfter('e_tschuess', emily);
  confetti(); await play('a_final');
  plays++;
  $('#again').hidden = false;
}

function confetti(){
  const colors = ['#ff7a59','#ffd34d','#32b67a','#2f80ed','#ff8fc8','#9b6bff'];
  for (let i = 0; i < 60; i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.background = colors[i % colors.length]; c.style.left = Math.random()*L.W+'px'; c.style.top = '-20px';
    stage.appendChild(c);
    const dx = (Math.random()-.5)*160, rot = Math.random()*720;
    c.animate([{transform:'translate(0,0) rotate(0)'}, {transform:`translate(${dx}px,${L.H+40}px) rotate(${rot}deg)`}],
      {duration:2200 + Math.random()*1800, delay:Math.random()*600, easing:'cubic-bezier(.25,.6,.5,1)', fill:'forwards'})
      .finished.then(() => c.remove()).catch(() => c.remove());
  }
}
function reset(){
  bones.forEach(b => b.remove()); bones = [];
  for (const h of Object.values(heroes)){ h.setBase('idle'); if (h.name !== 'paul') setWhere(h, {kind:'front', x:FRONT_X[h.name]}); }
  shovel.getAnimations().forEach(a => a.cancel());
}
/* ---------- Общие улучшения: читаемый счётчик, герои ходят, а не телепортируются ---------- */
(function(){
  const css = document.createElement('style');
  css.textContent = `
  #count{background:rgba(255,250,242,.94);border-radius:28px;padding:4px 26px 12px;box-shadow:0 6px 0 rgba(217,183,122,.9)}
  #num{color:#ff7a59 !important;text-shadow:0 5px 0 #ffd9c9 !important}
  #dots i{background:#ffc93c !important;box-shadow:0 0 0 3px #fff !important}
  .ghost{position:absolute;pointer-events:none;transform-origin:0 0}
  .ghost .body{animation:fxwalk .34s ease-in-out infinite !important;transform-origin:50% 100%}
  @keyframes fxwalk{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-5%) rotate(2.5deg)}}
  .fx-give{position:absolute;pointer-events:none;z-index:80}
  .fx-give svg,.fx-give img{width:100%;height:100%;display:block;overflow:visible}
  .fx-spark{position:absolute;pointer-events:none;z-index:81;width:14px;height:14px;border-radius:50%;background:#ffd84d;box-shadow:0 0 8px #fff36b}
  `;
  document.body.appendChild(css);
})();

const FX = {walk:true};
/* мягкие шаги во время ходьбы */
if (typeof sfx !== 'undefined' && !sfx.step) sfx.step = function(ms = 900){
  const n = Math.max(2, Math.round(ms/300));
  for (let i = 0; i < n; i++) setTimeout(() => { try { this.tone(i % 2 ? 210 : 180, 120, 70, 'triangle', .07); } catch(e){} }, i*300);
};
function fxRect(el){ const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(); return {x:r.left - s.left, y:r.top - s.top, w:r.width, h:r.height}; }
function fxVisible(h){
  if (!h || !h.el || !h.el.isConnected || h.el.hidden || !h.where || h.where.kind === 'none') return false;
  if (h.el.style.opacity === '0' || h.el.style.display === 'none') return false;
  const r = h.el.getBoundingClientRect(); return r.width > 2 && r.height > 2;
}
function fxSpotZ(id){ try { const s = spots[id]; return s && s.front ? (+s.front.style.zIndex || 20) - 1 : 40; } catch(e){ return 40; } }
function fxEndGhost(h){ if (h._ghost){ h._ghost.getAnimations().forEach(a => a.cancel()); h._ghost.remove(); h._ghost = null; } h.el.style.visibility = ''; }

/* Герой переходит из одной точки в другую пешком: копия героя идёт, покачиваясь, настоящий появляется на месте */
function fxWalkGhost(h, from, to, fromZ, toZ){
  const g = h.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('inspot');
  const real = [...h.body.querySelectorAll('img')], gi = [...g.querySelectorAll('img')];
  const walkImg = h.imgs.walk || h.imgs.idle, k = real.indexOf(walkImg);
  if (k >= 0) gi.forEach((im, i) => { im.hidden = i !== k; });
  const held = g.querySelector('.held'); if (held && h.held && !h.held.hidden) held.hidden = false;
  Object.assign(g.style, {left:from.x + 'px', top:from.y + 'px', width:from.w + 'px', height:from.h + 'px', zIndex:fromZ, visibility:'visible', opacity:1, transform:'none', transition:'none'});
  stage.appendChild(g); h._ghost = g; h.el.style.visibility = 'hidden';
  const dx = to.x - from.x, dy = to.y - from.y, sx = to.w/from.w, sy = to.h/from.h;
  const d = Math.hypot(dx, dy), ms = Math.max(450, Math.min(1500, 380 + d*2.1));
  const end = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;
  const a = g.animate([{transform:'none', zIndex:fromZ}, {zIndex:fromZ, offset:.7}, {zIndex:toZ, offset:.72}, {transform:end, zIndex:toZ}], {duration:ms, easing:'ease-in-out', fill:'forwards'});
  if (typeof sfx !== 'undefined' && sfx.step) sfx.step(ms);
  return a.finished.catch(() => {}).then(() => { if (h._ghost === g) fxEndGhost(h); });
}
if (typeof setWhere === 'function' && typeof placeHero === 'function'){
  const _setWhere = setWhere;
  setWhere = function(h, where){
    let from = null, fromZ = +h.el.style.zIndex || 50;
    const was = h.where || {};
    if (h._ghost){ from = fxRect(h._ghost); fromZ = +h._ghost.style.zIndex || fromZ; fxEndGhost(h); }
    else if (FX.walk && fxVisible(h) && h.box) from = fxRect(h.el);
    if (was.kind === 'spot' && was.state !== 'out') fromZ = fxSpotZ(was.spot);
    _setWhere(h, where);
    if (!from || !FX.walk || !fxVisible(h) || !L.W) return;
    const to = fxRect(h.el);
    if (Math.hypot(to.x - from.x, to.y - from.y) < L.W*0.04) return;
    const toZ = (where.kind === 'spot' && where.state !== 'out') ? fxSpotZ(where.spot) : (+h.el.style.zIndex || 50);
    h._walkP = fxWalkGhost(h, from, to, fromZ, toZ);
  };
}
/* дождаться, пока герой дойдёт */
function walked(h){ return (h && h._walkP) || Promise.resolve(); }

/* у всех героев есть руки: предмет в руках */
if (typeof Hero === 'function' && !Hero.prototype.hold){
  Hero.prototype.hold = function(html, o = {}){
    if (!this.held){ this.held = document.createElement('div'); this.held.className = 'held'; this.body.appendChild(this.held); }
    this.held.innerHTML = html || ''; this.held.hidden = !html;
    const w = o.w ?? 0.3, hh = o.h ?? w;
    Object.assign(this.held.style, {position:'absolute', left:((o.x ?? 0.5) - w/2)*100 + '%', top:((o.y ?? 0.55) - hh/2)*100 + '%', width:w*100 + '%', height:hh*100 + '%',
      zIndex:5, transform:o.rot ? `rotate(${o.rot}deg)` : '', pointerEvents:'none'});
    this.held.querySelectorAll('svg').forEach(s => { s.style.width = '100%'; s.style.height = '100%'; s.style.display = 'block'; s.style.overflow = 'visible'; });
  };
}
/* передать предмет: летит дугой из рук одного героя (или точки) в руки другого */
async function giveFX(html, from, toHero, o = {}){
  const st = stage.getBoundingClientRect();
  const fr = from && from.el ? fxRect(from.el) : from;   /* герой или прямоугольник {x,y,w,h} */
  const tb = toHero.box, size = o.size ?? L.hE*0.22;
  const fx = fr.x + fr.w*(from && from.el ? 0.5 : 0.5), fy = fr.y + fr.h*(from && from.el ? 0.55 : 0.5);
  const tx = tb.x + tb.w*(o.x ?? 0.5), ty = tb.y + tb.h*(o.y ?? 0.55);
  const d = document.createElement('div'); d.className = 'fx-give'; d.innerHTML = html;
  Object.assign(d.style, {left:(fx - size/2) + 'px', top:(fy - size/2) + 'px', width:size + 'px', height:size + 'px'});
  stage.appendChild(d);
  if (from && from.hold) from.hold('');
  const dx = tx - fx, dy = ty - fy, lift = -Math.max(L.hE*0.25, Math.abs(dx)*0.18);
  if (typeof sfx !== 'undefined' && sfx.whoosh) sfx.whoosh();
  await d.animate([{transform:'translate(0,0) rotate(0)'}, {transform:`translate(${dx*0.5}px,${dy*0.5 + lift}px) rotate(${dx > 0 ? 12 : -12}deg) scale(1.1)`, offset:.5}, {transform:`translate(${dx}px,${dy}px) rotate(0)`}], {duration:o.ms ?? 750, easing:'ease-in-out', fill:'forwards'}).finished.catch(() => {});
  d.remove();
  if (o.hold !== false) toHero.hold(html, Object.assign({x:o.x ?? 0.5, y:o.y ?? 0.55, w:o.w ?? 0.3, h:o.h ?? 0.3}, o.holdOpts || {}));
  toHero.body.classList.remove('squish'); void toHero.body.offsetWidth; toHero.body.classList.add('squish');
  toHero.body.addEventListener('animationend', () => toHero.body.classList.remove('squish'), {once:true});
  sparkFX(tx, ty);
  if (typeof sfx !== 'undefined' && sfx.pop) sfx.pop();
}
/* искорки в точке */
function sparkFX(x, y, n = 8){
  for (let i = 0; i < n; i++){
    const s = document.createElement('i'); s.className = 'fx-spark'; stage.appendChild(s);
    Object.assign(s.style, {left:(x - 7) + 'px', top:(y - 7) + 'px'});
    const a = i/n*Math.PI*2, r = L.hE*(0.12 + Math.random()*0.08);
    s.animate([{transform:'translate(0,0) scale(1)', opacity:1}, {transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`, opacity:0}], {duration:600, easing:'ease-out', fill:'forwards'}).finished.then(() => s.remove()).catch(() => s.remove());
  }
}
/* Живые герои: время от времени кто-то из стоящих без дела чуть покачивается или переминается */
(async function idleLife(){
  const moves = [
    [{transform:'rotate(0)'}, {transform:'rotate(-2.2deg)'}, {transform:'rotate(1.6deg)'}, {transform:'rotate(0)'}],
    [{transform:'translateY(0)'}, {transform:'translateY(-3%) scale(1.01,.99)'}, {transform:'translateY(0)'}],
    [{transform:'scale(1,1)'}, {transform:'scale(1.03,.97)'}, {transform:'scale(.99,1.01)'}, {transform:'scale(1,1)'}]];
  while (true){
    await sleep(5000 + Math.random()*6000);
    try {
      if (typeof heroes === 'undefined') continue;
      const list = Object.values(heroes).filter(h => fxVisible(h) && !h._ghost && !h.talking && !h.lock && h.where.kind === 'front' && h.cur !== 'counting');
      if (!list.length) continue;
      const h = list[Math.floor(Math.random()*list.length)];
      if (h.body.classList.contains('hop') || h.body.classList.contains('squish') || h.body.classList.contains('wiggle') || h.body.classList.contains('walking')) continue;
      h.body.animate(moves[Math.floor(Math.random()*moves.length)], {duration:900, easing:'ease-in-out'});
    } catch(e){}
  }
})();
/* В начале уровня Эмили, Марк и Тео не стоят как вкопанные, а приходят на свои места */
(function(){
  const go = document.getElementById('go');
  if (!go || typeof setWhere !== 'function' || typeof heroes === 'undefined') return;
  go.addEventListener('click', async () => {
    try {
      const hs = ['emily', 'mark', 'theo'].map(n => heroes[n]).filter(h => h && h.where && h.where.kind === 'front' && !h.el.hidden && h.box);
      const goal = hs.map(h => Object.assign({}, h.where));
      FX.walk = false; hs.forEach((h, i) => setWhere(h, Object.assign({}, goal[i], {x: goal[i].x > 0.5 ? 1.12 : -0.12}))); FX.walk = true;
      for (let i = 0; i < hs.length; i++){ setWhere(hs[i], goal[i]); await sleep(200); }
    } catch(e){}
  });
})();

/* Одежда: emily.outfit('out') — в кроссовках (картинки *_out), emily.outfit('') — в носочках */
if (typeof Hero === 'function' && !Hero.prototype.outfit){
  Hero.prototype.outfit = function(o){
    this._outfit = o || '';
    for (const [p, im] of Object.entries(this.imgs)){ const k = this.name + '_' + p + (o ? '_' + o : ''); if (IMG[k]) im.src = IMG[k]; else if (IMG[this.name + '_' + p]) im.src = IMG[this.name + '_' + p]; }
    if (this.box && this.where && this.where.kind !== 'none' && typeof placeHero === 'function'){ FX.walk = false; placeHero(this); FX.walk = true; }
  };
}
/* размеры и сдвиги берём от той картинки, что сейчас надета (у уличной одежды свои размеры) */
if (typeof Hero === 'function' && Hero.prototype.put){
  Hero.prototype.put = function(x, baseY, kMul){
    const o = this._outfit ? '_' + this._outfit : '';
    const keyOf = p => (o && SIZE[this.name + '_' + p + o]) ? this.name + '_' + p + o : this.name + '_' + p;
    const idle = SIZE[keyOf('idle')];
    this.k = (L.hE*this.hFactor*kMul)/idle[1];
    const bw = idle[0]*this.k, bh = idle[1]*this.k;
    this.box = {x: x - bw/2, y: baseY - bh, w: bw, h: bh};
    Object.assign(this.el.style, {left:this.box.x + 'px', top:this.box.y + 'px', width:bw + 'px', height:bh + 'px'});
    for (const [p, im] of Object.entries(this.imgs)){
      const key = keyOf(p); if (!SIZE[key]) continue;
      const [w, h] = SIZE[key]; let ox, oy;
      if (OFF[key]) { [ox, oy] = OFF[key]; } else { ox = (idle[0] - w)/2; oy = idle[1] - h; }
      Object.assign(im.style, {left:ox*this.k + 'px', top:oy*this.k + 'px', width:w*this.k + 'px', height:h*this.k + 'px'});
    }
  };
}

/* ---------- Старт ---------- */
heroes.emily.outfit('out');   /* на улице Эмили в куртке и кроссовках */
if (heroes.mark) heroes.mark.outfit('out');
for (const h of Object.values(heroes)) h.where = {kind:'front', x:FRONT_X[h.name]};
heroes.paul.where = {kind:'none'};
$('#go').style.backgroundImage = `url(${IMG.theo_idle})`;
$('#go').addEventListener('click', async () => {
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
    const s = actx.createBufferSource(); s.buffer = actx.createBuffer(1, 1, 22050); s.connect(actx.destination); s.start();
  } catch(e){ actx = null; }
  try { if ('speechSynthesis' in window){ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch(e){}
  $('#start').hidden = true; sfx.pop();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch(e){}
  if (actx) await Promise.all([loadSounds(), setupMic()]);
  await play('a_start'); await sleep(200);
  level();
});
$('#again').addEventListener('click', async () => {
  $('#again').hidden = true; reset(); sfx.pop(); await sleep(300); level();
});
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();
</script>
<script>
/* Общий прогресс игры: пройденные уровни, косточки Тео, новые друзья. Хранится на этом устройстве. */
(function(){
  const LEVEL = 5, FRIENDS = [], STICKER = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 110\"><g fill=\"#e8bf7a\" stroke=\"#b8904a\" stroke-width=\"3\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"50\" width=\"140\" height=\"58\"/><rect x=\"14\" y=\"28\" width=\"40\" height=\"80\"/><rect x=\"146\" y=\"28\" width=\"40\" height=\"80\"/><rect x=\"80\" y=\"18\" width=\"40\" height=\"90\"/><path d=\"M14 28 v-10 h8 v8 h8 v-8 h8 v8 h8 v-8 h8 v10 z\"/><path d=\"M146 28 v-10 h8 v8 h8 v-8 h8 v8 h8 v-8 h8 v10 z\"/><path d=\"M80 18 v-10 h8 v8 h8 v-8 h8 v8 h8 v-8 h8 v10 z\"/></g><path d=\"M88 108 v-24 a12 12 0 0 1 24 0 v24 z\" fill=\"#a8703f\"/><line x1=\"100\" y1=\"8\" x2=\"100\" y2=\"-18\" stroke=\"#8a5a33\" stroke-width=\"3\"/><path d=\"M100 -18 l22 7 l-22 7 z\" fill=\"#ff6b5e\"/></svg>";
  const KEY = 'emily-game';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ return {}; } };
  const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} };
  const stage = document.getElementById('stage'), again = document.getElementById('again');
  /* кнопка «на карту» */
  const css = document.createElement('style');
  css.textContent = `#tomap{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:96;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #e2b98a;display:grid;place-items:center}
  #tomap svg{width:34px;height:34px}
  #sticker{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:84;width:min(30vw,34vh);aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;border:8px solid #ffd84d;box-shadow:0 8px 0 #e2b98a;display:grid;place-items:center;padding:8%;box-sizing:border-box;animation:stickin .7s cubic-bezier(.3,1.6,.5,1)}
  #sticker svg,#sticker img{width:100%;height:100%;object-fit:contain}
  @keyframes stickin{0%{transform:translateX(-50%) scale(.2) rotate(-30deg);opacity:0}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1}}`;
  document.head ? document.head.appendChild(css) : document.body.appendChild(css);
  const a = document.createElement('a'); a.id = 'tomap'; a.href = 'index.html'; a.setAttribute('aria-label', 'Карта уровней');
  a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#ff7a59" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
  stage.appendChild(a);
  let marked = false;
  function done(){
    if (marked) return; marked = true;
    const d = load(); d.done = d.done || {}; d.done[LEVEL] = (d.done[LEVEL] || 0) + 1;
    const nb = document.querySelectorAll('.bone').length;
    d.bones = (d.bones || 0) + Math.max(1, nb);
    d.friends = d.friends || {}; FRIENDS.forEach(f => d.friends[f] = true);
    save(d);
    const s = document.createElement('div'); s.id = 'sticker'; s.innerHTML = STICKER; stage.appendChild(s);
    again.addEventListener('click', () => s.remove(), {once: true});   /* наклейка остаётся до «ещё раз» */
  }
  new MutationObserver(() => { if (!again.hidden) done(); }).observe(again, {attributes:true, attributeFilter:['hidden']});
  again.addEventListener('click', () => { marked = false; });
})();
</script>
