const SND = {"a_final": "assets/snd/1f58eb1ff7c9.mp3", "a_juhu": "assets/snd/ab65e31fd892.mp3", "a_nach": "assets/snd/ca5aa096bdb0.mp3", "a_prima": "assets/snd/4beb6b79b97f.mp3", "a_super": "assets/snd/fe00647daef4.mp3", "a_toll": "assets/snd/288f2e5a7bca.mp3", "a_wunderbar": "assets/snd/2a1e6fe05fd4.mp3", "e41_leise": "assets/snd/b0ae10472a3d.mp3", "e41_ohren": "assets/snd/f195fb61c1fd.mp3", "e_1": "assets/snd/47c925770470.mp3", "e_2": "assets/snd/918ef9b62ef0.mp3", "e_3": "assets/snd/510e7125b84e.mp3", "e_4": "assets/snd/eedc12bfb218.mp3", "n24_fester": "assets/snd/62af96e91cb6.mp3", "n41_intro": "assets/snd/261d7d036c52.mp3", "n41_nach": "assets/snd/027330ab53a6.mp3", "n41_vier": "assets/snd/b056e51c9db7.mp3", "n41_wahl": "assets/snd/aa10d082fff3.mp3", "n_lauter": "assets/snd/514e958e006e.mp3", "r41_tipp": "assets/snd/c7e116ac2d1e.mp3", "r_lauter": "assets/snd/2e0c8abce899.mp3", "r_like_emily": "assets/snd/9f24a0a81f00.mp3", "r_tipp_licht": "assets/snd/df132d7b84f0.mp3"};  /*SND: e_{1..4} a_super a_toll a_prima a_juhu a_wunderbar a_nach r_like_emily a_final r_tipp_licht*/

<script>
/* Уровень 41: музыкальный круг. Инструменты: барабан, погремушка, колокольчик — Эмили выбирает и просит «Ich möchte die Trommel, bitte.».
   Ритм: Хайке стучит 3 раза — нажимаем на свой инструмент 3 раза (счёт), потом 4. Пауль барабанит прямо у уха: шаг 1 «Paul, das ist zu laut. Bitte leiser.»,
   шаг 2 «Hör auf! Das tut mir in den Ohren weh.» — извиняется. Эмили — дирижёр: выбирает «laut / leise» и говорит «Jetzt alle laut!» / «Jetzt alle ganz leise!». */
const LEVEL = 41, FRIENDS = ['paul', 'isabel', 'abiha'];
const STICKER = '<svg viewBox="0 0 100 100"><ellipse cx="50" cy="38" rx="34" ry="12" fill="#ffd34d" stroke="#d6a21e" stroke-width="4"/><path d="M16 38 V70 Q50 86 84 70 V38" fill="#ff5a4a" stroke="#c43a2e" stroke-width="4"/><path d="M24 44 L40 72 M76 44 L60 72" stroke="#ffd34d" stroke-width="4"/><path d="M60 8 L44 30 M74 12 L58 30" stroke="#8a5a1e" stroke-width="5" stroke-linecap="round"/></svg>';
const RUG = 0.5;
function drawScene(g, W, H, L){ drawKita(g, W, H, L, RUG); }
const INST = {
  trommel: {svg: '<svg viewBox="0 0 100 90"><ellipse cx="50" cy="24" rx="40" ry="14" fill="#fff3d6" stroke="#d6a21e" stroke-width="4"/><path d="M10 24 V66 Q50 86 90 66 V24" fill="#ff5a4a" stroke="#c43a2e" stroke-width="4"/><path d="M18 30 L38 74 M82 30 L62 74 M50 38 V80" stroke="#ffd34d" stroke-width="4"/></svg>', snd: () => { sfx.tone(110, 60, 220, 'sine', .4); sfx.noise(120, 200, .3); }},
  rassel: {svg: '<svg viewBox="0 0 100 90"><ellipse cx="44" cy="34" rx="26" ry="24" fill="#9b6bff" stroke="#6b3fc4" stroke-width="4"/><path d="M60 52 L86 84" stroke="#8a5a1e" stroke-width="9" stroke-linecap="round"/><circle cx="36" cy="28" r="4" fill="#fff"/><circle cx="50" cy="38" r="4" fill="#fff"/><circle cx="40" cy="44" r="4" fill="#fff"/></svg>', snd: () => sfx.noise(160, 5000, .35)},
  glocke: {svg: '<svg viewBox="0 0 100 90"><path d="M50 8 Q24 12 22 52 L14 66 H86 L78 52 Q76 12 50 8 Z" fill="#ffd34d" stroke="#d6a21e" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="74" r="8" fill="#d6a21e"/><path d="M50 8 V0" stroke="#d6a21e" stroke-width="5"/></svg>', snd: () => sfx.tone(1320, 1300, 500, 'sine', .2)}
};
const LOUD = '<svg viewBox="0 0 100 100"><path d="M14 38 H34 L58 18 V82 L34 62 H14 Z" fill="#ff7a59" stroke="#d65a3b" stroke-width="4" stroke-linejoin="round"/><path d="M68 34 Q80 50 68 66 M76 24 Q96 50 76 76" fill="none" stroke="#ff7a59" stroke-width="6" stroke-linecap="round"/></svg>';
const SOFT = '<svg viewBox="0 0 100 100"><path d="M14 38 H34 L58 18 V82 L34 62 H14 Z" fill="#8fd3ff" stroke="#2f80ed" stroke-width="4" stroke-linejoin="round"/><path d="M68 42 Q74 50 68 58" fill="none" stroke="#2f80ed" stroke-width="5" stroke-linecap="round"/></svg>';
let emily, abiha, isabel, paul, heike, inst = {}, mine, pdrum;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'surprised'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'jump', 'laugh', 'sit'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = []; inst = {};
  heike = T.hero('sommer', {x: 0.08, h: 1.45, poses: ['idle', 'blink', 'talk', 'wave']});
  emily = T.hero('emily', {x: 0.26, poses: EP});
  abiha = T.hero('abiha', {x: 0.62, poses: AP}); abiha.face(true);
  isabel = T.hero('isabel', {x: 0.76, h: 0.95, poses: KP}); isabel.face(true);
  paul = T.hero('paul', {x: 0.9, h: 0.97, poses: KP}); paul.face(true);
  Object.keys(INST).forEach((k, i) => { inst[k] = T.prop(INST[k].svg, {x: 0.38 + i*0.1, py: () => L.floorY + L.hE*0.02, w: 0.24, ratio: 0.9, z: 50}); });
  pdrum = T.prop(INST.trommel.svg, {px: () => L.W*paul.x - L.hE*0.1, py: () => L.floorY - L.hE*0.25, w: 0.2, ratio: 0.9, z: 55}); pdrum.el.hidden = true;
}
const beat = async (k, el) => { INST[k].snd(); (el || inst[k].el).animate([{transform: 'none'}, {transform: 'scale(1.15) rotate(-6deg)'}, {transform: 'none'}], {duration: 220}); await sleep(450); };
/* Хайке играет n ударов, потом Эмили нажимает столько же раз (лишнее — «hör noch mal») */
async function rhythm(n){
  await sleep(300); for (let i = 0; i < n; i++){ heike.set('wave'); await beat('trommel', heike.el); heike.set('idle'); }
  await play('n41_nach');
  for (let i = 1; i <= n; i++){ await T.tap([inst[mine]], 'n41_nach', 'r41_nach'); await beat(mine); showNum(i); play('e_' + i); }
  await sleep(600); hideNum();
}

async function story(){
  await play('n41_intro');
  heike.set('talk'); await heike.say('s41_was'); heike.set('idle');
  await play('n41_tipp');
  const el = await T.tap(Object.values(inst), 'n41_tipp', 'r41_tipp'); mine = Object.keys(inst).find(k => inst[k].el === el);
  await beat(mine); await T.repeat('e41_' + mine);
  inst[mine].o.x = 0.36; inst[mine].place();
  Object.keys(inst).filter(k => k !== mine).forEach(k => inst[k].el.hidden = true);
  await T.bone(emily);
  heike.set('talk'); await heike.say('s41_hoer'); heike.set('idle');
  await rhythm(3); await play('n41_drei');
  await rhythm(4); await play('n41_vier');
  await T.bone(inst[mine]);

  /* Пауль барабанит у уха */
  pdrum.el.hidden = false; await paul.walkTo(0.42, 900); pdrum.place(); paul.face(true);
  await play('n41_paul');
  for (let i = 0; i < 4; i++){ await beat('trommel', pdrum.el); }
  emily.set('surprised');
  await T.repeat('e41_laut');
  paul.set('jump'); await paul.say('p41_spass'); for (let i = 0; i < 3; i++) await beat('trommel', pdrum.el); paul.set('idle');
  await play('n24_fester');
  await T.firm('e41_ohren', {who: paul, step: 2}); pdrum.place();
  paul.set('talk'); await paul.say('p41_oh'); paul.set('idle');
  await paul.walkTo(0.9, 800); pdrum.place(); paul.face(true);
  await T.bone(emily);

  /* Эмили — дирижёр */
  heike.set('talk'); await heike.say('s41_dirigent'); heike.set('idle');
  const done = new Set();
  while (done.size < 2){
    const i = await T.choose([{parts: [{svg: LOUD, x: 50, y: 12, w: 60, hh: 72}], clip: 'n41_opt_laut', bg: '#fff1c9', ground: '#fff1c9'}, {parts: [{svg: SOFT, x: 50, y: 12, w: 60, hh: 72}], clip: 'n41_opt_leise', bg: '#fff1c9', ground: '#fff1c9'}], 'n41_wahl', 'r41_wahl');
    done.add(i); emily.set('wave');
    await T.repeat(i === 0 ? 'e41_laut2' : 'e41_leise'); emily.set('idle');
    for (let k = 0; k < 4; k++){ [abiha, isabel, paul].forEach(h => h.hop()); if (i === 0){ sfx.tone(110, 60, 220, 'sine', .45); sfx.noise(160, 5000, .4); } else { sfx.tone(1320, 1300, 300, 'sine', .05); } await sleep(380); }
  }
  T.hearts(emily); await T.bone(heike);
  [emily, abiha, isabel, paul].forEach(h => h.set('jump')); await play('n41_ende');
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
}
T.start(IMG.abiha_peace[0], setup);
setup();
</script>
