<script>
/* Уровень 38: Feuer, Wasser, Sturm. Хайке кричит команду, остальные дети бегут сами, Эмили — куда нажмёт игрок: Feuer — одеяло (присесть),

   шаг 3 ладонь «Stopp, Paul! Ich will auch auf die Bank!» — подвинулся. Считаем детей на скамейке (4). Потом Эмили сама выбирает и кричит команды. */
const LEVEL = 38, FRIENDS = ['paul', 'isabel', 'abiha'];
const STICKER = '<svg viewBox="0 0 100 100"><path d="M30 80 Q16 60 30 40 Q32 56 40 54 Q34 34 48 18 Q50 40 60 44 Q62 34 68 30 Q80 56 66 80 Z" fill="#ff7a59" stroke="#d65a3b" stroke-width="3"/><path d="M72 20 Q86 34 80 46 Q74 54 68 46 Q66 36 72 20 Z" fill="#4a8ff0"/><path d="M10 30 q10 -8 20 0 t20 0" fill="none" stroke="#9aa4b2" stroke-width="4" stroke-linecap="round"/></svg>';
const DX = 0.24, BX = 0.55, TX = 0.86;              /* одеяло, скамейка, дерево */
function drawScene(g, W, H, L){
  const fy = L.floorY, hE = L.hE, hz = H*0.55;
  let gr = g.createLinearGradient(0, 0, 0, hz); gr.addColorStop(0, '#9fd4f5'); gr.addColorStop(1, '#e6f4fb'); g.fillStyle = gr; g.fillRect(0, 0, W, hz);
  g.fillStyle = '#e8c9a0'; for (let x = 0; x < W; x += hE*0.13){ g.fillRect(x, hz - hE*0.32, hE*0.1, hE*0.32); } g.fillRect(0, hz - hE*0.24, W, hE*0.04);
  gr = g.createLinearGradient(0, hz, 0, H); gr.addColorStop(0, '#a6d878'); gr.addColorStop(1, '#86c25e'); g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
  for (let i = 0; i < 16; i++){ const x = (i*61.7 % 100)/100*W, y = fy + hE*(0.03 + (i % 4)*0.04); g.fillStyle = ['#e0763a', '#e3a33a', '#b5452f'][i % 3]; g.beginPath(); g.ellipse(x, y, hE*0.03, hE*0.014, i, 0, 7); g.fill(); }
}
const BLANKET = '<svg viewBox="0 0 200 60"><path d="M10 10 H190 L198 52 H2 Z" fill="#ff8fc8" stroke="#d6476a" stroke-width="4" stroke-linejoin="round"/><path d="M40 10 L34 52 M80 10 L78 52 M120 10 L122 52 M160 10 L166 52" stroke="#fff" stroke-width="4" opacity=".6"/></svg>';
const BENCH = '<svg viewBox="0 0 200 80"><rect x="6" y="20" width="188" height="16" rx="5" fill="#8a5a2e" stroke="#5e3a1a" stroke-width="3"/><rect x="6" y="2" width="188" height="12" rx="5" fill="#8a5a2e" stroke="#5e3a1a" stroke-width="3"/><rect x="20" y="36" width="12" height="42" fill="#5e3a1a"/><rect x="168" y="36" width="12" height="42" fill="#5e3a1a"/></svg>';
const TREE = '<svg viewBox="0 0 100 180"><rect x="40" y="70" width="20" height="108" fill="#7a4e22"/><circle cx="50" cy="56" r="42" fill="#e0763a"/><circle cx="26" cy="72" r="24" fill="#e3a33a"/><circle cx="76" cy="68" r="26" fill="#c9584a"/></svg>';
let emily, abiha, isabel, paul, heike, blanket, bench, tree;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'crouch', 'laugh', 'walk'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'walk', 'jump', 'laugh', 'run', 'sit'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  blanket = T.prop(BLANKET, {x: DX, py: () => L.floorY + L.hE*0.06, w: 0.95, ratio: 0.3, z: 30});
  bench = T.prop(BENCH, {x: BX, py: () => L.floorY + L.hE*0.01, w: 1.1, ratio: 0.4, z: 32});
  tree = T.prop(TREE, {x: TX, py: () => L.floorY + L.hE*0.01, w: 0.75, ratio: 1.8, z: 31});
  heike = T.hero('sommer', {x: 0.05, h: 1.45, poses: ['idle', 'blink', 'talk', 'wave']});
  abiha = T.hero('abiha', {x: 0.34, outfit: 'out', poses: AP});
  isabel = T.hero('isabel', {x: 0.44, h: 0.95, poses: KP});
  paul = T.hero('paul', {x: 0.54, h: 0.97, poses: KP});
  emily = T.hero('emily', {x: 0.24, outfit: 'out', poses: EP});
}
const kids = () => [abiha, isabel, paul];
const SPOT = {feuer: [DX - 0.08, DX - 0.02, DX + 0.05, DX + 0.11], wasser: [BX - 0.1, BX - 0.03, BX + 0.04, BX + 0.11], sturm: [TX - 0.12, TX - 0.06, TX + 0.0, TX + 0.07]};
const LIFT = {feuer: 0, wasser: 0.16, sturm: 0};
/* все бегут на место; pose: feuer — присесть, wasser — на скамейке, sturm — держатся за дерево */
async function goAll(cmd, list){ await Promise.all(list.map(([h, i]) => (async () => { h.set(h === abiha ? 'run' : 'idle'); await T.glide(h, SPOT[cmd][i], LIFT[cmd], 700, 'ease-out'); h.set(cmd === 'feuer' ? (h === emily ? 'crouch' : h === abiha ? 'sit' : 'idle') : 'idle'); })())); }
const TARGET = {feuer: () => blanket, wasser: () => bench, sturm: () => tree};
/* Эмили: нажать, куда бежать */
async function emilyGo(cmd, slot){
  await play('n38_' + cmd);
  while (true){ const el = await T.tap([blanket, bench, tree], 'n38_' + cmd, 'r38_tipp'); if (el === TARGET[cmd]().el) break; sfx.bonk(); await play('n38_falsch'); }
  sfx.ding(); await goAll(cmd, [[emily, slot]]);
}
async function call(cmd, blockPaul){
  heike.set('talk'); await heike.say('s38_' + cmd); heike.set('idle');
  if (!blockPaul){ goAll(cmd, [[abiha, 0], [isabel, 2], [paul, 3]]); await emilyGo(cmd, 1); return; }
  /* Пауль первым разлёгся на всей скамейке */
  await goAll(cmd, [[paul, 1]]); paul.set('jump'); await Promise.all([goAll('wasser', []), sleep(100)]);
  await Promise.all([T.glide(abiha, BX - 0.22, 0, 500), T.glide(isabel, BX + 0.22, 0, 500)]);
  paul.set('talk'); await paul.say('p38_kein'); paul.set('idle');
  await emilyGo('wasser', 0).catch(() => {}); await T.glide(emily, BX - 0.14, 0, 300);
  await T.repeat('e38_platz');
  paul.set('talk'); await paul.say('p38_nein'); paul.set('idle');
  await play('n24_fester');
  await T.firm('e38_alle', {who: paul, step: 2}); await T.glide(paul, BX - 0.03, LIFT.wasser, 200);
  paul.set('jump'); await Promise.all([paul.say('p38_noe'), play('p_hihi')]); paul.set('idle');
  await play('n19_stopp_tipp');
  await T.firm('e38_stopp', {who: paul, step: 3});
  paul.set('talk'); await paul.say('p38_okay'); paul.set('idle');
  await goAll('wasser', [[emily, 0], [abiha, 1], [paul, 2], [isabel, 3]]);
}

async function story(){
  await play('n38_intro');
  heike.set('talk'); await heike.say('s38_regel'); heike.set('idle');
  await call('feuer');
  await call('sturm');
  await call('wasser', true);
  await T.bone(emily);
  /* сколько детей на скамейке */
  await play('n38_wie_viele');
  let left = [emily, abiha, paul, isabel];
  for (let i = 1; i <= 4; i++){ const el = await T.tap(left, 'n38_wie_viele', 'r_tipp_licht'); const h = left.find(x => x.el === el); left = left.filter(x => x !== h); h.hop(); showNum(i); await emily.say('e_' + i); }
  hideNum(); await play('n38_vier'); await T.bone(bench);
  await call('feuer');
  /* Эмили кричит сама */
  await Promise.all([T.glide(emily, 0.16, 0, 600), T.glide(abiha, 0.36, 0, 600), T.glide(isabel, 0.48, 0, 600), T.glide(paul, 0.6, 0, 600)]);
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
  const IMGS = {feuer: BLANKET, wasser: BENCH, sturm: TREE};
  for (let r = 0; r < 2; r++){
    const ks = ['feuer', 'wasser', 'sturm'];
    const i = await T.choose(ks.map(k => ({parts: [{svg: IMGS[k], x: 50, y: k === 'sturm' ? 6 : 34, w: k === 'sturm' ? 40 : 80, hh: k === 'sturm' ? 76 : 34}], clip: 'n38_opt_' + k, bg: '#e6f4fb', ground: '#a6d878'})), 'n38_du', 'r38_du');
    const cmd = ks[i];
    await T.repeat('e38_' + cmd);
    await goAll(cmd, [[abiha, 0], [isabel, 2], [paul, 3]]); await sleep(700);
    await Promise.all([T.glide(abiha, 0.36, 0, 500), T.glide(isabel, 0.48, 0, 500), T.glide(paul, 0.6, 0, 500)]); [abiha, isabel, paul].forEach(h => h.set('idle'));
  }
  await T.bone(emily);
  [emily, abiha, isabel, paul].forEach(h => h.set('jump')); await play('n38_ende');
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
}
T.start(IMG.abiha_run_out[0], setup);
setup();
</script>
