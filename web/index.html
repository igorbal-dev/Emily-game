<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Эмили на скелете — демо</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px 8px 14px;
    background: rgba(255,255,255,0.75); }
  button { font: inherit; font-size: 16px; border: 0; border-radius: 14px; padding: 10px 14px;
    background: #ff8fc0; color: #fff; font-weight: 700; box-shadow: 0 3px 0 #d9669b; cursor: pointer;
    -webkit-tap-highlight-color: transparent; }
  button .k { opacity: 0.75; font-weight: 600; font-size: 13px; margin-right: 4px; }
  button.on { background: #7a5cff; box-shadow: 0 3px 0 #5438d6; }
  button.auto { background: #4cb050; box-shadow: 0 3px 0 #2f8a34; }
  button.auto.off { background: #9aa5b1; box-shadow: 0 3px 0 #6f7a86; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #d9669b; }
  #hint { width: 100%; text-align: center; font-size: 13px; color: #456; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #456; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="bar"></div>
</div>
<div id="loading">Загружаю Эмили…</div>
<script>
"use strict";
const ORDER = ["idle", "wave", "walk", "run", "jump", "crouch", "hide"];
const ICONS = { idle: "🙂", wave: "👋", walk: "🚶‍♀️", run: "🏃‍♀️", jump: "⬆️", crouch: "⬇️", hide: "🙈" };
const SHOW_SECONDS = { idle: 6.4, wave: 4.6, walk: 4.0, run: 3.84, jump: 4.2, crouch: 4.0, hide: 6.4 };
const BLEND = 0.3;   // плавный переход между анимациями, секунд

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let data, images = [];
let current = "idle", animTime = 0, auto = true, autoLeft = SHOW_SECONDS.idle;
let blendFrom = null, blendT = 1;
let lastPose = null;

function loadImage(src) {
  return new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = src; });
}

async function start() {
  data = await (await fetch("emily_data.json")).json();
  images = await Promise.all(data.sprites.map(s => loadImage("parts/" + s.tex)));
  document.getElementById("loading").remove();
  buildButtons();
  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(loop);
}

function buildButtons() {
  const bar = document.getElementById("bar");
  ORDER.forEach((name, i) => {
    const b = document.createElement("button");
    b.dataset.anim = name;
    b.innerHTML = `<span class="k">${i + 1}</span>${ICONS[name]} ${shortTitle(name)}`;
    b.onclick = () => { setAuto(false); play(name); };
    bar.appendChild(b);
  });
  const a = document.createElement("button");
  a.className = "auto"; a.id = "autoBtn";
  a.innerHTML = `<span class="k">пробел</span>🔁 По кругу`;
  a.onclick = () => setAuto(!auto);
  bar.appendChild(a);
  const h = document.createElement("div");
  h.id = "hint";
  h.textContent = "Клавиши: 1–7 — анимации, ← → — предыдущая/следующая, пробел — по кругу";
  bar.appendChild(h);
  updateButtons();
}

function shortTitle(name) {
  return { idle: "Стоит", wave: "Машет", walk: "Идёт", run: "Бежит", jump: "Прыгает",
           crouch: "Приседает", hide: "Прячется" }[name];
}

function updateButtons() {
  document.querySelectorAll("#bar button[data-anim]").forEach(b => b.classList.toggle("on", b.dataset.anim === current));
  const a = document.getElementById("autoBtn");
  if (a) a.classList.toggle("off", !auto);
}

function setAuto(v) { auto = v; autoLeft = SHOW_SECONDS[current]; updateButtons(); }

function play(name) {
  if (lastPose) { blendFrom = lastPose; blendT = 0; }
  current = name; animTime = 0; autoLeft = SHOW_SECONDS[name];
  updateButtons();
}

function step(dir) {
  const i = (ORDER.indexOf(current) + dir + ORDER.length) % ORDER.length;
  play(ORDER[i]);
}

window.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "7") { setAuto(false); play(ORDER[+e.key - 1]); }
  else if (e.key === "ArrowRight") { setAuto(false); step(1); }
  else if (e.key === "ArrowLeft") { setAuto(false); step(-1); }
  else if (e.key === " ") { e.preventDefault(); setAuto(!auto); }
});

let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
}

// Кадр анимации (с повтором по кругу)
function poseAt(name, t) {
  const a = data.anims[name];
  const n = a.frames.length;
  const f = t * data.fps;
  const i0 = Math.floor(f) % n, i1 = (i0 + 1) % n, k = f - Math.floor(f);
  const A = a.frames[i0], B = a.frames[i1];
  // между кадрами — плавно; видимость (моргание) — как в ближайшем кадре
  return A.map((m, j) => {
    const m2 = B[j];
    if (!m || !m2) return k < 0.5 ? m : m2;
    return m.map((v, q) => v + (m2[q] - v) * k);
  });
}

function mixPose(P, Q, k) {
  return P.map((m, j) => {
    const m2 = Q[j];
    if (!m || !m2) return k < 0.5 ? m : m2;
    return m.map((v, q) => v + (m2[q] - v) * k);
  });
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#8cc7fa"); g.addColorStop(0.85, "#dcefff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const groundY = H * 0.86;
  // солнце
  const sx = W * 0.84, sy = H * 0.14, sr = Math.min(W, H) * 0.07;
  ctx.fillStyle = "#fff08c"; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffdb59"; ctx.beginPath(); ctx.arc(sx, sy, sr * 0.8, 0, 7); ctx.fill();
  // облака
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  const cr = Math.min(W, H) * 0.035;
  [[0.17, 0.2], [0.44, 0.12], [0.67, 0.28]].forEach(([x, y]) => {
    [[-1.2, 0.2], [0, -0.3], [1.2, 0.2], [0.3, 0.5]].forEach(([dx, dy]) => {
      ctx.beginPath(); ctx.arc(W * x + dx * cr, H * y + dy * cr, cr, 0, 7); ctx.fill();
    });
  });
  // трава
  ctx.fillStyle = "#8cd173"; ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = "#73b85c"; ctx.fillRect(0, groundY, W, 6);
  return groundY;
}

let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  animTime += dt;
  if (auto) { autoLeft -= dt; if (autoLeft <= 0) step(1); }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const groundY = drawBackground();

  // подпись
  const fs = Math.max(20, Math.min(46, W / 18));
  ctx.font = `800 ${fs}px system-ui, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.lineJoin = "round"; ctx.lineWidth = fs * 0.28; ctx.strokeStyle = "#d94d8c";
  ctx.strokeText(data.titles[current], W / 2, H * 0.03);
  ctx.fillStyle = "#fff"; ctx.fillText(data.titles[current], W / 2, H * 0.03);

  // Эмили: высота ~ 780 единиц скелета (с прыжком нужно запас сверху)
  const scale = Math.min((groundY - H * 0.03 - fs * 1.4) / 960, W / 560);
  let pose = poseAt(current, animTime);
  if (blendFrom && blendT < 1) {
    blendT = Math.min(1, blendT + dt / BLEND);
    pose = mixPose(blendFrom, pose, blendT * blendT * (3 - 2 * blendT));
  }
  lastPose = pose;
  const ox = W / 2, oy = groundY - 4 * scale;
  // тень
  ctx.fillStyle = "rgba(40,80,30,0.18)";
  ctx.beginPath(); ctx.ellipse(ox, groundY + 2, 95 * scale, 16 * scale, 0, 0, 7); ctx.fill();
  for (let j = 0; j < pose.length; j++) {
    const m = pose[j];
    if (!m) continue;
    ctx.setTransform(
      dpr * scale * m[0], dpr * scale * m[1], dpr * scale * m[2], dpr * scale * m[3],
      dpr * (ox + scale * m[4]), dpr * (oy + scale * m[5]));
    ctx.drawImage(images[j], 0, 0);
  }
  requestAnimationFrame(loop);
}

start().catch(err => {
  document.getElementById("loading").textContent = "Не получилось загрузить: " + err;
});
</script>
</body>
</html>
