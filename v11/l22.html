  await T.repeat('e22_jetzt_ich');
  abiha.set('idle'); await emily.walkTo(SLX - 0.04); await T.glide(emily, SLX - 0.01, 0.95, 900, 'ease-out');
  sfx.whoosh(); emily.set('laugh'); await T.glide(emily, SLX + 0.12, 0.03, 900, 'ease-in'); emily.set('idle'); await T.glide(emily, SLX + 0.12, 0, 200);
  emily.hop(); abiha.hop();
  await T.bone(emily);

  /* качели: попросить подтолкнуть, считаем толчки до 5 */
  await abiha.say('b22_schaukeln');
  await T.repeat('e22_anschubsen');
  await abiha.say('b22_natuerlich');
  abiha.walkTo(SWX - 0.13); await emily.walkTo(SWX);
  await T.glide(emily, SWX, 0.3, 500, 'ease-out'); emily.k = 0.86; emily.place();
  await play('n22_schubs');
  for (let n = 1; n <= 5; n++){
    await T.tap([abiha], 'n22_schubs', 'r_tipp_licht');
    T.swing([emily, seat], false); await T.glide(abiha, SWX - 0.09, 0, 180, 'ease-out');
    T.swing([emily, seat], true, beamY()); sfx.whoosh(); emily.set('laugh');
    T.glide(abiha, SWX - 0.13, 0, 300); await count(n);
  }
  hideNum(); await sleep(1200);
  await T.repeat('e22_danke');
  T.swing([emily, seat], false); emily.k = 1; emily.set('idle'); await T.glide(emily, SWX + 0.07, 0, 500, 'ease-out');
  T.hearts(abiha); await T.bone(abiha);

  /* песочница: ведёрко и лопатка, «Hier, bitte!», три башни */
  await abiha.say('b22_sand');
  abiha.walkTo(SBX + 0.18); await emily.walkTo(SBX - 0.22);
  await emily.say('e22_sandkuchen');
  await abiha.say('b22_eimer');
  toys.forEach(t => t.el.hidden = false); sfx.pop();
  await play('n22_tipp_eimer');
  await T.tap([toys[1]], 'n22_tipp_eimer', 'r_tipp_licht'); sfx.ding();
  await play('n22_tipp_schaufel');
  await T.tap([toys[2]], 'n22_tipp_schaufel', 'r_tipp_licht'); sfx.ding();
  emily.set('crouch'); await T.repeat('e22_hier_bitte');
  await Promise.all([T.move(toys[1], SBX + 0.12, 0.9, 600), T.move(toys[2], SBX + 0.22, 0.9, 600)]);
  toys.forEach(t => t.el.hidden = true); emily.set('idle');
  await abiha.say('b22_danke');
  await emily.say('e22_sandburg');
  abiha.set('jump'); abiha.hop(); await abiha.say('b22_helfe'); abiha.set('idle');
  castle.el.hidden = false; await play('n22_tuerme');
  for (let n = 1; n <= 3; n++){
    await T.tap([castle], 'n22_tuerme', 'r_tipp_licht');
    castle.el.innerHTML = CASTLE(n); T.burst(castle); sfx.pop(); emily.set(n % 2 ? 'crouch' : 'idle'); await count(n);
  }
  hideNum(); emily.set('jump'); abiha.set('jump'); emily.hop(); abiha.hop(); sfx.ding();
  await T.bone(castle); emily.set('idle'); abiha.set('idle');

  /* бег наперегонки */
  await T.repeat('e22_wette');
  await abiha.say('b22_schneller');
  castle.el.hidden = true;
  abiha.walkTo(0.12); await emily.walkTo(0.22);
  await T.repeat('e22_los');
  sfx.whoosh(); emily.set('walk'); abiha.set('run');
  await Promise.all([emily.walkTo(0.82, 1500), abiha.walkTo(0.72, 1500)]);
  emily.set('jump'); abiha.set('jump'); emily.hop(); abiha.hop(); sfx.ding();
  await play('n22_gleich');
  abiha.set('laugh'); await abiha.say('b22_spass');
  emily.set('idle'); abiha.set('idle');
  await T.bone(emily);
  await T.repeat('e22_gerne');
  T.hearts(emily); T.hearts(abiha);
  abiha.set('peace'); await abiha.say('b22_bleiben');
  emily.set('wave'); await sleep(500);
}
T.start(IMG.abiha_wave[0], () => { T.place = 'kita'; setupKita(); });
T.place = 'kita'; setupKita();
</script>
