<script>
/* Уровень 39: кукольный театр. Ширма с занавесом, над ней куклы: Кашпер (Эмили) и крокодил. «Hallo, Kinder! Seid ihr alle da?» — «Ja!».
   Крокодил крадётся, дети кричат «Kasper, pass auf! Hinter dir!», Кашпер поворачивается — крокодил прячется («Wo? Ich sehe kein Krokodil!»).
   На третий раз — громко «Weg mit dir, Krokodil!» (T.firm без обидчика): чем громче, тем дальше убегает крокодил.
   Пауль хватает куклу: шаг 1 «Paul, ich spiele gerade. Du kannst gleich.», шаг 2 «Nein, Paul! Warte bitte. Du kannst das Krokodil spielen!» — компромисс.
   Второй спектакль: «Hallo, Krokodil! Möchtest du mein Freund sein?» — «Ja!». Хлопаем 5 раз (счёт). */
const LEVEL = 39, FRIENDS = ['paul', 'isabel', 'abiha'];
const STICKER = '<svg viewBox="0 0 100 100"><path d="M34 30 Q50 0 66 30 Z" fill="#ff5a4a"/><circle cx="66" cy="12" r="5" fill="#ffd34d"/><circle cx="50" cy="42" r="16" fill="#ffd7b5" stroke="#c9895a" stroke-width="3"/><circle cx="50" cy="46" r="5" fill="#ff7a59"/><path d="M30 92 Q32 58 50 56 Q68 58 70 92 Z" fill="#ffd34d" stroke="#d6a21e" stroke-width="3"/><circle cx="44" cy="40" r="2.5" fill="#333"/><circle cx="56" cy="40" r="2.5" fill="#333"/></svg>';
const RUG = 0.3;
function drawScene(g, W, H, L){ drawKita(g, W, H, L, RUG); }
const BOOTH = '<svg viewBox="0 0 200 160"><rect x="6" y="40" width="188" height="118" rx="6" fill="#c9584a" stroke="#8a3a2e" stroke-width="5"/><path d="M6 40 Q30 60 52 40 Q76 60 100 40 Q124 60 148 40 Q172 60 194 40" fill="#ffd34d" stroke="#d6a21e" stroke-width="4"/><rect x="0" y="34" width="200" height="12" rx="6" fill="#8a3a2e"/><path d="M40 70 h120 M40 100 h120 M40 130 h120" stroke="#a8453a" stroke-width="5"/></svg>';
const KASPER = '<svg viewBox="0 0 80 110"><path d="M22 34 Q40 -6 58 34 Z" fill="#ff5a4a" stroke="#c43a2e" stroke-width="3"/><circle cx="58" cy="8" r="7" fill="#ffd34d"/><circle cx="40" cy="44" r="18" fill="#ffd7b5" stroke="#c9895a" stroke-width="3"/><circle cx="40" cy="50" r="6" fill="#ff7a59"/><circle cx="33" cy="40" r="3" fill="#333"/><circle cx="47" cy="40" r="3" fill="#333"/><path d="M32 56 Q40 64 48 56" fill="none" stroke="#8a3a2e" stroke-width="3" stroke-linecap="round"/><path d="M14 110 Q16 66 40 62 Q64 66 66 110 Z" fill="#ffd34d" stroke="#d6a21e" stroke-width="3"/><path d="M14 80 Q2 70 6 60 M66 80 Q78 70 74 60" stroke="#ffd7b5" stroke-width="8" stroke-linecap="round" fill="none"/></svg>';
const CROC = '<svg viewBox="0 0 140 90"><path d="M10 60 Q10 30 44 28 L120 30 Q136 34 134 46 L96 52 L134 58 Q136 70 120 72 L44 74 Q10 76 10 60 Z" fill="#3cc36a" stroke="#24924a" stroke-width="4" stroke-linejoin="round"/><path d="M60 52 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 M60 56 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6" fill="#fff" stroke="#fff" stroke-width="2"/><circle cx="48" cy="22" r="10" fill="#3cc36a" stroke="#24924a" stroke-width="4"/><circle cx="50" cy="20" r="4" fill="#333"/><path d="M30 74 V90 M50 74 V90" stroke="#24924a" stroke-width="8" stroke-linecap="round"/></svg>';
const HANDS = '<svg viewBox="0 0 100 80"><path d="M20 70 Q8 40 22 18 Q28 10 34 18 L40 40 L44 10 Q48 2 54 8 L54 40 Z" fill="#ffd7b5" stroke="#c9895a" stroke-width="4" stroke-linejoin="round"/><path d="M80 70 Q92 40 78 18 Q72 10 66 18 L60 40 L56 10 Q52 2 46 8 L46 40 Z" fill="#ffd7b5" stroke="#c9895a" stroke-width="4" stroke-linejoin="round"/><path d="M50 0 v-6 M38 2 l-4 -6 M62 2 l4 -6" stroke="#ffd34d" stroke-width="4"/></svg>';
let emily, abiha, isabel, paul, heike, booth, kasper, croc, hands;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'surprised'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'jump', 'laugh', 'sit', 'think'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
const BX = 0.68, TOP = () => L.floorY - L.hE*0.92;
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  heike = T.hero('sommer', {x: 0.06, h: 1.45, poses: ['idle', 'blink', 'talk', 'wave']});
  abiha = T.hero('abiha', {x: 0.2, poses: AP}); abiha.set('sit');
  isabel = T.hero('isabel', {x: 0.32, h: 0.95, poses: KP});
  paul = T.hero('paul', {x: 0.44, h: 0.97, poses: KP});
  emily = T.hero('emily', {x: BX, outfit: 'shoes', poses: EP}); emily.el.style.zIndex = 20;
  booth = T.prop(BOOTH, {x: BX, py: () => L.floorY + L.hE*0.02, w: 1.15, ratio: 0.8, z: 45});
  kasper = T.prop(KASPER, {x: BX - 0.04, py: TOP, w: 0.34, ratio: 110/80, z: 44});
  croc = T.prop(CROC, {x: BX + 0.2, py: TOP, w: 0.4, ratio: 90/140, z: 43}); croc.el.hidden = true;
  hands = T.prop(HANDS, {x: 0.3, y: 0.3, w: 0.3, ratio: 0.8, z: 60}); hands.el.hidden = true;
}
/* кукла «говорит»: качается, пока звучит фраза */
async function puppet(p, clip, hero){ const a = p.el.animate([{transform: 'rotate(-6deg)'}, {transform: 'rotate(6deg)'}], {duration: 260, iterations: Infinity, direction: 'alternate'}); try { if (hero) await T.repeat(clip, hero); else await play(clip); } finally { a.cancel(); } }
async function crocSneak(){ croc.el.hidden = false; croc.o.x = BX + 0.22; croc.place(); await T.move(croc, BX + 0.06, TOP()/L.H, 1400); }
async function crocHide(){ await T.move(croc, BX + 0.22, (TOP() + L.hE*0.4)/L.H, 300); croc.el.hidden = true; }

async function story(){
  await play('n39_intro');
  heike.set('talk'); await heike.say('s39_vorhang'); heike.set('idle'); sfx.fanfare();
  /* Кашпер здоровается */
  const kas = kasper.el; let a = kas.animate([{transform: 'rotate(-6deg)'}, {transform: 'rotate(6deg)'}], {duration: 260, iterations: Infinity, direction: 'alternate'});
  await T.repeat('e39_hallo'); a.cancel();
  abiha.set('laugh'); await abiha.say('b39_ja'); isabel.set('jump'); await isabel.say('i39_ja'); abiha.set('sit'); isabel.set('idle');
  await T.bone(kasper);
  /* крокодил крадётся — дети кричат — Кашпер оборачивается, крокодил прячется */
  for (let k = 0; k < 2; k++){
    await play(k ? 'n39_wieder' : 'n39_kroko'); await crocSneak();
    isabel.set('jump'); isabel.hop(); await isabel.say('i39_pass'); abiha.set('think'); await abiha.say('b39_kroko'); isabel.set('idle'); abiha.set('sit');
    kasper.el.style.transform = 'scaleX(-1)'; sfx.whoosh(); await crocHide();
    a = kas.animate([{transform: 'scaleX(-1) rotate(-6deg)'}, {transform: 'scaleX(-1) rotate(6deg)'}], {duration: 260, iterations: Infinity, direction: 'alternate'});
    await T.repeat('e39_wo'); a.cancel(); kasper.el.style.transform = '';
    await Promise.all([play('k_laugh'), play('i_hihi'), play('p_hihi')]);
  }
  /* громко прогнать крокодила */
  await crocSneak(); kasper.el.style.transform = 'scaleX(-1)';
  await play('n39_laut');
  const max = await T.firm('e39_weg', {need: 1.8});
  sfx.whoosh(); await T.move(croc, Math.min(1.2, BX + 0.3 + Math.min(0.3, max*0.1)), TOP()/L.H, 600); croc.el.hidden = true; kasper.el.style.transform = '';
  await play('n39_weglaufen'); await T.bone(emily);

  /* Пауль хватает куклу */
  paul.set('talk'); await paul.walkTo(BX - 0.2, 900); paul.face(false); await paul.say('p39_ich'); paul.set('idle');
  await T.repeat('e39_gleich');
  paul.set('talk'); await paul.say('p39_jetzt'); paul.set('idle'); paul.hop();
  await play('n24_fester');
  await T.firm('e39_warte', {who: paul, step: 2, dir: -1});
  paul.set('jump'); paul.hop(); await paul.say('p39_kroko'); paul.set('idle');
  await T.bone(paul);

  /* второй спектакль: Пауль — крокодил, становятся друзьями */
  await paul.walkTo(BX + 0.12, 700); paul.el.style.zIndex = 20; paul.face(true);
  await play('n39_zweite');
  croc.el.hidden = false; croc.o.x = BX + 0.08; croc.place();
  const c = croc.el.animate([{transform: 'rotate(-5deg)'}, {transform: 'rotate(5deg)'}], {duration: 240, iterations: Infinity, direction: 'alternate'});
  await paul.say('p39_rrr'); c.cancel();
  kasper.el.style.transform = 'scaleX(-1)';
  a = kas.animate([{transform: 'scaleX(-1) rotate(-6deg)'}, {transform: 'scaleX(-1) rotate(6deg)'}], {duration: 260, iterations: Infinity, direction: 'alternate'});
  await T.repeat('e39_freund'); a.cancel();
  await paul.say('p39_lieb'); T.hearts(croc); T.hearts(kasper);
  /* хлопаем */
  hands.el.hidden = false; await play('n39_klatschen');
  for (let i = 1; i <= 5; i++){ await T.tap([hands], 'n39_klatschen', 'r39_klatschen'); sfx.noise(120, 2500, .5); hands.el.animate([{transform: 'scale(1)'}, {transform: 'scale(.8)'}, {transform: 'scale(1)'}], {duration: 200}); showNum(i); await emily.say('e_' + i); }
  hideNum(); hands.el.hidden = true; await play('n39_fuenf'); sfx.fanfare();
  await T.bone(emily);
  emily.el.style.zIndex = paul.el.style.zIndex = '';
  await Promise.all([emily.walkTo(0.56, 600), paul.walkTo(0.44, 700)]); paul.face(false);
  [emily, isabel, paul].forEach(h => h.set('jump')); abiha.set('laugh'); await play('n39_ende');
  [emily, isabel, paul, abiha].forEach(h => h.set('idle'));
}
T.start(IMG.abiha_laugh[0], setup);
setup();
</script>
