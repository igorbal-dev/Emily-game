<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Emily"><title>Wer ist dran? Уровень 13</title>
<link rel="stylesheet" href="js/mini.css">
<!-- Уровень 13 «Wer ist dran?» — площадка: попросить покачаться, подождать очереди, уступить горку, извиниться и помочь. ТЗ: docs/tz/level-13.md -->
</head><body>
<div id="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <a id="home" href="index.html" aria-label="Карта уровней"><svg viewBox="0 0 24 24" fill="none" stroke="#ff7a59" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></a>
  <div id="purse" hidden><span id="pursePic"></span><b id="purseNum">0</b></div>
  <div id="count" hidden><div id="num"></div></div>
  <button id="mic" hidden aria-label="Микрофон"><span id="level"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="#fff"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
  </button>
  <button id="again" hidden aria-label="Ещё раз">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
  </button>
  <div id="start"><button id="go" aria-label="Играть"><span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></span></button></div>
  <div id="rotate" hidden><svg viewBox="0 0 100 100"><rect x="30" y="12" width="40" height="76" rx="8" fill="#fff" stroke="#2f80ed" stroke-width="5"/><circle cx="50" cy="78" r="4" fill="#2f80ed"/></svg></div>
</div>
<script>
const IMG = __IMG__;  /*IMG: emily_{idle,blink,mouth1,mouth2,wave,jump,surprised,crouch,laugh,walk}_out isabel_{idle,blink,talk,wave,jump,hide} paul_{idle,blink,talk,wave,jump,hide}*/
const SND = __SND__;  /*SND: e_{1..5} a_super a_toll a_prima a_juhu a_wunderbar a_nach r_like_emily a_final r_tipp_licht r_choose_kind e_danke*/
</script>
<script src="js/mini.js"></script>
<script src="js/talk.js"></script>
<script src="js/chunks.js"></script>
<script src="js/repeat.js"></script>
<script src="js/scenes.js"></script>
<script>
/* Уровень 13: Эмили на площадке. Качели — «Darf ich auch mal schaukeln?», ждём «noch fünfmal», говорим «Danke».
   Горка — выбираем, как поступить, и говорим «Du zuerst, dann ich!». Песочница — «Entschuldigung!» и «Ich helfe dir!». */
const LEVEL = 13;
const STICKER = '<svg viewBox="0 0 100 100"><path d="M18 92 L32 10 L68 10 L82 92" fill="none" stroke="#8a5a1e" stroke-width="7" stroke-linecap="round"/><path d="M26 10 h48" stroke="#8a5a1e" stroke-width="8" stroke-linecap="round"/><path d="M42 12 L38 62 M58 12 L62 62" stroke="#c9a77a" stroke-width="3"/><rect x="32" y="60" width="36" height="9" rx="4" fill="#ff7a59" stroke="#d65a3b" stroke-width="3"/><path d="M50 80 C38 70 40 58 48 60 C50 61 50 63 50 64 C50 63 50 61 52 60 C60 58 62 70 50 80 Z" fill="#ff6b8a"/></svg>';

/* ---------- площадка: небо, деревья, качели, горка, песочница ---------- */
const SWX = 0.3, SLX = 0.74, SBX = 0.52;
function drawScene(g, W, H, L){ drawPlayground(g, W, H, L, SWX, SLX, SBX); }

/* ---------- предметы ---------- */
const SEAT = '<svg viewBox="0 0 45 125" preserveAspectRatio="none"><path d="M8 0 V118 M37 0 V118" stroke="#7a5a3a" stroke-width="2.2"/><rect x="2" y="114" width="41" height="9" rx="4" fill="#ff7a59" stroke="#d65a3b" stroke-width="2"/></svg>';
const CASTLE = '<svg viewBox="0 0 100 80"><path d="M10 78 Q50 70 90 78 V48 H10 Z" fill="#e8c27a" stroke="#b9904a" stroke-width="3"/><path d="M22 50 V26 h14 v24 M64 50 V26 h14 v24 M40 50 V12 h20 v38" fill="#f0cf8a" stroke="#b9904a" stroke-width="3" stroke-linejoin="round"/><path d="M50 12 V0 l12 5 l-12 5" fill="#ff7a59" stroke="#d65a3b" stroke-width="2"/><circle cx="50" cy="32" r="4" fill="#b9904a"/></svg>';
const FLAT = '<svg viewBox="0 0 100 80"><path d="M4 78 Q20 62 40 66 Q60 58 78 66 Q92 66 96 78 Z" fill="#e8c27a" stroke="#b9904a" stroke-width="3"/><path d="M60 60 l12 -4 l-2 8" fill="#ff7a59" stroke="#d65a3b" stroke-width="2"/></svg>';
const BUCKET = '<svg viewBox="0 0 80 90"><path d="M12 30 L20 86 H60 L68 30 Z" fill="#ff5a5a" stroke="#b83232" stroke-width="4" stroke-linejoin="round"/><ellipse cx="40" cy="30" rx="28" ry="7" fill="#ffd0c8" stroke="#b83232" stroke-width="4"/><path d="M14 32 Q40 -6 66 32" fill="none" stroke="#b83232" stroke-width="4"/><path d="M60 50 l18 -30" stroke="#2f80ed" stroke-width="6" stroke-linecap="round"/><path d="M74 14 l10 -6 l2 10 z" fill="#2f80ed"/></svg>';

let emily, isabel, paul, seat, castle, bucket;
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  seat = T.prop(SEAT, {x: SWX, py: () => L.floorY - L.hE*0.27, w: 0.42, ratio: 1.28/0.42, z: 35});
  castle = T.prop(CASTLE, {x: SBX + 0.03, y: 0, py: () => L.floorY + L.hE*0.06, w: 0.5, ratio: 0.8, z: 38});
  bucket = T.prop(BUCKET, {x: SBX - 0.12, py: () => L.floorY + L.hE*0.08, w: 0.26, ratio: 90/80, z: 55});
  bucket.el.hidden = true;
  isabel = T.hero('isabel', {x: SWX, h: 0.86, lift: 0.3, poses: ['idle', 'blink', 'talk', 'wave', 'jump', 'hide']});
  paul = T.hero('paul', {x: 0.88, h: 0.95, poses: ['idle', 'blink', 'talk', 'wave', 'jump', 'hide']});
  emily = T.hero('emily', {x: 0.08, outfit: 'out', poses: ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'crouch', 'laugh', 'walk']});
}
const beamY = () => L.floorY - L.hE*1.55;

async function story(){
  /* качели: попросить и подождать */
  T.swing([isabel, seat], true, beamY());
  await play('n13_intro');
  await emily.walkTo(0.52);
  isabel.set('wave'); await isabel.say('i13_hallo'); isabel.set('idle');
  emily.set('wave'); await sleep(300); emily.set('idle');
  await T.repeat('e13_darf');
  await isabel.say('i13_gleich');
  for (let i = 1; i <= 5; i++){ showNum(i); emily.set(i % 2 ? 'mouth1' : 'idle'); await Promise.all([play('e_' + i), sleep(1500)]); }
  hideNum(); emily.set('idle');
  T.swing([isabel, seat], false); await sleep(200);
  await isabel.say('i13_dran');
  isabel.set('jump'); await T.glide(isabel, 0.42, 0, 600, 'ease-out'); isabel.set('idle');
  await T.repeat('e13_danke');
  await T.bone(emily);
  await emily.walkTo(SWX); await T.glide(emily, SWX, 0.3, 500, 'ease-out'); emily.k = 0.86; emily.place();
  T.swing([emily, seat], true, beamY()); sfx.whoosh(); emily.set('laugh');
  await praise(); await sleep(2600); sfx.whoosh(); await sleep(1600);
  T.swing([emily, seat], false); emily.k = 1; emily.set('idle'); await T.glide(emily, SWX + 0.06, 0, 500, 'ease-out');
  isabel.walkTo(SBX + 0.17);

  /* горка: уступить */
  await emily.walkTo(SLX - 0.12);
  paul.walkTo(SLX - 0.03);
  await play('n13_rutsche');
  await T.choose([
    {parts: [{img: 'emily_wave_out', x: 40, h: 74}, {img: 'paul_hide', x: 66, h: 52}, {fx: 'zap', x: 46, y: 34}, {fx: 'tears', x: 64, y: 30}], clip: 'n13_opt1', ok: false},
    {parts: [{img: 'emily_wave_out', x: 36, h: 74}, {img: 'paul_jump', x: 66, h: 74}, {fx: 'hearts', x: 48, y: 12}], clip: 'n13_opt2'}
  ], 'a_was_besser', 'r_choose_kind', 'a_nicht_nett');
  await T.repeat('e13_du_zuerst');
  paul.set('jump'); await paul.say('p13_danke'); paul.set('idle');
  await T.bone(emily);
  await paul.walkTo(SLX - 0.04); await T.glide(paul, SLX - 0.01, 0.95, 900, 'ease-out');
  sfx.whoosh(); paul.set('jump'); await T.glide(paul, SLX + 0.19, 0.03, 900, 'ease-in'); paul.set('idle'); await T.glide(paul, SLX + 0.2, 0, 200);
  await emily.walkTo(SLX - 0.04); await T.glide(emily, SLX - 0.01, 0.95, 900, 'ease-out');
  sfx.whoosh(); emily.set('laugh'); await T.glide(emily, SLX + 0.12, 0.03, 900, 'ease-in'); emily.set('idle'); await T.glide(emily, SLX + 0.12, 0, 200);
  paul.hop(); emily.hop();
  emily.set('wave'); await sleep(300); emily.set('idle');
  await T.repeat('e13_zusammen');
  paul.set('wave'); sfx.ding(); await sleep(700); paul.set('idle');

  /* песочница: извиниться и помочь */
  paul.walkTo(SBX + 0.32);
  await emily.walkTo(SBX + 0.03, 1400);
  sfx.bonk(); castle.el.innerHTML = FLAT; emily.set('surprised');
  await play('n13_oops');
  isabel.set('hide'); await sleep(900); isabel.set('idle');
  await emily.walkTo(SBX - 0.08); emily.set('idle');
  await T.repeat('e13_entschuldigung');
  await isabel.say('i13_schon_gut');
  await T.repeat('e13_helfe');
  bucket.el.hidden = false; sfx.pop();
  await play('n13_tipp_eimer');
  await T.tap([bucket], 'n13_tipp_eimer', 'r_tipp_licht');
  emily.set('crouch'); await T.move(bucket, SBX + 0.03, 0, 600); sfx.whoosh(); await sleep(300);
  castle.el.innerHTML = CASTLE; castle.o.w = 0.62; castle.place(); bucket.el.hidden = true; sfx.ding();
  emily.set('jump'); isabel.set('jump'); paul.set('jump'); emily.hop(); isabel.hop(); paul.hop();
  await T.bone(castle);
  await play('n13_ende');
  emily.set('idle'); isabel.set('wave'); paul.set('wave');
}
T.start(IMG.emily_wave_out[0], setup);
setup();
</script>
<script src="js/screen.js"></script>
<script src="js/common.js"></script>
</body></html>
