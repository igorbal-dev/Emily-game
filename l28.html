(function(){ const css = document.createElement('style'); css.textContent = `

let emily, mark, theo, memo, cards = [], pileE, pileM;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'surprised', 'laugh'];
const MP = ['idle', 'blink', 'talk', 'mouth', 'sad', 'wave', 'laugh', 'walk', 'surprised'];
function setup(){

  memo = document.createElement('div'); memo.id = 'memo'; stage.appendChild(memo);

  keys.forEach(k => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = BACK; b.dataset.k = k; memo.appendChild(b); cards.push(b); });
  pileE = document.createElement('div'); pileE.className = 'pile'; pileE.style.left = '2%'; pileE.style.bottom = '4%'; stage.appendChild(pileE);

const open = b => { b.innerHTML = FACES[b.dataset.k](); b.classList.add('open'); sfx.pop(); };
const close = b => { b.innerHTML = BACK; b.classList.remove('open'); };
const live = () => cards.filter(b => !b.classList.contains('gone'));
/* ждём нажатия на закрытую карточку: подсказки два раза по-немецки, потом по-русски */
function pickCard(){
  return new Promise(res => {
    let done = false; const list = live().filter(b => !b.classList.contains('open'));
    const h = e => { const b = e.currentTarget; if (done || b.classList.contains('open')) return; done = true; list.forEach(x => { x.removeEventListener('click', h); x.classList.remove('hint'); }); res(b); };
    list.forEach(b => b.addEventListener('click', h));
    (async () => { let k = 0; while (!done){ await sleep(7000); if (done) break; k++; list.forEach(b => b.classList.add('hint')); if (!speaking) await play(k % 3 === 0 ? 'r28_tipp' : 'n28_tipp'); } })();
  });
}
function toPile(pile, a, b){ for (const c of [a, b]) c.classList.add('gone'); const i = document.createElement('button'); i.type = 'button'; i.innerHTML = FACES[a.dataset.k](); pile.appendChild(i); sfx.ding(); }
/* ход: открыть две; пара — в стопку игрока */
async function turnEmily(){
  const a = await pickCard(); open(a); const b = await pickCard(); open(b); await sleep(700);
  if (a.dataset.k === b.dataset.k){ toPile(pileE, a, b); await play('n28_paar'); return true; }
  await play('n28_kein'); close(a); close(b); return false;
}
async function turnMark(smart){
  const l = live(); let a = pick(l), b;
  if (smart){ b = l.find(x => x !== a && x.dataset.k === a.dataset.k); } else { b = pick(l.filter(x => x !== a)); }
  mark.set('talk'); open(a); await sleep(600); open(b); await sleep(900); mark.set('idle');
  if (a.dataset.k === b.dataset.k){ toPile(pileM, a, b); mark.set('laugh'); await play('n28_mark_paar'); await mark.say('k_ja'); mark.set('idle'); return true; }
  await play('n28_kein'); close(a); close(b); return false;
}
/* Марк хватает карточки: они разлетаются и перемешиваются */
async function markGrab(){
  mark.set('laugh'); mark.hop(); sfx.whoosh(); await mark.say('k_meins');
  const l = live(); for (const c of l.slice(0, 3)) c.animate([{transform: 'none'}, {transform: `translate(${(Math.random() - .5)*120}px,${60 + Math.random()*80}px) rotate(${(Math.random() - .5)*90}deg)`}, {transform: 'none'}], {duration: 700});
  await sleep(700); const ks = l.map(c => c.dataset.k).sort(() => Math.random() - .5); l.forEach((c, i) => { c.dataset.k = ks[i]; close(c); });
  mark.set('idle');
}
async function count(pile){ const items = [...pile.children]; let n = 0;
  for (const it of items){ await new Promise(r => { it.classList.add('tapme'); const h = () => { it.removeEventListener('click', h); it.classList.remove('tapme'); r(); }; it.addEventListener('click', h); });
    n++; showNum(n); sfx.pop(); await emily.say('e_' + n); }
  await sleep(500); hideNum(); return n; }

async function story(){

  /* Марк приходит и хватает карточки: шаги 1–3 */
