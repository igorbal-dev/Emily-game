<title>Эмили-конструктор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Одна сцена: Эмили на полу комнаты, снизу четыре круглые кнопки-движения. */
:root{
  --wall:#ffe9c7; --floor:#e8b27a; --ink:#3b2a1f; --btn:#ff7a59; --btn-on:#32b67a; --card:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#3a2e44;--floor:#5a4232;--ink:#f6eee6;--btn:#ff8a6b;--btn-on:#3fc98a;--card:#2a2233;color-scheme:dark}}
:root[data-theme="dark"]{--wall:#3a2e44;--floor:#5a4232;--ink:#f6eee6;--btn:#ff8a6b;--btn-on:#3fc98a;--card:#2a2233;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font:600 16px/1.4 "Trebuchet MS",system-ui,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:12px}
.stage{flex:1;min-height:320px;position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(var(--wall) 62%,var(--floor) 62%)}
.stage::after{content:"";position:absolute;left:30%;right:30%;bottom:3%;height:5%;border-radius:50%;background:radial-gradient(ellipse,rgba(60,30,10,.3),rgba(60,30,10,0) 70%)}
canvas{position:absolute;left:0;top:0;width:100%;height:96%;z-index:1}
.bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{font:700 15px/1 inherit;font-family:inherit;border:0;border-radius:999px;padding:14px 20px;background:var(--btn);color:#fff;cursor:pointer;min-width:120px}
button[aria-pressed="true"]{background:var(--btn-on)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.note{text-align:center;font-weight:500;opacity:.8;margin:0}
</style>
<div class="stage"><canvas id="c" aria-label="Эмили"></canvas></div>
<div class="bar">
  <button id="talk" type="button" aria-pressed="false">Говорит</button>
  <button id="wave" type="button" aria-pressed="false">Машет</button>
  <button id="walk" type="button" aria-pressed="false">Шагает</button>
  <button id="jump" type="button" aria-pressed="false">Прыгает</button>
  <button id="happy" type="button" aria-pressed="false">Радуется</button>
</div>
<p class="note">Проба: Эмили собрана из 12 частей и 8 наклеек лица. Дышит и моргает сама.</p>
<script src="puppet.js"></script>
<script>
(async () => {
  const p = await Puppet.create('emily/');
  const a = new PuppetActor(p, document.getElementById('c'));
  for (const id of ['talk', 'wave', 'walk', 'jump', 'happy']){
    const b = document.getElementById(id);
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on);
      if (id === 'happy') a.set({mood: on ? 'happy' : 'smile'}); else a.set({[id]: on});
    });
  }
})();
</script>
