talk,wave,jump,laugh,sad,dance}*/
const SND = {"a_final": "assets/snd/1f58eb1ff7c9.mp3", "a_juhu": "assets/snd/ab65e31fd892.mp3", "a_nach": "assets/snd/ca5aa096bdb0.mp3", "a_prima": "assets/snd/4beb6b79b97f.mp3", "a_super": "assets/snd/fe00647daef4.mp3", "a_toll": "assets/snd/288f2e5a7bca.mp3", "a_wunderbar": "assets/snd/2a1e6fe05fd4.mp3", "k_hallo": "assets/snd/b7966bf60a63.mp3", "k_laugh": "assets/snd/403616bb79cf.mp3", "r_like_emily": "assets/snd/9f24a0a81f00.mp3", "r_tipp_licht": "assets/snd/df132d7b84f0.mp3", "t_bark": "assets/snd/d5a7365a3230.mp3"};  /*SND: a_super a_toll a_prima a_juhu a_wunderbar a_nach r_like_emily a_final r_tipp_licht k_hallo k_laugh t_bark*/
/* фразы без записи — пока голос браузера (js/mini.js), тексты для озвучки — voice-next.md */

  n17_intro: 'Emily, Mark und Theo sind im Hof. Da ist ein neues Mädchen mit vielen Kartons!',
  f17_hund: 'Hallo! Ist das dein Hund?',
  e17_theo: 'Ja! Das ist Theo.',
  f17_name: 'Der ist süß! Ich heiße Sofia. Und du?',
  e17_emily: 'Ich heiße Emily.',
  f17_streicheln: 'Darf ich Theo streicheln?',

  f17_tschuess: 'Tschüss, Emily! Tschüss, Theo!'
};

<script>
/* Уровень 17: во дворе новая соседка София с коробками. Отвечаем на её вопросы («Ja! Das ist Theo.», «Ich heiße Emily.», «Ich bin fünf. Und du?»…),
   сами спрашиваем «Hast du auch ein Haustier?» — кошка Мими в окне пугается Тео, все смеются. В конце «Bis morgen, Sofia!». */
const LEVEL = 17, FRIENDS = ['sofia'];
const STICKER = '<svg viewBox="0 0 100 100"><path d="M14 52 L50 20 L86 52 V90 H14 Z" fill="#f4c9a8" stroke="#c98f55" stroke-width="5" stroke-linejoin="round"/><path d="M6 56 L50 16 L94 56" fill="none" stroke="#5aa8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="62" width="20" height="28" rx="3" fill="#7a4a22"/><rect x="22" y="56" width="14" height="14" fill="#9fd0ff"/><rect x="64" y="56" width="14" height="14" fill="#9fd0ff"/><path d="M50 50 C40 42 42 32 48 34 C50 35 50 37 50 38 C50 37 50 35 52 34 C58 32 60 42 50 50 Z" fill="#ff6b8a"/></svg>';
function drawScene(g, W, H, L){ drawYard(g, W, H, L, {boxes: true}); }

/* кошка Мими в окне Софии: пугается Тео — шерсть дыбом, прячется */
const CAT = '<svg viewBox="0 0 100 80"><path d="M22 34 L18 8 L38 24 Z M78 34 L82 8 L62 24 Z" fill="#9aa3ad" stroke="#5f6670" stroke-width="3" stroke-linejoin="round"/><ellipse cx="50" cy="46" rx="32" ry="28" fill="#9aa3ad" stroke="#5f6670" stroke-width="3"/><ellipse cx="50" cy="58" rx="16" ry="12" fill="#fff"/><circle cx="38" cy="42" r="6" fill="#ffd34d"/><circle cx="62" cy="42" r="6" fill="#ffd34d"/><ellipse cx="38" cy="42" rx="2" ry="5" fill="#222"/><ellipse cx="62" cy="42" rx="2" ry="5" fill="#222"/><path d="M46 52 l4 4 l4 -4 z" fill="#ff8fb8"/><path d="M14 52 h18 M14 58 h18 M68 52 h18 M68 58 h18" stroke="#5f6670" stroke-width="2"/></svg>';
const CAT_SCARED = CAT.replace('<ellipse cx="50" cy="46" rx="32" ry="28"', '<path d="M50 14 l6 8 l8 -6 l2 10 l10 -2 l-2 10 l10 4 l-8 6 l8 8 l-10 2 l4 10 l-12 -2 l-4 10 l-8 -8 l-8 8 l-4 -10 l-12 2 l4 -10 l-10 -2 l8 -8 l-8 -6 l10 -4 l-2 -10 l10 2 l2 -10 l8 6 z" fill="#9aa3ad" stroke="#5f6670" stroke-width="3" stroke-linejoin="round"/><ellipse cx="50" cy="46" rx="30" ry="26"').replace(/r="6" fill="#ffd34d"/g, 'r="9" fill="#ffd34d"');

let emily, mark, theo, sofia, cat;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'crouch', 'laugh', 'walk'];
const SP = ['idle', 'blink', 'talk', 'wave', 'jump', 'laugh', 'sad', 'dance'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  cat = T.prop(CAT, {px: () => L.W*WIN_X, py: () => yardWinY(L) + L.hE*0.36, w: 0.3, ratio: 0.8, z: 4}); cat.el.style.opacity = 0;
  sofia = T.hero('sofia', {x: 0.66, h: 0.95, poses: SP});
  theo = T.hero('theo', {x: -0.1, h: 0.48, poses: ['idle', 'blink', 'happy', 'lie', 'sniff', 'bark']});
  mark = T.hero('mark', {x: -0.2, h: 0.62, outfit: 'out', poses: ['idle', 'blink', 'laugh', 'wave', 'talk', 'walk']});
  emily = T.hero('emily', {x: -0.15, outfit: 'out', poses: EP});
}

async function story(){
  /* Эмили гуляет с Марком и Тео, во дворе девочка с коробками */
  theo.walkTo(0.44, 1500); mark.walkTo(0.12, 1500); await emily.walkTo(0.3, 1500);
  await play('n17_intro');
  sofia.set('wave'); await sofia.say('f17_hund'); sofia.set('idle');
  await T.repeat('e17_theo');
  theo.set('happy'); theo.hop(); play('t_bark'); await sleep(700); theo.set('idle');

  await sofia.say('f17_name');
  await T.repeat('e17_emily');
  sofia.set('jump'); await sleep(500); sofia.set('idle');
  await T.bone(emily);

  /* погладить Тео: Тео лижет Софии руку */
  await sofia.say('f17_streicheln');
  await T.repeat('e17_lieb');
  await theo.walkTo(0.58, 900); theo.set('happy'); theo.face(false);
  sofia.set('laugh'); T.hearts(theo); sfx.tone(900, 600, 140, 'sine', .12); await sleep(250); sfx.tone(900, 600, 140, 'sine', .12);
  await sofia.say('f17_kitzelt'); sofia.set('idle');
  await T.bone(sofia);

  /* сколько лет */
  await sofia.say('f17_alt');
  await T.repeat('e17_fuenf');
  showNum(5); sofia.set('jump'); await sofia.say('f17_auch_fuenf');
  emily.set('jump'); sofia.set('jump'); sfx.ding(); await sleep(700); hideNum(); emily.set('idle'); sofia.set('idle');

  /* где живёт */
  await sofia.say('f17_wohnst');
  await T.repeat('e17_wohne');
  await sofia.say('f17_neu');
  await T.bone(emily);

  /* брат */
  await sofia.say('f17_geschwister');
  await T.repeat('e17_bruder');
  await mark.walkTo(0.2, 600); mark.set('wave'); await mark.say('k_hallo'); mark.set('idle');
  sofia.set('wave'); await sleep(500); sofia.set('idle');

  /* Эмили спрашивает сама: кошка Мими боится собак — все смеются, Тео виновато ложится */
  await T.repeat('e17_haustier');
  await sofia.say('f17_katze');
  cat.el.animate([{opacity: 0, transform: 'translateY(30%)'}, {opacity: 1, transform: 'none'}], {duration: 500, fill: 'forwards'});
  await sleep(600);
  theo.set('bark'); play('t_bark'); await sleep(400);
  cat.el.innerHTML = CAT_SCARED; sfx.noise(500, 3000, .35); cat.el.animate([{transform: 'scale(1)'}, {transform: 'scale(1.3) translateY(-8%)'}, {transform: 'scale(1.2)'}], {duration: 400, fill: 'forwards'});
  await sofia.say('f17_angst');
  await cat.el.animate([{opacity: 1}, {opacity: 0, transform: 'translateY(40%)'}], {duration: 400, fill: 'forwards'}).finished.catch(() => {});
  cat.el.innerHTML = CAT;
  emily.set('laugh'); sofia.set('laugh'); mark.set('laugh');
  await Promise.all([play('k_laugh'), sleep(1500)]);
  theo.set('lie'); await play('n17_armer');
  emily.set('idle'); sofia.set('idle'); mark.set('idle');
  await T.bone(theo);
  theo.set('idle');

  /* садик */
  await sofia.say('f17_kita');
  await T.repeat('e17_kita');
  sofia.set('jump'); await sofia.say('f17_bald'); sofia.set('idle');
  emily.set('jump'); T.hearts(emily); T.hearts(sofia); await sleep(900); emily.set('idle');
  await T.bone(emily);

  /* до завтра */
  await T.repeat('e17_bis_morgen');
  sofia.set('wave'); emily.set('wave'); mark.set('wave'); await sofia.say('f17_tschuess');
  theo.set('happy'); play('t_bark'); await sleep(600);
  emily.set('idle'); mark.set('idle'); sofia.set('idle');
}
T.start(IMG.sofia_wave[0], setup);
setup();
</script>
