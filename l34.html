const RUG = 0.55;
function drawScene(g, W, H, L){ drawKita(g, W, H, L, RUG);

  const fy = L.floorY, hE = L.hE, x = W*0.08; g.fillStyle = '#fff'; g.fillRect(x, fy - hE*0.62, hE*0.5, hE*0.6); g.strokeStyle = '#8fb8dd'; g.lineWidth = hE*0.02; g.strokeRect(x, fy - hE*0.62, hE*0.5, hE*0.6);

}

const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'jump', 'laugh', 'think'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];

  await T.repeat('e24_freunde');
  isabel.set('jump'); isabel.hop(); await isabel.say('i34_ja'); isabel.set('idle'); T.hearts(isabel); T.hearts(emily);
  await T.bone(isabel);
  [emily, abiha, isabel, paul].forEach(h => h.set('jump')); await play('n34_ende');
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
}
