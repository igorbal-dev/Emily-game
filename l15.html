    apples = T.prop(APPLES, {px: at(0.42, 0), py: onFloor(0.38), w: 0.26, ratio: 0.7});
    carrots = T.prop(CARROTS, {px: at(0.42, 0.3), py: onFloor(0.38), w: 0.26, ratio: 0.7});
    milk = T.prop(MILK, {px: at(0.66, -0.13), py: onFloor(0.88), w: 0.15, ratio: 1.6});
    yogurt = T.prop(YOGURT, {px: at(0.66, 0.13), py: onFloor(0.88), w: 0.15, ratio: 1.2});
    candy = T.prop(CANDY, {px: at(0.88, -0.5), py: onFloor(0.62), w: 0.2, ratio: 0.5, z: 58});
    basket = T.prop(BASKET, {x: 0.25, py: onFloor(-0.06), w: 0.4, ratio: 0.7, z: 52});
    [bread, cheese, bananas, apples, carrots, milk, yogurt].forEach(p => p.el.classList.add('tight'));
    emily = T.hero('emily', {x: 0.3, outfit: 'out', poses: EP}); mark = T.hero('mark', {x: 0.13, h: 0.88, outfit: 'out', poses: MP}); });
  await play('n15_liste');
  await pickItem(bread, [cheese], 'n15_tipp_brot');
  await emily.walkTo(0.22);
  await pickItem(bananas, [apples, carrots], 'n15_tipp_bananen');
  await T.bone(basket);

  /* спросить продавца, где молоко */
  await play('n15_milch_weg');
  seller.set('wave'); await sleep(400); seller.set('idle');
  await T.repeat('e15_wo_milch');
  await seller.say('v15_milch');
  await emily.walkTo(0.5);
  await play('n15_tipp_milch');
  while (true){ const el = await T.tap([milk, yogurt], 'n15_tipp_milch', 'r_tipp_licht'); if (el === milk.el) break; sfx.bonk(); await play('n15_nicht'); }
  await T.move(milk, basket.o.x + 0.02, 0, 800); milk.o.py = onFloor(-0.02); milk.o.w *= 0.8; milk.place(); milk.el.style.zIndex = 54; sfx.ding();
  await T.bone(milk);

  /* Марк и конфета */
  await mark.walkTo(0.7); mark.set('laugh');
  await mark.say('k_15bonbon');
  await T.move(candy, 0.7, 0, 500); candy.o.py = onFloor(0.45); candy.place();
  await T.choose([
    {parts: [{img: 'emily_laugh_out', x: 40, h: 74}, {svg: CANDY, x: 46, y: 26, w: 16, hh: 9}, {fx: 'zap', x: 60, y: 30}], clip: 'n15_opt1', ok: false},
    {parts: [{img: 'emily_wave_out', x: 34, h: 74}, {img: 'mark_idle_out', x: 60, h: 62}, {svg: COIN, x: 80, y: 40, w: 14, hh: 18}, {fx: 'hearts', x: 46, y: 10}], clip: 'n15_opt2'}
  ], 'a_was_besser', 'r_choose_kind', 'a_nicht_gut');
  await emily.walkTo(0.6);
  await T.repeat('e15_bezahlen');
  mark.set('sad'); await sleep(700); mark.set('idle');
  await T.move(candy, basket.o.x - 0.02, 0, 800); candy.o.py = onFloor(-0.03); candy.o.w = 0.16; candy.place(); candy.el.style.zIndex = 54; sfx.pop();
  mark.set('laugh'); await praise(); mark.set('idle');
  await T.bone(candy);

  /* касса: заплатить */
  const goods = [bread, bananas, milk, candy, basket];
  emily.walkTo(0.64); mark.walkTo(0.52);
  await Promise.all(goods.map(p => T.move(p, p.o.x + 0.42, 0, 1200)));
  await seller.say('v15_hallo');
  const coins = [0.4, 0.49, 0.58].map(x => T.prop(COIN, {x, py: onFloor(-0.08), w: 0.22, ratio: 1, z: 62})); sfx.pop();
  await play('n15_tipp_geld');
  const left = [...coins];
  for (let i = 1; i <= 3; i++){
    const el = await T.tap(left, 'n15_tipp_geld', 'r_tipp_licht'); const c = left.find(p => p.el === el); left.splice(left.indexOf(c), 1);
    showNum(i); T.move(c, 0.8 + i*0.02, 0, 600).then(() => { c.o.py = onFloor(1.0); c.place(); }); await play('e_' + i); sfx.clink();
  }
  await sleep(500); hideNum(); coins.forEach(c => c.el.remove());
  await T.repeat('e15_hier');
  await seller.say('v15_tuete');
  await T.repeat('e15_ja_bitte');
  goods.forEach(p => p.el.hidden = true);
  const bag = T.prop(BAG, {x: 0.72, py: onFloor(-0.05), w: 0.4, ratio: 1, z: 58}); sfx.whoosh();
  seller.set('wave'); await seller.say('v15_tag'); seller.set('idle');
  await T.repeat('e15_ihnen_auch');
  await T.bone(bag);

  /* снова на улице: Тео рад */
  await T.go('street', () => { street(); emily.x = 0.62; mark.x = 0.5; T.prop(BAG, {x: 0.7, py: onFloor(-0.05), w: 0.36, ratio: 1, z: 58}); });
  theo.set('jump'); theo.hop(); await play('t_barks');
  theo.set('happy'); emily.set('laugh'); mark.set('laugh');
  await play('n15_theo');
  emily.set('idle'); mark.set('idle');
}
T.start(IMG.emily_wave_out[0], setup);
setup();
</script>
<script src="js/screen.js"></script>
<script src="js/common.js"></script>
</body></html>
