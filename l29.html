const SND = {"a_final": "assets/snd/1f58eb1ff7c9.mp3", "a_juhu": "assets/snd/ab65e31fd892.mp3", "a_nach": "assets/snd/ca5aa096bdb0.mp3", "a_prima": "assets/snd/4beb6b79b97f.mp3", "a_super": "assets/snd/fe00647daef4.mp3", "a_toll": "assets/snd/288f2e5a7bca.mp3", "a_wunderbar": "assets/snd/2a1e6fe05fd4.mp3", "e_1": "assets/snd/47c925770470.mp3", "e_2": "assets/snd/918ef9b62ef0.mp3", "e_3": "assets/snd/510e7125b84e.mp3", "e_4": "assets/snd/eedc12bfb218.mp3", "e_5": "assets/snd/61057bf82030.mp3", "e_6": "assets/snd/f1d18f32c4f6.mp3", "e_7": "assets/snd/ce569c9a5108.mp3", "i_hihi": "assets/snd/9c8910580b2c.mp3", "n24_fester": "assets/snd/62af96e91cb6.mp3", "n_lauter": "assets/snd/514e958e006e.mp3", "r_lauter": "assets/snd/2e0c8abce899.mp3", "r_like_emily": "assets/snd/9f24a0a81f00.mp3", "r_tipp_licht": "assets/snd/df132d7b84f0.mp3"};  /*SND: e_{1..7} a_super a_toll a_prima a_juhu a_wunderbar a_nach r_like_emily a_final r_tipp_licht i_hihi*/
/* тексты фраз; записи — art/voice_new.json (голоса: n — ведущая, r — русская подсказка, e — Эмили, b — Абиха, i — Изабель) */
const SAY = {
  n29_intro: 'Auf dem Hof der Kita. Emily und Abiha drehen das Springseil. Isabel springt!',
  e29_teddy: 'Teddybär, Teddybär, dreh dich um!',
  n29_zaehl: 'Zähl mit, wie oft Isabel springt!',
  i29_zwanzig: 'Ich habe zwanzig geschafft!',
  n29_wie_viele: 'Wie viele Sprünge waren es wirklich?',
  r29_wie_viele: 'Сколько раз Изабель прыгнула на самом деле?',
  e29_stimmt_nicht: 'Nein, das stimmt nicht. Es waren sieben.',
  i29_doch: 'Doch! Zwanzig!',
  n24_fester: 'Das hat nicht geklappt. Sag es noch einmal, mit fester Stimme!',
  e29_gezaehlt: 'Nein! Ich habe mitgezählt. Es waren sieben.',
  i29_okay: 'Okay … sieben. Das ist auch gut.',
  e29_ich_auch: 'Jetzt möchte ich springen!',
  i29_klein: 'Du bist zu klein! Du kannst das nicht!',
  e29_kann: 'Doch! Ich kann das!',

  e29_nicht_nett: 'Hör auf! Das ist nicht nett. Ich will es probieren!',

  b29_schaffst: 'Du schaffst das, Emily!',
  n29_tipp_spring: 'Wenn das Seil unten ist, tipp auf Emily! Dann springt sie.',
  r29_tipp_spring: 'Когда верёвка внизу — нажми на Эмили, и она прыгнет!',

  i29_wow: 'Wow! Du kannst das ja wirklich! Entschuldigung, Emily.',

  i29_freunde: 'Ja! Wieder Freunde!',
  n29_ende: 'Super! Emily hat gesagt: Doch, ich kann das! Und sie hat es geschafft.',
  n_lauter: 'Lauter! Sag es mit fester Stimme!',
  r_lauter: 'Громче! Скажи твёрдо и громко!'
};

<script>
/* Уровень 29: скакалка. Эмили и Абиха крутят, Изабель прыгает, Эмили говорит народную считалку «Teddybär, Teddybär, dreh dich um!».
   Считаем прыжки Изабель (7), она хвастается «zwanzig» — выбор числа (7), «Nein, das stimmt nicht. Es waren sieben.», «Doch! Zwanzig!» → шаг 2 громче
   «Nein! Ich habe mitgezählt. Es waren sieben.» Изабель дразнит «Du bist zu klein!» → «Doch! Ich kann das!», «Hihi» → шаг 2 «Hör auf! Das ist nicht nett. Ich will es probieren!».
   Эмили прыгает: нажимать на неё, когда верёвка внизу (она светится), 5 прыжков. Изабель извиняется, мирятся. */
const LEVEL = 29, FRIENDS = ['isabel', 'abiha'];
const STICKER = '<svg viewBox="0 0 100 100"><path d="M14 30 Q50 110 86 30" fill="none" stroke="#ff7a59" stroke-width="6" stroke-linecap="round"/><rect x="6" y="18" width="12" height="22" rx="5" fill="#2f80ed"/><rect x="82" y="18" width="12" height="22" rx="5" fill="#2f80ed"/><circle cx="50" cy="40" r="10" fill="#ffd7b5"/><path d="M42 52 h16 l4 20 h-24 z" fill="#ff8fc8"/></svg>';
function drawScene(g, W, H, L){ drawYard(g, W, H, L); }

let emily, abiha, isabel, rope, phase = 0, ropeOn = false, ropeSpeed = 1;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'laugh', 'walk'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'jump', 'laugh'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
const LX = 0.24, RX = 0.76, MX = 0.5;
function setup(){
  stage.querySelectorAll('.char,.prop,#rope').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  rope = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); rope.id = 'rope';
  Object.assign(rope.style, {position: 'absolute', left: 0, top: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 39, overflow: 'visible'});
  rope.innerHTML = '<path fill="none" stroke="#ff7a59" stroke-width="5" stroke-linecap="round"/>'; stage.appendChild(rope);
  abiha = T.hero('abiha', {x: RX, outfit: 'out', poses: AP}); abiha.face(true);
  isabel = T.hero('isabel', {x: MX, h: 0.95, poses: KP});
  emily = T.hero('emily', {x: LX, outfit: 'out', poses: EP});
}
/* скакалка: дуга между руками крутящих, фаза 0 — вверху над головой, 0.5 — внизу у ног */
function drawRope(){
  const a = T.heroes[rope.dataset.l || 'emily'], b = abiha; if (!a || !L.W) return;
  const hy = L.floorY - L.hE*0.5, x1 = L.W*a.x + L.hE*0.12, x2 = L.W*b.x - L.hE*0.12;
  const c = Math.cos(phase*2*Math.PI), cy = hy - c*L.hE*1.05 + L.hE*0.15;
  rope.firstChild.setAttribute('d', `M${x1} ${hy} Q${(x1 + x2)/2} ${cy} ${x2} ${hy}`);
  rope.style.zIndex = c < 0 ? 52 : 39;                       /* внизу — перед прыгуном, вверху — за ним */
}
let last = 0;
function loop(t){ requestAnimationFrame(loop); const dt = Math.min(50, t - (last || t)); last = t; if (ropeOn) phase = (phase + dt/1000*0.55*ropeSpeed) % 1; drawRope(); }
requestAnimationFrame(loop);
const nearBottom = () => Math.abs(phase - 0.5) < 0.13;
/* ждём, пока верёвка дойдёт до низа */
async function waitBottom(){ while (!nearBottom()) await sleep(30); }
async function waitTop(){ while (nearBottom()) await sleep(30); }

async function story(){
  await play('n29_intro');
  ropeOn = true;
  await T.repeat('e29_teddy');
  isabel.el.classList.add('spin'); await sleep(1300); isabel.el.classList.remove('spin');
  /* считаем прыжки Изабель: 7, на восьмом запуталась */
  await play('n29_zaehl');
  for (let i = 1; i <= 7; i++){ await waitBottom(); isabel.set('jump'); isabel.hop(); showNum(i); emily.say('e_' + i); await waitTop(); isabel.set('idle'); }
  await waitBottom(); ropeOn = false; sfx.bonk(); isabel.set('idle'); hideNum();
  isabel.set('talk'); await isabel.say('i29_zwanzig'); isabel.set('jump'); isabel.hop(); await sleep(300); isabel.set('idle');
  await play('n29_wie_viele');
  await numChoice([5, 7, 20], 7, 'n29_wie_viele', 'r29_wie_viele');
  await T.repeat('e29_stimmt_nicht');
  isabel.set('talk'); await isabel.say('i29_doch'); isabel.set('idle');
  await play('n24_fester');
  await T.firm('e29_gezaehlt', {who: isabel, step: 2});
  isabel.set('talk'); await isabel.say('i29_okay'); isabel.set('idle');
  await T.bone(emily);

  /* Эмили хочет прыгать — Изабель дразнится */
  await T.repeat('e29_ich_auch');
  isabel.set('talk'); await isabel.say('i29_klein'); isabel.set('idle');
  await T.repeat('e29_kann');
  isabel.set('jump'); await isabel.say('i29_hihi'); isabel.set('idle');
  await play('n24_fester');
  await T.firm('e29_nicht_nett', {who: isabel, step: 2});
  isabel.set('talk'); await isabel.say('i29_probier'); isabel.set('idle');
  /* меняются местами: Изабель крутит, Эмили в середине */
  await Promise.all([isabel.walkTo(LX, 900), emily.walkTo(MX, 900)]); rope.dataset.l = 'isabel'; isabel.face(false);
  abiha.set('wave'); await abiha.say('b29_schaffst'); abiha.set('idle');
  await play('n29_tipp_spring');
  ropeSpeed = 0.7; ropeOn = true;
  let n = 0, k = 0; const t0 = performance.now();
  emily.el.classList.add('tap');
  const tapOrig = T.onTap; let tapped = false;
  T.onTap = el => { if (el === emily.el){ tapped = true; return true; } return tapOrig(el); };
  while (n < 5){
    await waitBottom(); tapped = false; emily.el.classList.add('tapme');
    const w0 = performance.now(); while (performance.now() - w0 < 1100 && !tapped) await sleep(30);
    emily.el.classList.remove('tapme');
    if (tapped || performance.now() - t0 > 60000){ n++; emily.set('jump'); emily.hop(); sfx.pop(); showNum(n); emily.say('e_' + n); await waitTop(); emily.set('idle'); }
    else { sfx.bonk(); if (++k % 3 === 0) await play(k % 9 === 0 ? 'r29_tipp_spring' : 'n29_tipp_spring'); }
  }
  T.onTap = tapOrig; emily.el.classList.remove('tap'); ropeOn = false; hideNum();
  await play('n29_fuenf'); emily.set('laugh'); abiha.set('jump'); sfx.fanfare(); await sleep(600); emily.set('idle'); abiha.set('idle');
  await T.bone(emily);
  isabel.set('talk'); await isabel.say('i29_wow'); isabel.set('idle');
  await T.repeat('e24_freunde');
  isabel.set('jump'); isabel.hop(); await isabel.say('i29_freunde'); isabel.set('idle'); T.hearts(isabel); T.hearts(emily);
  await T.bone(isabel);
  [emily, abiha, isabel].forEach(h => h.set('jump')); await play('n29_ende');
  [emily, abiha, isabel].forEach(h => h.set('idle'));
}
T.start(IMG.isabel_jump[0], setup);
setup();
</script>
