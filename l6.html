/* Комната во весь экран: сзади у стены укрытия (шкаф, диван, стол, коробка), спереди герои и миска Тео. */
:root{

}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#fff4d9;color:var(--ink)}
body{font-family:"Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#fff4d9}
#bg{position:absolute;left:0;top:0;display:block}
.char{position:absolute;cursor:pointer}
.char .body{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.char img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.char .shadow{position:absolute;left:10%;right:10%;bottom:-4%;height:8%;border-radius:50%;background:rgba(80,40,10,.18)}
.inspot .shadow{display:none}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
.hop{animation:hop .7s cubic-bezier(.3,.7,.4,1) !important}
@keyframes hop{0%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.06,.92)}45%{transform:translateY(-22%) scale(.97,1.04)}75%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1)}}
.squish{animation:squish .35s ease-out !important}
@keyframes squish{0%{transform:scale(1)}40%{transform:scale(1.07,.93)}100%{transform:scale(1)}}
.wiggle{animation:wiggle .5s ease-in-out 2 !important}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
/* укрытия */
.sback,.sfront{position:absolute;pointer-events:none}
.sfront{pointer-events:auto;cursor:pointer;transform-origin:50% 100%}
.sfront svg,.sback svg,.door svg{width:100%;height:100%;display:block;overflow:visible}
.holder{position:absolute;left:0;top:0;overflow:hidden;pointer-events:none}
.holder .char{pointer-events:none}
.door{position:absolute;transition:transform .45s cubic-bezier(.3,.8,.4,1)}
.shake{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4%) rotate(-1.5deg)}40%{transform:translateX(4%) rotate(1.5deg)}60%{transform:translateX(-3%)}80%{transform:translateX(2%)}}
.glow{filter:drop-shadow(0 0 6px #fff36b) drop-shadow(0 0 14px #ffd84d);animation:glowp 1s ease-in-out infinite}
@keyframes glowp{0%,100%{filter:drop-shadow(0 0 4px #fff36b) drop-shadow(0 0 10px #ffd84d)}50%{filter:drop-shadow(0 0 10px #fff36b) drop-shadow(0 0 22px #ffd84d)}}
#dark{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none;transition:opacity .8s;z-index:45}
#dark.on{opacity:1}
#bowl{position:absolute;z-index:52}
.bone{position:absolute;pointer-events:none;z-index:55}
.bone svg,#bowl svg{width:100%;height:100%;display:block;overflow:visible}
.bone.glowb{animation:glowb .7s ease-out forwards}
@keyframes glowb{0%{transform:scale(1)}40%{transform:scale(1.6) translateY(-30%);filter:drop-shadow(0 0 8px #fff36b)}100%{transform:scale(1.25) translateY(-10%);filter:drop-shadow(0 0 6px #fff36b)}}
/* счёт */
#count{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#num{font:800 clamp(64px,16vh,140px)/1 "Trebuchet MS",system-ui,sans-serif;color:#fff;text-shadow:0 6px 0 #d65a3b,0 0 30px rgba(255,216,77,.9)}
#num.pop{animation:numpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes numpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:80vw}
#dots i{width:clamp(14px,3vh,24px);height:clamp(14px,3vh,24px);border-radius:50%;background:#ffd84d;box-shadow:0 0 10px #ffd84d}
/* микрофон */
#mic{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px));
  width:96px;height:96px;border-radius:50%;border:0;background:var(--mic);color:#fff;
  box-shadow:0 6px 0 #1d5fb8;display:grid;place-items:center;cursor:pointer;z-index:80}
#mic svg{width:46px;height:46px}
#mic.on{animation:pulse 1.2s ease-out infinite}
#mic.heard{background:var(--ok);box-shadow:0 6px 0 #1f8a5a}
@keyframes pulse{0%{box-shadow:0 6px 0 #1d5fb8,0 0 0 0 rgba(47,128,237,.55)}100%{box-shadow:0 6px 0 #1d5fb8,0 0 0 28px rgba(47,128,237,0)}}
#level{position:absolute;inset:-10px;border-radius:50%;border:6px solid rgba(255,255,255,.9);transform:scale(.9);opacity:0;pointer-events:none}
#start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(205,238,255,.75);z-index:90}
#go{position:relative;width:min(56vw,56vh,260px);height:min(56vw,56vh,260px);border-radius:50%;border:10px solid #fff;

#go .play{position:absolute;right:-6%;bottom:-6%;width:34%;height:34%;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 5px 0 #d65a3b}
#go .play svg{width:46%;height:46%;margin-left:8%}

#again{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;
  border:0;background:var(--accent);box-shadow:0 6px 0 #d65a3b;display:grid;place-items:center;cursor:pointer;z-index:85;animation:bob 1.8s ease-in-out infinite}
#again svg{width:60px;height:60px}
#rotate{position:absolute;inset:0;z-index:95;background:#cdeeff;display:grid;place-items:center}
#rotate svg{width:min(50vw,220px);height:auto;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#cards{position:absolute;inset:0;z-index:72;display:flex;gap:4vw;align-items:center;justify-content:center;background:rgba(255,255,255,.35);transition:transform .6s ease-in,opacity .6s}
#cards.away{transform:translate(-40vw,-40vh) scale(.2);opacity:0}
.card{position:relative;width:min(24vw,36vh);aspect-ratio:3/4;max-width:100%;border-radius:18px;background:#fff7ec;border:6px solid #ffd84d;box-shadow:0 8px 0 #e2b98a;display:grid;place-items:end center;overflow:hidden;animation:numpop .5s cubic-bezier(.3,1.6,.5,1)}

.prop{position:absolute}

#numchoice span{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:90%}

let mic = null;

async function setupMic(){
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
    const src = actx.createMediaStreamSource(stream), an = actx.createAnalyser();

  return new Promise(resolve => {
    micBtn.hidden = false; micBtn.classList.remove('heard'); micBtn.classList.add('on');
    let finished = false;
    const end = ok => { if (finished) return; finished = true; micTapResolve = null; micBtn.classList.remove('on');
      levelRing.style.opacity = 0;
      if (ok){ micBtn.classList.add('heard'); sfx.ding(); setTimeout(() => { if (!micTapResolve){ micBtn.hidden = true; } micBtn.classList.remove('heard'); }, 600); }
      else micBtn.hidden = true;
      resolve(ok); };
    micTapResolve = end;
    if (!mic){ setTimeout(() => end(false), ms + 2000); return; }

    const tick = now => {
      if (finished) return;

      const thr = Math.max(0.03, floor*2.5 + 0.012);

/* Эмили-мультяшка говорит образец, настоящая Эмили повторяет.
   Игра ждёт: образец, ещё раз образец, «Sag es nach!» + образец, русская подсказка + образец, и снова по кругу. */
async function repeatAfter(model, speaker){
  const say = () => speaker ? speaker.talkWhile(play(model), speaker.name === 'emily' ? 'hold' : 'talk') : play(model);
  for (let i = 0; i < 12; i++){
    const c = i % 4;
    /* 1-й и 2-й раз просто фраза, 3-й раз «Sag es nach!» + фраза, 4-й раз русская подсказка + фраза */
    if (c === 2) await play('a_nach');
    if (c === 3) await play('r_like_emily');
    await say();
    await sleep(150);
    if (await listen()) return true;
  }
  return false;
}
/* Счёт: число загорается и звучит, Эмили повторяет, только потом следующее */
async function countTo(n, voice, speaker){
  const box = $('#count'), num = $('#num'), dots = $('#dots');
  box.hidden = false; dots.innerHTML = '';
  for (let i = 1; i <= n; i++){
    num.textContent = i; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
    const d = document.createElement('i'); dots.appendChild(d); sfx.pop();
    for (let a = 0; a < 12; a++){
      const c = a % 4;
      if (c === 2) await play('a_nach');
      if (c === 3) await play('r_repeat');
      if (speaker) await speaker.talkWhile(play(voice + i), 'talk'); else await play(voice + i);
      await sleep(100);
      if (await listen(5000)) break;
    }
  }
  await sleep(300); box.hidden = true;
}

async function flyTo(el, tx, ty){
  const r = el.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const dx = tx - (r.left - st.left + r.width/2), dy = ty - (r.top - st.top + r.height/2);

  sfx.whoosh(); await a.finished.catch(() => {}); a.cancel();
}

let tapR = null, tapSet = [];
function onTap(el){ if (tapR && tapSet.includes(el)){ const r = tapR; tapR = null; r(el); return true; } return false; }
for (const el of [...myShoes.map(o => o.el), ...hooks, ...washEls, basket]) el.addEventListener('pointerdown', e => { e.preventDefault(); if (!onTap(el)) sfx.bonk(); });
async function waitTap(set, hint, ruHint, glowSet){
  tapSet = set; const p = new Promise(r => tapR = r);
  let done = false; p.then(() => done = true);
  pulseWhile(() => set, () => done);
  (async () => { let k = 0; while (!done){ await sleep(8000); if (done) break; k++;
    (glowSet || set).forEach(el => { el.classList.add('glow'); setTimeout(() => el.classList.remove('glow'), 3000); });
    if (!speaking) await play(k % 2 === 0 ? ruHint : hint); } })();
  return p;
}
/* выбор числа: три кнопки с цифрой и точками */
async function numChoice(opts, right, hint, ruHint, wrongClip){
  while (true){
    choice.innerHTML = opts.map(n => `<button data-n="${n}" aria-label="${n}"><b>${n}</b><span>${'<i></i>'.repeat(n)}</span></button>`).join('');
    choice.hidden = false;
    const p = new Promise(r => { choice.querySelectorAll('button').forEach(b => b.addEventListener('click', () => r(+b.dataset.n), {once:true})); });
    let done = false; p.then(() => done = true);
    (async () => { let k = 0; while (!done){ await sleep(8000); if (done) break; k++; if (!speaking) await play(k % 2 === 0 ? ruHint : hint); } })();
    const n = await p; choice.hidden = true;
    if (n === right){ sfx.ding(); return; }
    sfx.bonk(); await play(wrongClip);
  }
}

/* Показывает две сцены, ведущая озвучивает каждую (сцена подсвечивается), потом спрашивает.
   Возвращает номер выбранной сцены. */
async function chooseScene(opts, askClip, ruAsk){
  let box = document.getElementById('scenes');
  if (!box){ box = document.createElement('div'); box.id = 'scenes'; document.getElementById('stage').appendChild(box); }
  box.innerHTML = ''; box.hidden = false;
  const cards = opts.map(o => sceneCard(o.parts, o.bg, o.ground));
  cards.forEach(c => box.appendChild(c));
  let picked = null, resolveP;
  const p = new Promise(r => resolveP = r);
  cards.forEach((c, i) => c.addEventListener('click', () => { if (picked === null){ picked = i; resolveP(i); } }));
  const narrate = async () => {
    for (let i = 0; i < opts.length && picked === null; i++){
      cards[i].classList.add('lit'); await play(opts[i].clip); cards[i].classList.remove('lit'); await sleep(200);
    }
  };
  (async () => {
    await narrate(); if (picked === null) await play(askClip);
    let k = 0;
    while (picked === null){ await sleep(9000); if (picked !== null) break; k++;
      if (k % 2 === 0) await play(ruAsk); else { await narrate(); if (picked === null) await play(askClip); } }
  })();
  const i = await p;
  cards[i].classList.add('lit'); sfx.pop(); await sleep(500);
  box.hidden = true;
  return i;
}

/* Пока игра ждёт нажатия, все возможные цели мягко пульсируют (единый знак «на меня можно нажать») */
const BUSY_CLS = ['glow','bounce','squish','wobble','hop','wiggle','pop'];
async function pulseWhile(getEls, isDone){
  let on = new Set();
  while (!isDone()){
    const now = new Set((getEls() || []).filter(Boolean));
    on.forEach(el => { if (!now.has(el)) el.classList.remove('tapme'); });
    now.forEach(el => el.classList.toggle('tapme', !BUSY_CLS.some(c => el.classList.contains(c)))); on = now;
    await sleep(300);
  }
  on.forEach(el => el.classList.remove('tapme'));
}

/* Герой переходит из одной точки в другую пешком: копия героя идёт, покачиваясь, настоящий появляется на месте */
function fxWalkGhost(h, from, to, fromZ, toZ){
  const g = h.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('inspot');
  const real = [...h.body.querySelectorAll('img')], gi = [...g.querySelectorAll('img')];
  const walkImg = h.imgs.walk || h.imgs.idle, k = real.indexOf(walkImg);
  if (k >= 0) gi.forEach((im, i) => { im.hidden = i !== k; });
  const held = g.querySelector('.held'); if (held && h.held && !h.held.hidden) held.hidden = false;
  Object.assign(g.style, {left:from.x + 'px', top:from.y + 'px', width:from.w + 'px', height:from.h + 'px', zIndex:fromZ, visibility:'visible', opacity:1, transform:'none', transition:'none'});
  stage.appendChild(g); h._ghost = g; h.el.style.visibility = 'hidden';
  const dx = to.x - from.x, dy = to.y - from.y, sx = to.w/from.w, sy = to.h/from.h;
  const d = Math.hypot(dx, dy), ms = Math.max(450, Math.min(1500, 380 + d*2.1));
  const end = `translate(${dx}px,${dy}px) scale(${sx},${sy})`;
  const a = g.animate([{transform:'none', zIndex:fromZ}, {zIndex:fromZ, offset:.7}, {zIndex:toZ, offset:.72}, {transform:end, zIndex:toZ}], {duration:ms, easing:'ease-in-out', fill:'forwards'});
  if (typeof sfx !== 'undefined' && sfx.step) sfx.step(ms);
  return a.finished.catch(() => {}).then(() => { if (h._ghost === g) fxEndGhost(h); });
}

    const keyOf = p => (o && SIZE[this.name + '_' + p + o]) ? this.name + '_' + p + o : this.name + '_' + p;
    const idle = SIZE[keyOf('idle')];
    this.k = (L.hE*this.hFactor*kMul)/idle[1];
    const bw = idle[0]*this.k, bh = idle[1]*this.k;
    this.box = {x: x - bw/2, y: baseY - bh, w: bw, h: bh};
    Object.assign(this.el.style, {left:this.box.x + 'px', top:this.box.y + 'px', width:bw + 'px', height:bh + 'px'});
    for (const [p, im] of Object.entries(this.imgs)){
      const key = keyOf(p); if (!SIZE[key]) continue;
      const [w, h] = SIZE[key]; let ox, oy;
      if (OFF[key]) { [ox, oy] = OFF[key]; } else { ox = (idle[0] - w)/2; oy = idle[1] - h; }
      Object.assign(im.style, {left:ox*this.k + 'px', top:oy*this.k + 'px', width:w*this.k + 'px', height:h*this.k + 'px'});
    }
  };
}

  const KEY = 'emily-game';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ return {}; } };
  const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} };
  const stage = document.getElementById('stage'), again = document.getElementById('again');
  /* кнопка «на карту» */
  const css = document.createElement('style');
  css.textContent = `#tomap{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:96;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #e2b98a;display:grid;place-items:center}
  #tomap svg{width:34px;height:34px}
  #sticker{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:84;width:min(30vw,34vh);aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;border:8px solid #ffd84d;box-shadow:0 8px 0 #e2b98a;display:grid;place-items:center;padding:8%;box-sizing:border-box;animation:stickin .7s cubic-bezier(.3,1.6,.5,1)}
  #sticker svg,#sticker img{max-width:100%;max-height:100%}
  @keyframes stickin{0%{transform:translateX(-50%) scale(.2) rotate(-30deg);opacity:0}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1}}`;
  document.head ? document.head.appendChild(css) : document.body.appendChild(css);
  const a = document.createElement('a'); a.id = 'tomap'; a.href = 'index.html'; a.setAttribute('aria-label', 'Карта уровней');

  stage.appendChild(a);
  let marked = false;
  function done(){
    if (marked) return; marked = true;
    const d = load(); d.done = d.done || {}; d.done[LEVEL] = (d.done[LEVEL] || 0) + 1;
    const nb = document.querySelectorAll('.bone').length;
    d.bones = (d.bones || 0) + Math.max(1, nb);
    d.friends = d.friends || {}; FRIENDS.forEach(f => d.friends[f] = true);
    save(d);
    const s = document.createElement('div'); s.id = 'sticker'; s.innerHTML = STICKER; stage.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
  new MutationObserver(() => { if (!again.hidden) done(); }).observe(again, {attributes:true, attributeFilter:['hidden']});
  again.addEventListener('click', () => { marked = false; });
})();
