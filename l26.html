   Неправа Эмили: берёт зелёный мелок Изабель без спроса → «Entschuldigung. Darf ich die grüne Kreide haben?». Цветок: 6 лепестков. */
const LEVEL = 26, FRIENDS = ['paul', 'isabel', 'abiha'];
const STICKER = '<svg viewBox="0 0 100 100"><circle cx="40" cy="40" r="16" fill="#ffd34d"/><g stroke="#ffd34d" stroke-width="6" stroke-linecap="round"><path d="M40 10 v8 M40 62 v8 M10 40 h8 M62 40 h8 M19 19 l6 6 M55 55 l6 6 M19 61 l6 -6 M55 25 l6 -6"/></g><rect x="56" y="64" width="38" height="12" rx="6" transform="rotate(-35 75 70)" fill="#ff8fc8" stroke="#d6476a" stroke-width="2"/><rect x="50" y="78" width="38" height="12" rx="6" transform="rotate(-20 69 84)" fill="#4a8ff0" stroke="#2a5fb0" stroke-width="2"/></svg>';
function drawScene(g, W, H, L){ drawYard(g, W, H, L); }
/* мелки и рисунки (рисунки «лежат» на асфальте — сплющены) */
const CH = {gelb: ['#ffd34d', '#d6a21e'], blau: ['#4a8ff0', '#2a5fb0'], gruen: ['#3cc36a', '#24924a'], rosa: ['#ff8fc8', '#d6476a'], rot: ['#ff5a4a', '#c43a2e']};
const CHALK = c => `<svg viewBox="0 0 30 80"><rect x="4" y="4" width="22" height="72" rx="10" fill="${c[0]}" stroke="${c[1]}" stroke-width="3"/><path d="M6 20 h18" stroke="#fff" stroke-width="3" opacity=".5"/></svg>`;
const SUN = n => `<svg viewBox="0 0 200 100"><g transform="translate(100 50) scale(1 .45)">${Array.from({length: n}, (_, i) => { const a = -Math.PI/2 + i*2*Math.PI/5; return `<path d="M${Math.cos(a)*62} ${Math.sin(a)*62} L${Math.cos(a)*96} ${Math.sin(a)*96}" stroke="#ffd34d" stroke-width="12" stroke-linecap="round"/>`; }).join('')}<circle r="50" fill="#ffd34d" stroke="#f0b820" stroke-width="5"/><circle cx="-16" cy="-10" r="6" fill="#8a5a1e"/><circle cx="16" cy="-10" r="6" fill="#8a5a1e"/><path d="M-20 14 Q0 32 20 14" fill="none" stroke="#8a5a1e" stroke-width="6" stroke-linecap="round"/></g></svg>`;
const FLOWER = (stem, n) => `<svg viewBox="0 0 160 100"><g transform="translate(80 54) scale(1 .5)">${stem ? '<path d="M0 10 V90" stroke="#3cc36a" stroke-width="10" stroke-linecap="round"/><path d="M0 60 Q-30 40 -40 60 Q-20 70 0 60 M0 72 Q30 52 40 70 Q20 80 0 72" fill="#3cc36a"/>' : ''}` +
  Array.from({length: n}, (_, i) => { const a = -Math.PI/2 + i*Math.PI/3; return `<ellipse cx="${Math.cos(a)*30}" cy="${-40 + Math.sin(a)*30}" rx="18" ry="24" transform="rotate(${a*57.3 + 90} ${Math.cos(a)*30} ${-40 + Math.sin(a)*30})" fill="#ff8fc8" stroke="#d6476a" stroke-width="3"/>`; }).join('') +
  `<circle cy="-40" r="16" fill="#ffd34d"/></g></svg>`;

let emily, abiha, isabel, paul, heike, sun, flower, chalks = {}, igreen;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'jump', 'surprised', 'crouch', 'laugh', 'walk'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'walk', 'jump', 'laugh'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
const gy = () => L.floorY + L.hE*0.06;             /* «асфальт» перед героями */
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = []; chalks = {};
  sun = T.prop(SUN(0), {x: 0.42, py: gy, w: 0.9, ratio: 0.5, z: 30}); sun.el.hidden = true;
  flower = T.prop(FLOWER(false, 0), {x: 0.7, py: gy, w: 0.7, ratio: 100/160, z: 30}); flower.el.hidden = true;
  ['gelb', 'blau', 'gruen', 'rosa', 'rot'].forEach((c, i) => { chalks[c] = T.prop(CHALK(CH[c]), {x: 0.08 + i*0.045, py: () => L.floorY + L.hE*0.08, w: 0.08, ratio: 80/30, z: 60}); chalks[c].el.style.transform = 'rotate(70deg)'; });
  igreen = T.prop(CHALK(CH.gruen), {x: 0.9, py: () => L.floorY + L.hE*0.08, w: 0.08, ratio: 80/30, z: 60}); igreen.el.style.transform = 'rotate(70deg)';
  heike = T.hero('sommer', {x: -0.25, h: 1.45, poses: ['idle', 'blink', 'talk', 'wave']});
  isabel = T.hero('isabel', {x: 0.88, h: 0.95, poses: KP});

  abiha = T.hero('abiha', {x: -0.2, outfit: 'out', poses: AP});
  emily = T.hero('emily', {x: 0.28, outfit: 'out', poses: EP}); emily.set('crouch');
}
const count = async i => { showNum(i); await emily.say('e_' + i); };
const laughAll = async () => { emily.set('laugh'); isabel.set('jump'); paul.set('jump'); await Promise.all([play('k_laugh'), play('i_hihi'), play('p_hihi')]); [emily, isabel, paul].forEach(h => h.set('idle')); };

async function story(){
  /* 1. солнце: жёлтый мелок, 5 лучей */
  await play('n26_intro');
  await play('n26_sonne');
  while (true){
    const el = await T.tap(Object.values(chalks), 'n26_sonne', 'r26_sonne');
    if (el === chalks.gelb.el) break;
    el.classList.add('shake'); sfx.bonk(); await play('n26_nicht');
  }
  sfx.ding(); sun.el.hidden = false; sun.el.animate([{opacity: 0, transform: 'scale(.4)'}, {opacity: 1, transform: 'none'}], {duration: 500});
  await T.repeat('e26_sonne');
  await play('n26_strahlen');
  for (let i = 1; i <= 5; i++){ await T.tap([sun], 'n26_strahlen', 'r_tipp_licht'); sun.el.innerHTML = SUN(i); sfx.pop(); await count(i); }
  hideNum(); await play('n26_fuenf'); await T.bone(sun);

  /* 2. Пауль берёт розовый мелок — вся лестница */
  await play('n26_blume');
  paul.set('talk'); await paul.walkTo(0.24, 1300); chalks.rosa.el.hidden = true; sfx.whoosh();
  await paul.say('p26_nehme'); paul.set('idle'); await paul.walkTo(0.6, 700); paul.face(true);
  emily.set('surprised'); await sleep(300); emily.set('idle');
  /* шаг 1 — вежливо */
  await T.repeat('e26_zurueck');
  paul.set('talk'); await paul.say('p26_aber'); paul.set('idle');
  /* шаг 2 — твёрже */
  await play('n24_fester');
  await T.firm('e26_frag', {who: paul, step: 2});
  paul.set('talk'); await paul.say('p26_pff'); paul.set('jump');
  /* прыгает по солнцу */
  await paul.walkTo(0.44, 600);
  for (let k = 0; k < 3; k++){ paul.hop(); sfx.bonk(); T.burst([L.W*0.44, L.floorY], null, '#ffd34d', 8); await sleep(450); }
  sun.el.style.filter = 'blur(2px)'; sun.el.style.opacity = .55;
  emily.set('surprised'); await play('n26_drauf');
  /* шаг 3 — ладонь, «Stopp!» */
  await play('n19_stopp_tipp'); await play('r19_stopp');
  await T.firm('e26_stopp', {who: paul, step: 3});
  paul.set('jump'); paul.hop(); await paul.say('p26_hihi'); paul.hop(); sfx.bonk();
  /* шаг 4 — что делать? позвать Хайке */
  await play('n26_hilfe');
  const cards = () => [
    {parts: [{img: 'emily_wave_out', x: 36, h: 70}, {img: 'paul_jump', x: 66, h: 66, rot: 14}, {fx: 'zap', x: 44, y: 34}], clip: 'n26_opt_schubsen', ok: false, bg: '#eef2f6', ground: '#b9b9c2'},
    {parts: [{img: 'emily_wave_out', x: 30, h: 66}, {img: 'sommer_wave', x: 70, h: 86}], clip: 'n19_opt_heike', bg: '#eef2f6', ground: '#b9b9c2'},
    {parts: [{img: 'emily_crouch_out', x: 40, h: 52}, {fx: 'tears', x: 40, y: 44}, {img: 'paul_jump', x: 72, h: 66}], clip: 'n19_opt_weinen', ok: false, bg: '#eef2f6', ground: '#b9b9c2'}];
  while (true){
    const i = await T.choose(cards(), 'n19_was', 'r19_was');
    if (i === 1) break;
    if (i === 0){ await play('n26_schubsen_nein'); continue; }
    emily.set('crouch'); T.tears(emily, true); paul.hop(); sfx.bonk(); await play('n19_weinen'); T.tears(emily, false); emily.set('idle');
  }
  emily.set('wave'); await T.repeat('e26_heike'); emily.set('idle');
  heike.set('talk'); await heike.walkTo(0.14, 1300);
  paul.set('idle'); await heike.say('s26_paul'); heike.set('idle');
  paul.set('talk'); await paul.walkTo(0.4, 500); paul.face(true); await paul.say('p26_entschuldigung'); paul.set('idle');
  await T.repeat('e26_ja');
  chalks.blau.el.hidden = true; paul.set('talk'); await paul.say('p26_danke'); paul.set('idle');
  chalks.rosa.el.hidden = false; sfx.pop(); T.hearts(paul);
  sun.el.style.filter = ''; sun.el.style.opacity = ''; sfx.ding();
  await T.bone(emily);
  await heike.walkTo(-0.25, 1000);

  /* 3. неправа Эмили: зелёный мелок Изабель */
  await play('n26_gruen');
  emily.set('walk'); await emily.walkTo(0.8, 900); igreen.el.hidden = true; sfx.whoosh(); await emily.walkTo(0.6, 600); emily.set('idle');
  await play('n26_nimmt');
  isabel.set('talk'); await isabel.say('i26_hey'); isabel.set('idle');
  const cards2 = () => [
    {parts: [{img: 'emily_walk_out', x: 30, h: 68}, {img: 'isabel_idle', x: 72, h: 66}, {fx: 'tears', x: 71, y: 34}], clip: 'n26_opt_weg', ok: false, bg: '#eef2f6', ground: '#b9b9c2'},
    {parts: [{img: 'emily_wave_out', x: 34, h: 70}, {img: 'isabel_wave', x: 68, h: 66}, {fx: 'hearts', x: 50, y: 18}], clip: 'n26_opt_fragen', bg: '#eef2f6', ground: '#b9b9c2'}];
  while ((await T.choose(cards2(), 'n19_was', 'r19_was')) === 0) await play('n26_weg_nein');
  await emily.walkTo(0.74, 500);
  await T.repeat('e26_darf');
  isabel.set('jump'); isabel.hop(); await isabel.say('i26_klar'); isabel.set('idle'); T.hearts(isabel);
  await T.bone(isabel);

  /* цветок: стебель и 6 лепестков */
  await emily.walkTo(0.62, 500); emily.set('crouch');
  flower.el.hidden = false; flower.el.innerHTML = FLOWER(true, 0); sfx.pop();
  await play('n26_blaetter');
  for (let i = 1; i <= 6; i++){ await T.tap([flower], 'n26_blaetter', 'r_tipp_licht'); flower.el.innerHTML = FLOWER(true, i); sfx.pop(); await count(i); }
  hideNum(); await play('n26_sechs'); emily.set('idle');

  /* все вместе */
  abiha.set('walk'); await abiha.walkTo(0.12, 1200); abiha.set('wave'); await abiha.say('b26_mit'); abiha.set('idle');
  await T.repeat('e26_klar');
  heike.set('talk'); await heike.walkTo(0.06, 900); await heike.say('s26_toll'); heike.set('idle');
  await T.bone(emily);
  [emily, abiha, isabel, paul].forEach(h => h.set('jump')); await play('n26_ende');
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
}
T.start(IMG.emily_crouch_out[0], setup);
setup();
</script>
