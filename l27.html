/* Уровень 27: Stopptanz. Хайке объясняет правило. Эмили — ди-джей: нажимает кнопку — своя весёлая музыка, дети танцуют; ещё раз — тишина, все замирают.

   «Entschuldigung, Abiha! Tut es weh?». Абиха выбывает — сколько осталось (2). Эмили и Изабель выиграли. */
const LEVEL = 27, FRIENDS = ['paul', 'isabel', 'abiha'];
const STICKER = '<svg viewBox="0 0 100 100"><path d="M34 74 V22 L80 12 V64" fill="none" stroke="#9b6bff" stroke-width="7" stroke-linejoin="round"/><ellipse cx="26" cy="76" rx="12" ry="9" fill="#9b6bff"/><ellipse cx="72" cy="66" rx="12" ry="9" fill="#9b6bff"/><rect x="58" y="78" width="30" height="16" rx="5" fill="#ff5a4a"/><rect x="64" y="82" width="6" height="8" fill="#fff"/><rect x="74" y="82" width="6" height="8" fill="#fff"/></svg>';
function drawScene(g, W, H, L){
  const fy = L.floorY, hE = L.hE;
  g.fillStyle = '#e9f3ff'; g.fillRect(0, 0, W, fy); g.fillStyle = '#cfe3fb'; g.fillRect(0, fy - hE*0.5, W, hE*0.45);
  /* шведская стенка и окна */
  g.strokeStyle = '#c9934e'; g.lineWidth = hE*0.035; const wx = W*0.04;
  for (const dx of [0, hE*0.5]){ g.beginPath(); g.moveTo(wx + dx, fy - hE*1.7); g.lineTo(wx + dx, fy); g.stroke(); }
  g.lineWidth = hE*0.02; for (let y = fy - hE*1.6; y < fy; y += hE*0.15){ g.beginPath(); g.moveTo(wx, y); g.lineTo(wx + hE*0.5, y); g.stroke(); }
  for (const x of [0.3, 0.55, 0.8]){ g.fillStyle = '#8fd3ff'; g.fillRect(W*x, fy - hE*1.7, hE*0.55, hE*0.45); g.strokeStyle = '#fff'; g.lineWidth = hE*0.03; g.strokeRect(W*x, fy - hE*1.7, hE*0.55, hE*0.45); }
  /* гирлянда флажков */
  const cols = ['#ff7a59', '#ffd34d', '#32b67a', '#2f80ed', '#ff8fc8', '#9b6bff'];
  for (let i = 0; i < 16; i++){ const x = W*i/15, y = fy - hE*1.95 + Math.sin(i/15*Math.PI)*hE*0.15; g.fillStyle = cols[i % cols.length]; g.beginPath(); g.moveTo(x - hE*0.05, y); g.lineTo(x + hE*0.05, y); g.lineTo(x, y + hE*0.12); g.fill(); }
  /* деревянный пол и скамейка справа */
  const gr = g.createLinearGradient(0, fy - hE*0.05, 0, H); gr.addColorStop(0, '#e6b77a'); gr.addColorStop(1, '#d19a5a'); g.fillStyle = gr; g.fillRect(0, fy - hE*0.05, W, H);
  g.strokeStyle = 'rgba(150,95,40,.35)'; g.lineWidth = 1; for (let x = 0; x < W; x += hE*0.3){ g.beginPath(); g.moveTo(x, fy - hE*0.05); g.lineTo(x - hE*0.2, H); g.stroke(); }
  g.fillStyle = '#5aa8f0'; g.fillRect(W*0.86, fy - hE*0.32, hE*0.7, hE*0.07); g.fillRect(W*0.86 + hE*0.05, fy - hE*0.3, hE*0.05, hE*0.3); g.fillRect(W*0.86 + hE*0.6, fy - hE*0.3, hE*0.05, hE*0.3);
}
const BOX = on => `<svg viewBox="0 0 100 100"><rect x="8" y="14" width="84" height="80" rx="16" fill="#ff5a4a" stroke="#c43a2e" stroke-width="5"/><circle cx="50" cy="44" r="20" fill="#ffd9d0" stroke="#c43a2e" stroke-width="4"/><circle cx="50" cy="44" r="8" fill="#c43a2e"/>` +
  (on ? '<rect x="38" y="70" width="8" height="16" rx="2" fill="#fff"/><rect x="54" y="70" width="8" height="16" rx="2" fill="#fff"/>' : '<path d="M42 68 L62 78 L42 88 Z" fill="#fff"/>') + '</svg>';

let emily, abiha, isabel, paul, heike, box;
const EP = ['idle', 'blink', 'mouth1', 'mouth2', 'talk', 'wave', 'jump', 'surprised', 'laugh'];
const AP = ['idle', 'blink', 'mouth1', 'mouth2', 'wave', 'peace', 'jump', 'laugh', 'sit', 'think'];
const KP = ['idle', 'blink', 'talk', 'wave', 'jump'];
function setup(){
  stage.querySelectorAll('.char,.prop').forEach(e => e.remove()); T.heroes = {}; T.props = [];
  box = T.prop(BOX(false), {x: 0.16, py: () => L.floorY - L.hE*0.02, w: 0.3, z: 45});
  heike = T.hero('sommer', {x: 0.06, h: 1.45, poses: ['idle', 'blink', 'talk', 'wave']});
  abiha = T.hero('abiha', {x: 0.44, poses: AP});
  isabel = T.hero('isabel', {x: 0.58, h: 0.95, poses: KP});
  paul = T.hero('paul', {x: 0.72, h: 0.97, poses: KP});
  emily = T.hero('emily', {x: 0.28, poses: EP});
}
/* своя музыка: бас и мелодия (не настоящая песня) */
let music = false;
async function tune(){ music = true; box.el.innerHTML = BOX(true);
  const mel = [659, 784, 880, 784, 659, 587, 523, 587, 659, 659, 784, 659, 587, 523, 587, 659], bass = [131, 131, 165, 165, 175, 175, 196, 196]; let i = 0;
  while (music){ sfx.tone(mel[i % 16], mel[i % 16], 180, 'square', .05); if (i % 2 === 0) sfx.tone(bass[(i/2) % 8], bass[(i/2) % 8], 300, 'triangle', .12); i++; await sleep(215); } }
function stopTune(){ music = false; box.el.innerHTML = BOX(false); }
const dancers = () => [emily, abiha, isabel, paul].filter(h => h.dancing !== false);
function danceAll(list, on){ list.forEach((h, i) => { h.el.classList.toggle('dance', on); h.set(on ? (i % 2 ? 'jump' : 'idle') : 'idle'); }); }
async function round(dj, list){
  /* ди-джей: Эмили сама жмёт кнопку, или Пауль — автоматически */
  if (dj === emily){ await T.tap([box], 's27_dj', 'r27_knopf'); } else { dj.set('talk'); await sleep(500); dj.set('idle'); }
  tune(); danceAll(list, true); await sleep(dj === emily ? 1800 : 2600);
  if (dj === emily){ await play('n27_stopp_knopf'); await T.tap([box], 'n27_stopp_knopf', 'r27_knopf'); }
  stopTune(); danceAll(list, false); sfx.bonk();
}

async function story(){
  await play('n27_intro');
  heike.set('talk'); await heike.say('s27_regel'); heike.set('idle');
  /* 1. Эмили — ди-джей */
  await emily.walkTo(0.24, 500); emily.face(false);
  await heike.say('s27_dj');
  let list = [abiha, isabel, paul];
  await round(emily, list);
  await sleep(500); paul.el.classList.add('wobble');
  await play('n25_wer');
  while (true){ const el = await T.tap(list, 'n25_wer', 'r25_wer'); if (el === paul.el) break; sfx.bonk(); await play('n25_nein'); }
  paul.el.classList.remove('wobble'); sfx.ding();
  await T.repeat('e27_raus');
  paul.set('talk'); await paul.say('p27_gilt_nicht'); paul.set('idle'); paul.hop();
  await play('n24_fester');
  await T.firm('e27_regel', {who: paul, step: 2});
  paul.set('talk'); await paul.say('p27_na_gut'); paul.set('idle');
  await paul.walkTo(0.92, 900);
  await T.bone(emily);
  await play('n27_wie_viele');
  await numChoice([2, 3, 4], 3, 'n27_wie_viele', 'r27_wie_viele');
  await play('n27_drei');

  /* 2. Пауль — ди-джей, Эмили танцует; извинения в обе стороны */
  heike.set('talk'); await heike.say('s27_tauschen'); heike.set('idle');
  await Promise.all([paul.walkTo(0.2, 1000), emily.walkTo(0.34, 700)]);
  list = [emily, abiha, isabel];
  tune(); danceAll(list, true); await sleep(1500);
  /* Изабель случайно толкает Эмили */
  await isabel.walkTo(0.4, 300); sfx.bonk(); emily.set('surprised'); emily.el.classList.remove('dance');
  await T.glide(emily, 0.3, 0, 300, 'ease-out');
  stopTune(); danceAll(list, false);
  isabel.set('talk'); await isabel.say('i27_entschuldigung'); isabel.set('idle');
  await play('n27_annehmen');
  await T.repeat('e27_schon_gut');
  T.hearts(isabel); await isabel.walkTo(0.58, 500); await T.bone(isabel);
  /* Эмили наступила Абихе на ногу */
  tune(); danceAll(list, true); await sleep(1200);
  emily.el.classList.remove('dance'); await emily.walkTo(0.42, 400); sfx.bonk(); stopTune(); danceAll(list, false);
  abiha.set('think'); await abiha.say('b27_aua');
  await play('n27_fuss');
  await T.repeat('e27_tut_weh');
  abiha.set('laugh'); await abiha.say('b27_schon_gut'); abiha.set('idle'); T.hearts(abiha);
  await emily.walkTo(0.34, 400); await T.bone(abiha);
  /* Абиха засмеялась и выбыла */
  await round(paul, list);
  abiha.set('laugh'); abiha.el.classList.add('wobble'); await sleep(700); abiha.el.classList.remove('wobble');
  paul.set('talk'); await paul.say('p27_abiha'); paul.set('idle');
  abiha.set('laugh'); await abiha.say('b27_okay'); abiha.set('idle'); await abiha.walkTo(0.92, 900);
  await play('n27_wie_viele');
  await numChoice([1, 2, 3], 2, 'n27_wie_viele', 'r27_wie_viele');
  await play('n27_zwei');
  /* последняя: Эмили и Изабель замерли — победили */
  list = [emily, isabel];
  await round(paul, list);
  emily.set('jump'); isabel.set('jump'); await sleep(600);
  heike.set('wave'); await heike.say('s27_gewonnen'); heike.set('idle'); sfx.fanfare();
  emily.el.classList.add('spin'); await sleep(1300); emily.el.classList.remove('spin');
  await T.bone(emily);
  [emily, abiha, isabel, paul].forEach(h => h.set('jump')); await play('n27_ende');
  [emily, abiha, isabel, paul].forEach(h => h.set('idle'));
}
